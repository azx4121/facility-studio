<script type="application/json" id="tutorial-data">{"content":{"zh-Hant":[{"id":"start","title":"1. 先選對入口","html":"<h2>1. 先選對入口<\/h2>\n<table>\n<thead>\n<tr>\n<th>您今天要做什麼<\/th>\n<th>使用入口<\/th>\n<th>需要完整工作台嗎？<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>只算 kW → 電流／NFB／線徑<\/td>\n<td>主畫面「電力配線」<\/td>\n<td>不需要<\/td>\n<\/tr>\n<tr>\n<td>只算風管、CDA、照度、水量或空氣狀態<\/td>\n<td>對應的簡易工具<\/td>\n<td>不需要<\/td>\n<\/tr>\n<tr>\n<td>整理整個空間的空調、熱負荷、廠務及報告<\/td>\n<td>「完整工程工作台」<\/td>\n<td>需要，從本教學第 3 節開始<\/td>\n<\/tr>\n<tr>\n<td>比較單台箱的預熱、預冷、加濕、再冷、再熱<\/td>\n<td>工作台上方「空調箱管理」<\/td>\n<td>看第 8 節<\/td>\n<\/tr>\n<tr>\n<td>整批設備 Excel／CSV 彙總<\/td>\n<td>「設備表匯入」<\/td>\n<td>可獨立使用；分析結果不會默默填入主案<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>第一次不要從空白案件填完所有分頁。<\/strong> 先開練習案、只改一個條件、觀察結果，再換成自己的現場資料。<\/p>\n<p>離線包解壓縮後，雙擊 <code>START_HERE.html<\/code>：用一般瀏覽器閱讀，可切換中英文、逐步跟做、勾選進度或列印。教學及練習不需要 Python，也不需要連網；GitHub 外部連結需要網路。勾選只記錄「我已閱讀」，不是軟體驗收。進度只計前六個必要步驟，延伸章節選讀；「閱讀全文」時不勾選單步，以免記錯章節。程式內的「新手教學」按鈕從 <strong>win.2／mac.2 修訂<\/strong>起提供，較早的 V5.5.5 請直接開啟離線 HTML。<\/p>\n"},{"id":"interface","title":"2. 工作台只要先認識四個位置","html":"<h2>2. 工作台只要先認識四個位置<\/h2>\n<p><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMTAwIiBoZWlnaHQ9IjY1MCIgdmlld0JveD0iMCAwIDExMDAgNjUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0ibWFwLXRpdGxlIG1hcC1kZXNjIj48dGl0bGUgaWQ9Im1hcC10aXRsZSI+5a6M5pW05bel56iL5bel5L2c5Y+w77ya5YWI6KqN6K2Y5pON5L2c5L2N572uPC90aXRsZT48ZGVzYyBpZD0ibWFwLWRlc2MiPkNvbnRyb2wtbG9jYXRpb24gZGlhZ3JhbSBiYXNlZCBvbiBWNS41LjUgc291cmNlOyBub3QgYSBzY3JlZW5zaG90LjwvZGVzYz48cmVjdCB3aWR0aD0iMTEwMCIgaGVpZ2h0PSI2NTAiIHJ4PSIxNiIgZmlsbD0iI2VlZjNmNyIvPjxnIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWksIHNhbnMtc2VyaWYiPjx0ZXh0IHg9IjMwIiB5PSI0MyIgZm9udC1zaXplPSIyNCIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MzM0ZCI+5a6M5pW05bel56iL5bel5L2c5Y+w77ya5YWI6KqN6K2Y5pON5L2c5L2N572uPC90ZXh0PjxyZWN0IHg9IjI0IiB5PSI3MCIgd2lkdGg9IjI0OSIgaGVpZ2h0PSI1NDYiIHJ4PSIxMCIgZmlsbD0iIzExMjUzYiIvPjx0ZXh0IHg9IjQyIiB5PSIxMDEiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiM2ZWRhYzciIGZvbnQtd >\n<thead>\n<tr>\n<th>位置<\/th>\n<th>先學這些按鈕<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>上方<\/td>\n<td>開啟、儲存整案、另存新檔、複製為新方案、基本模式<\/td>\n<td>開練習案，保留主案及單機資料；初學先用基本模式<\/td>\n<\/tr>\n<tr>\n<td>左側<\/td>\n<td>01、02、03、09<\/td>\n<td>共同氣候 → 空調與空間 → 熱負荷 → 報告<\/td>\n<\/tr>\n<tr>\n<td>中間<\/td>\n<td>欄位及其說明、頁面捲軸<\/td>\n<td>短頁面向下捲，不必一次看到所有欄位<\/td>\n<\/tr>\n<tr>\n<td>下方<\/td>\n<td>重新計算、定位問題、匯出設計報告<\/td>\n<td>先重算，遇問題用定位，再輸出目前結果<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>基本模式是把較少用的欄位收起來，仍採用已保存的有效設定。<\/strong> 灰色或隱藏欄位不等於資料消失；模式停用的欄位保留草稿，但不參與該模式的計算。每頁會列出仍採用的參考條件與來源；基本模式的分頁範圍預設「空調與熱負荷」，改選「全部工程分頁」即可展開其餘系統。收起分頁不會清空已保存的需求。進階模式可以逐項檢查採用值。「套用本頁初估係數」會變更本頁參考值；做跟練時先不用，誤按可用「復原帶入」。<\/p>\n"},{"id":"first-case","title":"3. 開啟第一個練習案","html":"<h2>3. 開啟第一個練習案<\/h2>\n<ol>\n<li>下載並完整解壓縮 <a href=\"https://github.com/azx4121/facility-studio/raw/refs/heads/main/docs/tutorial/Facility_Studio_Beginner_Tutorial.zip\">教學懶人包<\/a>。請不要在 ZIP 預覽視窗內操作。<\/li>\n<li>找到 <code>01_Practice_AHU.json<\/code>。不用先在桌面改名；開啟後可用軟體內的「另存新檔」。<\/li>\n<li>開啟 Facility Studio →「完整工程工作台」→ 上方「開啟」。<\/li>\n<li>選擇 <code>01_Practice_AHU.json<\/code>。若現有案件未保存，先保存再切換。按「另存新檔」，存為 <code>My_First_Project.json<\/code>，之後「儲存整案」只存回這個新檔。<\/li>\n<li>上方選「基本模式」，按下方「重新計算」，或按 F5。<\/li>\n<\/ol>\n<p>本例是 <strong>12 × 8 × 3 m 的一般作業區，8 人，AHU 外氣／回風混合<\/strong>。不是無塵室認證案例，也不是任何產品的選型書。其他無需求的氣體、PV、排氣、PCW、純水設為 0；已有設備與冰水等初估資料供練習。<\/p>\n<p><strong>跟練成功的狀態是「計算完成」，工程評估仍為「待補資料」。<\/strong> 計算成功代表輸入可計算；「待補資料」仍要補資料；「未達條件」要修正指定容量或工況，三者不能混為設計已合格。 本例故意保留原廠性能、設備阻力及配電覆核待補，不應把它改成假資料只為取得通過。<\/p>\n"},{"id":"inputs","title":"4. 自己的案件先填這五組資料","html":"<h2>4. 自己的案件先填這五組資料<\/h2>\n<table>\n<thead>\n<tr>\n<th>頁面／欄位<\/th>\n<th>本例輸入<\/th>\n<th>您自己的案子如何填<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>01 共同氣候：夏季外氣／室內目標<\/td>\n<td>35°C、70%RH／22°C、50%RH<\/td>\n<td>採實際設計氣候與室內需求；冬季例為 8°C、70%RH<\/td>\n<\/tr>\n<tr>\n<td>02 空調與空間：空調系統／A 區長寬高／人數<\/td>\n<td>AHU (OA+RA 混合)／12、8、3 m／8 人<\/td>\n<td>選真實架構，尺寸用 m；不用 B 區就保留長寬及人數為 0<\/td>\n<\/tr>\n<tr>\n<td>02 風量計算模式／換氣次數／指定外氣<\/td>\n<td>ACH／6 次/h／0 自動<\/td>\n<td>ACH 是循環需求，<strong>不是全部新鮮外氣<\/strong>；6 是本例練習值，不是通用規定<\/td>\n<\/tr>\n<tr>\n<td>03 設備發熱／運轉率／製程水氣<\/td>\n<td>5 kW／100%／沒有額外產濕<\/td>\n<td>設備熱用同一範圍的入室熱收支；不知道產濕就選「尚不清楚」，不當作已確認沒有<\/td>\n<\/tr>\n<tr>\n<td>03 照度與燈具／外牆及樓板<\/td>\n<td>500 Lux、4000 lm/盞、40 W/盞／60、96 m²<\/td>\n<td>Lux 是目標，lm 是單燈光通量；面積用 m²，不填 m³<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>在 01 頁按「編輯共同氣候」會捲到溫濕度欄位。新版先顯示氣候輸入，再顯示總覽圖；可直接修改，不必先往圖下找。照明利用係數 0.6、維護係數 0.8、人員顯／潛熱 75／55 W 是本例的初估值。樓板鄰側夏季溫度在本例採 22°C，與室內相同，所以樓板夏季傳熱為 0；這個進階條件也會影響結果。<\/p>\n<p>**動手一次：**只把 A 區人數 8 改成 12，再重算。人員顯熱應增加 <strong>0.300 kW<\/strong>，人員潛熱增加 <strong>0.220 kW<\/strong>。觀察後改回 8，重算再繼續。每次改一項，最容易理解連動。<\/p>\n"},{"id":"results","title":"5. 結果只先看這張表","html":"<h2>5. 結果只先看這張表<\/h2>\n<p>回到原練習資料重算後，在 01 摘要、03 計算摘要及 09 報告核對：<\/p>\n<table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>本例應得結果<\/th>\n<th>怎麼理解<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>面積／體積<\/td>\n<td>96 m²／288 m³<\/td>\n<td>12 × 8；面積 × 3 m<\/td>\n<\/tr>\n<tr>\n<td>照明<\/td>\n<td>25 盞／1.000 kW<\/td>\n<td>每盞 4000 lm、40 W；盞數向上取整<\/td>\n<\/tr>\n<tr>\n<td>室內顯熱<\/td>\n<td>7.870 kW<\/td>\n<td>設備 5 + 人員 0.6 + 照明 1 + 外牆 1.270；其他本例為 0<\/td>\n<\/tr>\n<tr>\n<td>室內潛熱／產濕<\/td>\n<td>0.440 kW／0.633 kg/h<\/td>\n<td>8 人 × 55 W；本例沒有額外製程產濕<\/td>\n<\/tr>\n<tr>\n<td>最低補償外氣<\/td>\n<td>192.0 CMH，室內基準<\/td>\n<td>本例由 8 人 × 24 CMH/人決定，不是通用通風法規<\/td>\n<\/tr>\n<tr>\n<td>循環需求／實際處理風量<\/td>\n<td>1728.0／2400.2 CMH，室內基準<\/td>\n<td>288 × 6 是循環下限；熱濕平衡需要更高風量<\/td>\n<\/tr>\n<tr>\n<td>CHW 連動水量<\/td>\n<td>41.115 LPM<\/td>\n<td>水側冷量含 10% 餘裕，ΔT=5 K；不是原手填 400 LPM<\/td>\n<\/tr>\n<tr>\n<td>UP 盤初估<\/td>\n<td>8.937 A；NFB 候選 15 AT；每相 3.5 mm² × 1 組<\/td>\n<td>本例另外填了 5 kW 電力、380 V、PF0.85；仍待配電覆核<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>公式只先記三個：<code>面積=長×寬<\/code>；<code>循環CMH=體積×ACH<\/code>；<code>燈數=向上取整(目標Lux×面積÷(單燈lm×利用係數×維護係數))<\/code>。完整報告會列熱濕守恆及管路公式。<\/p>\n<p>總覽圖下拉「流程圖季節」可選夏季／冬季。橫軸乾球 °C、縱軸含濕比 g/kg乾空氣；OA 外氣、RA 室內、IN 入口、C1／C2 盤管、HT 加熱、SA 送風。圖上的點是<strong>需求或指定狀態<\/strong>，不代表尚未選型的實體設備已能達到。某段旁通時點會重疊；它不是圖點遺漏。<\/p>\n"},{"id":"export","title":"6. 保存與匯出，完成第一輪","html":"<h2>6. 保存與匯出，完成第一輪<\/h2>\n<ol>\n<li>按「儲存整案」保存目前 <code>My_First_Project.json<\/code>。<strong>儲存整案會存回目前檔案<\/strong>；「另存新檔」換保存路徑但保留案件身分；「複製為新方案」另存檔案並建立新案件身分，原案保持不變。取消選檔不會切換案件。<\/li>\n<li>點左側 <strong>09 設計報告<\/strong>，先看設計條件、結果、待補事項及公式。<\/li>\n<li>下方「匯出設計報告」輸出 <strong>TXT<\/strong>，適合傳送文字結果。<\/li>\n<li>上方「匯出可列印摘要」輸出 <strong>HTML<\/strong>；以瀏覽器開啟，再按列印，可選「另存 PDF」。<\/li>\n<li>如需數值追溯，09 的「另存完整驗算資料 JSON」另存計算結果。<strong>它不是可重新開啟的整案 JSON<\/strong>。<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>檔案<\/th>\n<th>用途<\/th>\n<th>可以用工作台「開啟」嗎？<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>儲存整案的 <code>.json<\/code><\/td>\n<td>主案、所有空調箱、A/B、參數來源與回傳記錄<\/td>\n<td>可以<\/td>\n<\/tr>\n<tr>\n<td>匯出的 TXT／HTML／PDF<\/td>\n<td>閱讀、列印、分享結果<\/td>\n<td>不可以<\/td>\n<\/tr>\n<tr>\n<td>完整驗算資料 JSON<\/td>\n<td>檢查數值與計算依據<\/td>\n<td>不作為整案開啟<\/td>\n<\/tr>\n<tr>\n<td>另存單機 JSON<\/td>\n<td>單台空調箱資料<\/td>\n<td>單機視窗可開啟；主案入口也會辨識成獨立單機，不會覆蓋整案<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>到這裡就完成第一份練習報告。<\/strong> 先熟悉這條路徑；需要其他廠務系統再往下學。<\/p>\n"},{"id":"utilities","title":"7. 其他分頁，需要時才填","html":"<h2>7. 其他分頁，需要時才填<\/h2>\n<p>基本模式先選「全部工程分頁」展開。只需要單項計算時，回主畫面使用簡易工具；該工具的「本工具教學」會直接開啟對應章節。<\/p>\n<table>\n<thead>\n<tr>\n<th>左側頁面<\/th>\n<th>何時用<\/th>\n<th>最少先確認<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>04 特氣與真空<\/td>\n<td>有 CDA、N2 等氣體或 PV<\/td>\n<td><strong>流量<\/strong>、最低管內壓力、單位；進階可逐路改壓力和風速<\/td>\n<\/tr>\n<tr>\n<td>05 動力配電<\/td>\n<td>要估 UP／NP 盤需求<\/td>\n<td>電氣輸入 kW、三相線電壓、負載類型；電力與設備熱是不同資料<\/td>\n<\/tr>\n<tr>\n<td>06 排氣風管<\/td>\n<td>有一般、酸、鹼、有機或熱排<\/td>\n<td>各路 CMH；初估流速／餘裕可先沿用，之後依實際材質與需求核對<\/td>\n<\/tr>\n<tr>\n<td>07 水系統與純水<\/td>\n<td>要估冷熱水或純水主管<\/td>\n<td>選水量來源、ΔT；純水填循環 LPM 和流速限制<\/td>\n<\/tr>\n<tr>\n<td>08 壓損矩陣<\/td>\n<td>已有最不利路徑，要估壓差<\/td>\n<td>選有流量的系統、路徑長、管件餘裕及設備壓差是否已知<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>沒有需求的氣體、PV、排氣、PCW、純水，在本例保留 0 即可；<strong>CHW 等服務正在運轉的空調水路仍由負荷連動計算<\/strong>，不能為了隱藏頁面而隨意歸零。<\/p>\n<p>**潛熱：**它是進入室內的水氣造成的除濕需求，跟機台散熱不是同一件事。人員會自動算；若開放水槽每小時蒸發 1 kg 進室內，選「已知產濕量 kg/h」填 1，就增加 <code>1×2501÷3600 = 0.695 kW<\/code> 的製程潛熱。若已知的是 1 kW 潛熱就選「已知潛熱 kW」。只採所選的一種，不兩種都加；外氣水氣另在盤管算，不再填成室內製程水氣。未知用「尚不清楚」保留待補。未知製程產濕會暫不計入，可能低估除濕需求，不能稱為保守估算。<\/p>\n<p><strong>水量連動：<\/strong>「連動負荷」用 <code>LPM=60000×kW÷(ρ×cp×ΔT)<\/code> 自動算，手填欄位不採用。要使用量測的 100 LPM，先選「獨立輸入」才填 100；模型會比較這個水量的冷熱容量與需求。上游 PCW 機台熱移除和主管流量來源也要一致。MCHW、CHW、DCCW、PCW、HW 可各自選「本迴路獨立物性」；回傳一台箱的清水物性只更新所採用迴路，不會改掉其他水路的乙二醇或高溫水設定。<\/p>\n<p>**簡易壓損：**選 CHW → 路徑長 30 m → 一般初估 30% → 尚無設備資料。30 m 在水側是供、回直管加總；<strong>閉式循環不把樓層高度直接當泵靜揚程<\/strong>。設備壓差未知時只報管路小計，不能把它當完整選泵揚程。10／30／50%是方案餘裕，不是管件標準。風管壓差顯示 Pa／mmAq、水側可顯示 kPa／水頭，勿直接把不同單位的數字相加。<\/p>\n<p><strong>CDA／PV：<strong>只填壓力及流速不能求唯一管徑，還需要流量。氣體預設用共用的<\/strong>最低表壓<\/strong>定寸，與供氣表壓不同；PV 的 Torr／kPa(abs)／mbar(abs) 都是絕壓，切換會換算數值。純水電阻率是 25°C 參考目標，不是量測證明。<\/p>\n\n\n<p data-v557-note=\"true\">閉式水路不把樓高加進循環泵差壓，系統靜壓另核；風管不用水側靜揚程。切換模式保留原草稿，採用值與原因會在畫面／報告說明。<\/p>\n"},{"id":"ahu","title":"8. 空調箱管理：先用第二份練習案","html":"<h2>8. 空調箱管理：先用第二份練習案<\/h2>\n<p>第二案 <code>02_Practice_MAU_and_AHU.json<\/code> 已包含一個主案及 <strong>Tutorial MAU-01<\/strong> 單機，讓您不必從預設的 58,000 CMH 大箱開始。此案是全外氣 MAU＋FFU＋DCC 的教學模型，同樣 96 m²，循環需求採 20 ACH；供風及單機送風狀態約 358.3 CMH，室內基準約 359.2 CMH。兩個數字因狀態／比容基準不同而稍異。<\/p>\n<ol>\n<li>先保存第一案。按「開啟練習新案」直接載入第二案並建立新案件身分；也可「開啟」第二個 JSON 後「另存新檔」。<\/li>\n<li>主案按「重新計算」，再按上方「空調箱管理」。<\/li>\n<li>選 <strong>Tutorial MAU-01<\/strong> →「開啟選取單機」，不要先新增一台大預設箱。<\/li>\n<li>在「1 設計條件」先看風量、夏冬外氣與目標、H1／H2 熱源、C1／C2 供回水及候選容量、加濕設備。<\/li>\n<li>本例各段先採「自動需求」，H1／H2 各配置 8 kW 電熱，C1／C2 各 3 US RT，濕膜只在需要加濕時運轉。<strong>這些是合成練習配置<\/strong>；原廠曲線、阻力及濕膜資料仍待補。<\/li>\n<li>按「重算」，在結果頁切夏季／冬季，對照每段入口、出口、需求與容量檢核；需求點不是設備不足時的實際出風模擬。<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>段落<\/th>\n<th>作用<\/th>\n<th>初學先怎麼設定<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>H1 預熱<\/td>\n<td>外氣先加熱，可能是後續水洗加濕所需<\/td>\n<td>自動需求；電熱、回收熱水、並用或停用按實際配置<\/td>\n<\/tr>\n<tr>\n<td>C1 預冷<\/td>\n<td>第一段冷卻<\/td>\n<td>自動需求；核供回水及候選 RT<\/td>\n<\/tr>\n<tr>\n<td>加濕<\/td>\n<td>濕膜蒸發冷卻或蒸汽加濕<\/td>\n<td>選真實設備；濕膜和蒸汽的水分／能量不相同<\/td>\n<\/tr>\n<tr>\n<td>C2 再冷<\/td>\n<td>深冷、除濕或再冷卻<\/td>\n<td>自動需求；水溫需能達到目標含濕量<\/td>\n<\/tr>\n<tr>\n<td>H2 再熱<\/td>\n<td>調整最終送風乾球<\/td>\n<td>自動需求；核本段已配置容量，不挪用 H1 的容量<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>要指定每段出口，先勾「顯示進階／廠商資料」，分別設定夏季、冬季該段的「指定出口乾球」；冷卻段另可選「指定出口 T/RH」。<strong>入口由上一段連動，不能當作每一段都重新從外氣開始<\/strong>。不用段落選旁通，不是任意填 0°C。<\/p>\n<p><strong>主案 → 單機：<strong>按「帶入主案分季送風需求」，看提示再確認。此功能目前<\/strong>只支援全外氣 MAU 主案<\/strong>，並會詢問本台服務比例（例如兩台各服務 50%）；第一案混風 AHU 不能直接帶入這個全外氣單機模型。帶入會更新分季入口、送風需求及冰水供回水；既有逐段指定值與額定容量保留，需重算核對。改主案後，舊連動快照會過期，需再帶入。<\/p>\n<p>**單機 → 主案：**按「預覽回傳水量／額定電力」，先看改前／改後再確認。本例預覽 MCHW <strong>12.443 LPM<\/strong>、CHW <strong>12.348 LPM<\/strong>、NP 風機 <strong>0.370 kW<\/strong>、加熱 <strong>16.000 kW<\/strong>、已確認水洗泵 <strong>0.100 kW<\/strong>。加熱 16 kW 是兩台已配置電熱器額定合計，<strong>不是同一工況的加熱需求<\/strong>。<\/p>\n<p>回傳會記錄到「需求彙整」：<strong>同一台再回傳更新原來源，不重複累加；不同台才合計<\/strong>。首次帶入會詢問既有電力／氣體等數值是否是其他設備基數，選「否」代表以來源清單重新彙整，避免把同一需求算兩次。未知水洗泵或蒸汽耗電只列已知小計並保留待補。<\/p>\n<p>水路按相同供回水、流體及服務群組合併，設計量採 <code>max(夏季合計, 冬季合計)<\/code>，不是把每台分季最大值再加總。不同工況分列；「主案採用選取水迴路」只能將一組映射到該水力列，其餘仍留在報告，不能把選取一組當成全廠總管。電力保留額定／同時負載與設計電流下限，不從冷量換算耗電。方案 A/B 是替代方案，不能回傳成同時運轉的兩台箱。回傳不代表原廠容量已通過。<\/p>\n<p>關閉單機視窗不會刪掉這台箱；回主案按「儲存整案」一起保存。單機「另存單機」是另外的單機檔案。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/ahu.md\">更完整的分段公式與大型容量不足案例<\/a>適合下一階段閱讀。<\/p>\n\n\n<p data-v557-note=\"true\">停用欄位只保留草稿，不影響計算或報告。非電熱段不使用電熱效率；熱回收未上線不列採用熱水條件；非水洗設備不列水洗泵與補水。名目電力只計選用電熱、蒸汽和 EC 額定，循環泵與附屬設備另核。主案一段模式只用夏季；冬季逐段控制請在單機內設定。<\/p>\n"},{"id":"recovery","title":"9. 紀錄來源、比較方案與復原","html":"<h2>9. 紀錄來源、比較方案與復原<\/h2>\n<p>上方「來源／比較／復原」有三個分頁：<\/p>\n<table>\n<thead>\n<tr>\n<th>分頁<\/th>\n<th>用法<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>參數來源<\/td>\n<td>記錄初估、量測或原廠文件；原廠資料留下型錄／選型編號<\/td>\n<\/tr>\n<tr>\n<td>方案 A／B<\/td>\n<td>重算後固定目前案為 A；修改一項再重算、固定為 B，再比較。固定快照不會隨後續修改自動覆寫<\/td>\n<\/tr>\n<tr>\n<td>備份與計算依據<\/td>\n<td>查看備份／復原；自動復原約每 30 秒保存，不能替代主動「儲存整案」<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>再存同一檔時會保留 <code>.json.bak<\/code> 備份。另存的計算結果不是專案備份。不要只留 TXT 就關閉而未保存整案。無效輸入可保存成草稿，但不因此變成可用報告。<\/p>\n"},{"id":"faq","title":"10. 卡住時看這裡","html":"<h2>10. 卡住時看這裡<\/h2>\n<table>\n<thead>\n<tr>\n<th>遇到什麼<\/th>\n<th>下一個動作<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>找不到共同溫濕度<\/td>\n<td>01 的氣候輸入在圖前；按「編輯共同氣候」也可定位<\/td>\n<\/tr>\n<tr>\n<td>欄位突然不見或不能填<\/td>\n<td>看基本／進階及控制模式；選項停用的欄位收起，不是刪掉；確認後再切進階<\/td>\n<\/tr>\n<tr>\n<td>改了數值，報告顯示「待重算」<\/td>\n<td>上次有效圖／表供對照，已標示過期並停用匯出／回傳；修正輸入後重算才是目前結果<\/td>\n<\/tr>\n<tr>\n<td>紅框、不能匯出<\/td>\n<td>按「定位問題」，修正指定欄位及單位，再重算；不要沿用舊報告<\/td>\n<\/tr>\n<tr>\n<td>顯示「待補資料」<\/td>\n<td>看報告缺哪份資料；可以做初估，不能當正式選型通過<\/td>\n<\/tr>\n<tr>\n<td>顯示「未達條件」<\/td>\n<td>看容量、換熱溫差或水量等具體原因；不要只放大安全係數<\/td>\n<\/tr>\n<tr>\n<td>製程產濕不知道<\/td>\n<td>選「尚不清楚（暫不計製程）」，保留待補；不要先猜一個大 kW<\/td>\n<\/tr>\n<tr>\n<td>PCW 熱移除超過設備總熱<\/td>\n<td>同一運轉範圍重新核對台數、水量、ΔT、開機率及排氣比例，避免重複扣熱<\/td>\n<\/tr>\n<tr>\n<td>水量改了卻沒變<\/td>\n<td>「連動負荷」不採手填量；要用量測值先選「獨立輸入」<\/td>\n<\/tr>\n<tr>\n<td>AHU 主案不能帶入單機<\/td>\n<td>混風 AHU 不支援全外氣單機連動；先用第二案練 MAU，實案勿任意改架構來繞過<\/td>\n<\/tr>\n<tr>\n<td>回傳說來源已過期<\/td>\n<td>先重新帶入目前主案需求；只有刻意獨立設計時才解除連動<\/td>\n<\/tr>\n<tr>\n<td>想只算一個系統<\/td>\n<td>回主畫面用簡易工具，無須填全廠<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>練習核對：兩平台原始碼各以 <strong>20 個操作相關條件<\/strong>重算，含熱濕守恆、單位、水量來源、壓損範圍、MAU 連動及容量不足。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/tutorial/README.md\">輸入、檢查腳本與驗證紀錄<\/a>可重現。教學位置按程式控制項核對；新增教學入口與署名的原生驗收狀態另見發布紀錄，不把數值測試稱為人工點擊全部 UI。<\/p>\n<p>仍有問題時，到 <a href=\"https://github.com/azx4121/facility-studio/issues\">Issues<\/a> 提供版本、平台、頁面、步驟與合成測試專案。正式設備選型及保護設計仍須現場條件與原廠資料覆核。授權依 <a href=\"https://github.com/azx4121/facility-studio/blob/main/LICENSE_GUIDE.md\">LICENSE_GUIDE<\/a>，正常公司工程工作適用現有附加許可。<\/p>\n"},{"id":"electrical","title":"選讀：電力計算器：設備 kW 換算電流、NFB 候選與線徑","html":"<h2>電力計算器：設備 kW 換算電流、NFB 候選與線徑<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/electrical.en.md\">English<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.md\">回到工具指南<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.md#%E4%B8%8B%E8%BC%89\">下載 Facility Studio<\/a><\/p>\n<p><strong>Electrical load, breaker and cable calculator.<\/strong> 可獨立計算單相／三相設備的負載電流、NFB AT、每相銅線候選及壓降。kW 填「電氣輸入功率」；馬達軸功率或 HP 須先依效率換算，不能直接當成用電。<\/p>\n<p>開啟「電力配線」，填功率、供電方式與使用方式。PF、線長、環溫、載流線數及端子溫度可在「調整預設值／進階條件」修改。基本採 PF 0.85、銅 XLPE、單程30 m、環溫35°C、端子60°C、同管3根、允許壓降3%。<\/p>\n<p><a id=\"case-01\"><\/a><\/p>\n<h2>案例01：10 kW、三相380 V<\/h2>\n<table>\n<thead>\n<tr>\n<th>條件<\/th>\n<th>數值<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>電氣輸入／供電<\/td>\n<td>10 kW／三相380 V<\/td>\n<\/tr>\n<tr>\n<td>負載／PF／單程距離<\/td>\n<td>一般設備／0.85／30 m<\/td>\n<\/tr>\n<tr>\n<td>其餘條件<\/td>\n<td>上述基本值<\/td>\n<\/tr>\n<tr>\n<td>運轉及設計電流<\/td>\n<td>17.8746 A<\/td>\n<\/tr>\n<tr>\n<td>參考候選<\/td>\n<td>NFB 20 AT、每相5.5 mm² × 1組<\/td>\n<\/tr>\n<tr>\n<td>有效載流／電壓降<\/td>\n<td>25 A／2.903 V，0.764%<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>公式：<code>I=P[kW]×1000/(√3×V線間×PF)<\/code>。候選需滿足 <code>設計電流≤NFB AT≤有效載流量<\/code>，並符合已設壓降。選出的線徑是本專案參考資料表的結果；實際敷設、製造商與適用規範不同時需要覆核。<\/p>\n<p><a id=\"case-02\"><\/a><\/p>\n<h2>案例02：5 kW、單相220 V、連續運轉<\/h2>\n<p>改為 PF 1、單程20 m，其餘沿用基本值。<code>I=5000/(220×1)=22.7273 A<\/code>；本工具連續負載初估125%，設計電流28.4091 A。候選為 NFB 30 AT、8 mm² × 1組，有效載流33 A，壓降1.031%。單相壓降包含往返導線長度，輸入仍填單程距離。<\/p>\n<p>電阻性電熱器可能接近 PF 1；馬達與變頻器應使用實際資料，不能把0.85視為所有設備的固定值。馬達 NFB 尚需 FLC、啟動及獨立過載保護條件；中性線、接地、短路容量另核。<\/p>\n<p><a id=\"case-19\"><\/a><\/p>\n<h2>案例19：短路電流、Icu 與保護協調<\/h2>\n<p>此需求<strong>不在本工具的完整求解範圍<\/strong>。負載電流與 NFB AT 不等於故障電流，也不等於分斷能力 Icu／Ics。需取得供電短路容量、變壓器阻抗、電纜阻抗及保護曲線，再使用具相應模型的工具與工程覆核。<\/p>\n<p>案例輸入：<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/01-electrical.json\">01<\/a>、<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/02-electrical.json\">02<\/a>。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">完整反算記錄<\/a>。<\/p>\n\n\n<p data-v557-note=\"true\">完整工作台：一般／馬達負載含明列 HP 時才採最大馬達加成，0 未知採總電流 125%；連續負載固定採總電流 125%，停用最大馬達草稿不影響結果。降載依環溫與同管下拉區間；簡易工具採實填環溫／載流線數。<\/p>\n"},{"id":"duct","title":"選讀：風管尺寸計算器：風量、方管、圓管與靜壓預算","html":"<h2>風管尺寸計算器：風量、方管、圓管與靜壓預算<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/duct.en.md\">English<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.md\">回到工具指南<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.md#%E4%B8%8B%E8%BC%89\">下載<\/a><\/p>\n<p><strong>Rectangular / round duct sizing and static-pressure budget.<\/strong> 「風管尺寸」預設只需風量 CMH／CFM／L/s，先算方管／圓管尺寸；不要求填靜壓。需要壓力核對時，勾選「我已知路徑」，再填可用靜壓、長度、管件與設備壓降。進階可調風速、寬高比與物性。基本風速上限8 m/s、方管寬高比上限2；這是初估參考，並非所有送風、酸鹼排氣或噪音條件的適用值。<\/p>\n<p><a id=\"case-03\"><\/a><\/p>\n<h2>案例03：3,000 CMH、200 Pa<\/h2>\n<p>風速上限8 m/s、寬高比上限2，未提供路徑。<\/p>\n<table>\n<thead>\n<tr>\n<th>結果<\/th>\n<th>方管<\/th>\n<th>圓管<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>參考尺寸<\/td>\n<td>350 × 300 mm<\/td>\n<td>Ø406.4 mm（16英吋）<\/td>\n<\/tr>\n<tr>\n<td>實際風速<\/td>\n<td>7.937 m/s<\/td>\n<td>6.424 m/s<\/td>\n<\/tr>\n<tr>\n<td>未採用的靜壓草稿<\/td>\n<td>200 Pa（本模式不檢查）<\/td>\n<td>同左<\/td>\n<\/tr>\n<tr>\n<td>壓力是否足夠<\/td>\n<td>未核路徑<\/td>\n<td>未核路徑<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>公式：<code>A=CMH/3600/v<\/code>，<code>D圓=√(4A/π)<\/code>。離散尺寸會使實際速度低於上限。<strong>靜壓不能單獨決定尺寸；沒有路徑就不判定200 Pa是否足夠。<\/strong><\/p>\n<p><a id=\"case-04\"><\/a><\/p>\n<h2>案例04：2,000 CFM、已知20 m路徑<\/h2>\n<p>選CFM，輸入2,000；可用靜壓300 Pa。勾選「我已知路徑」，填直管20 m、管件ΣK=4、設備及末端100 Pa、風速上限8 m/s。其餘基本值不變。<\/p>\n<table>\n<thead>\n<tr>\n<th>結果<\/th>\n<th>方管<\/th>\n<th>圓管<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>風量<\/td>\n<td>3,398.022 CMH<\/td>\n<td>同左<\/td>\n<\/tr>\n<tr>\n<td>尺寸<\/td>\n<td>400 × 300 mm<\/td>\n<td>Ø406.4 mm（16英吋）<\/td>\n<\/tr>\n<tr>\n<td>實速<\/td>\n<td>7.866 m/s<\/td>\n<td>7.277 m/s<\/td>\n<\/tr>\n<tr>\n<td>本路徑總阻力<\/td>\n<td>286.912 Pa<\/td>\n<td>254.095 Pa<\/td>\n<\/tr>\n<tr>\n<td>靜壓餘裕<\/td>\n<td>13.088 Pa<\/td>\n<td>45.905 Pa<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>公式：<code>Δp=f(L/Dh)ρv²/2+ΣKρv²/2+設備壓降<\/code>；方管速度用<strong>真實矩形面積<\/strong>計算，Dh是水力直徑，不能把Dh當成等面積圓管再算風速。本例採空氣密度1.2 kg/m³、黏度1.81×10⁻⁵ Pa·s、粗糙度0.09 mm。<\/p>\n<p>這個快算路徑假設尺寸與流量沿線不變；完整多支路、各段尺寸、污染物處理、風機曲線與濾網終阻力另核。不得把設備端要求靜壓的最大值當成全管網 ESP。<\/p>\n<p>案例輸入：<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/03-duct.json\">03<\/a>、<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/04-duct.json\">04<\/a>。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">反算記錄<\/a>。<\/p>\n"},{"id":"gas","title":"選讀：CDA／N2 與 PV 管徑初估：標準流量、實際流量與絕對壓","html":"<h2>CDA／N2 與 PV 管徑初估：標準流量、實際流量與絕對壓<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/gas-vacuum.en.md\">English<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.md\">回到工具指南<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.md#%E4%B8%8B%E8%BC%89\">下載<\/a><\/p>\n<p><strong>Compressed air / nitrogen / process vacuum flow and pipe calculators.<\/strong> 管徑需要「流量＋壓力＋允許流速」，只有壓力與流速不能決定管徑。「CDA／特氣管徑」快算接受CDA、N2及Ar；其他氣體與PV使用完整工程工作台。快算是理想氣體、指定流速的截面初估，沒有完整可壓縮管路壓降模型。<\/p>\n<p>標準SLPM／SCFM／Sm³/h與管內ALPM不同。預設標準溫度25°C、標準絕壓101.325 kPa，應與設備型錄一致；氣體溫度25°C、大氣壓101.325 kPa均可調整。<code>P絕對=P表壓+P當地大氣<\/code>，<code>Q實際=Q標準×P標準/P絕對×T管內(K)/T標準(K)<\/code>。<\/p>\n<p>選「標準流量」使用 SLPM／SCFM／Sm³/h；選「管內實際流量」使用 ALPM／ACFM／Am³/h。切換基準會按目前溫壓換算等量數字，不會把 800 SLPM 直接改名成 800 ALPM。型錄只寫 L/min 而沒給溫壓基準時，先向供應商確認；不要自行猜標準量。<\/p>\n<p><a id=\"case-05\"><\/a><\/p>\n<h2>案例05：CDA 800 SLPM、6 bar(g)、15 m/s<\/h2>\n<p>開啟CDA快算，填800 SLPM、6 bar(g)、流速上限15 m/s，保留上述25°C標準基準。<\/p>\n<table>\n<thead>\n<tr>\n<th>結果<\/th>\n<th>數值<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>管內絕對壓力<\/td>\n<td>701.325 kPa(abs)<\/td>\n<\/tr>\n<tr>\n<td>實際流量<\/td>\n<td>115.581 ALPM<\/td>\n<\/tr>\n<tr>\n<td>理論最小內徑<\/td>\n<td>12.787 mm<\/td>\n<\/tr>\n<tr>\n<td>表內候選<\/td>\n<td>1/2英吋（15A），參考內徑16.1 mm<\/td>\n<\/tr>\n<tr>\n<td>實際速度<\/td>\n<td>9.462 m/s<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>D內=√(4×ALPM/60000/π/v上限)×1000 mm<\/code>。名目15A不是實際內徑；須依實供材質、壁厚與潔淨要求覆核。<\/p>\n<p><a id=\"case-06\"><\/a><\/p>\n<h2>案例06：N2 100 Sm³/h、600 kPa(g)、12 m/s<\/h2>\n<p>將氣體改N2，標準流量100 Sm³/h＝1,666.667 SLPM。600 kPa(g)相當於6 bar(g)；實際流量240.794 ALPM，最小內徑20.635 mm。參考候選3/4英吋（20A），內徑21.4 mm，實際速度11.158 m/s。<\/p>\n<p><a id=\"case-07\"><\/a><\/p>\n<h2>案例07：PV 2,000 SLPM、150 Torr(abs)<\/h2>\n<p>開啟「完整工程工作台 → 特氣／PV」，填標準抽氣量2,000 SLPM、150 Torr(abs)，進階流速18 m/s、標準及管內溫度25°C、Z比值1。<\/p>\n<p>150 Torr(abs)＝19.9984 kPa(abs)＝199.984 mbar(abs)。<code>Q實際=2000×760/150=10,133.333 ALPM<\/code>；理論最小內徑109.300 mm。本參考表選6英吋（150A）、內徑160.3 mm，實速8.368 m/s。參考表的4英吋內徑108.3 mm小於需求，不能因接近就宣稱符合。<\/p>\n<p>此為<strong>製程真空體積流量初估<\/strong>，不是高真空、導通率、抽空時間或幫浦性能選型。需另外取得泵曲線、管路導通率、漏氣／放氣量及外壓屈曲資料；Torr／kPa／mbar切換不會把絕壓變成表壓。完整工作台的本路壓力與遠端最低壓力須符合供氣上下限。<\/p>\n<p>案例輸入：<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/05-gas.json\">05<\/a>、<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/06-gas.json\">06<\/a>；PV完整條件保留在<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/scenarios.json\">情境07<\/a>。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">反算記錄<\/a>。<\/p>\n"},{"id":"lighting","title":"選讀：照明照度計算器：空間 m²／m³、燈具流明、Lux 與盞數","html":"<h2>照明照度計算器：空間 m²／m³、燈具流明、Lux 與盞數<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/lighting.en.md\">English<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.md\">回到工具指南<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.md#%E4%B8%8B%E8%BC%89\">下載<\/a><\/p>\n<p><strong>Average illuminance and fixture-count calculator.<\/strong> 開啟「照明照度」，選「估算照度」或「反算燈數」，再選面積m²、坪、長×寬或體積m³。體積需要同一空間淨高，才能得到 <code>照明面積=體積/淨高<\/code>；不是要求把體積欄填面積。<\/p>\n<p>燈具光通量用<strong>流明lm<\/strong>，空間照度用<strong>Lux＝lm/m²<\/strong>。瓦數不能單獨決定照度；有型錄就選型錄流明，未知可用LED功率初估，但必須保留採用的光效假設。<\/p>\n<p><a id=\"case-08\"><\/a><\/p>\n<h2>案例08：90 m³、高3 m、40 W×10盞<\/h2>\n<p>選「體積m³」，體積填90、淨高3。每盞40 W、10盞，採LED初估100 lm/W、照明利用率U=0.6、維護係數M=0.8。<\/p>\n<p><code>面積=90/3=30 m²<\/code>；<code>每盞流明=40×100=4000 lm<\/code>。\n<code>平均Lux=10×4000×0.6×0.8/30=640 Lux<\/code>；照明用電0.4 kW。<\/p>\n<p><a id=\"case-09\"><\/a><\/p>\n<h2>案例09：30 m²、目標500 Lux<\/h2>\n<p>選「反算燈數」，面積30 m²、目標500 Lux、型錄每盞4,000 lm、每盞40 W，U=0.6、M=0.8。<\/p>\n<p><code>N=ceil(500×30/(4000×0.6×0.8))=8盞<\/code>。向上取整後平均照度512 Lux、功率0.32 kW；7盞只有448 Lux。<\/p>\n<p>U、M及100 lm/W都是案例假設；應依燈具、反射率、安裝高度、清潔及老化條件確認。本工具估平均照度，不提供配光檔模擬、眩光、工作面各點照度或均勻度保證。<\/p>\n<p>案例輸入：<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/08-lighting.json\">08<\/a>、<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/09-lighting.json\">09<\/a>。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">反算記錄<\/a>。<\/p>\n"},{"id":"water","title":"選讀：冷熱水計算器：PCW／CHW 水量、kW、RT、ΔT 與管徑","html":"<h2>冷熱水計算器：PCW／CHW 水量、kW、RT、ΔT 與管徑<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/water.en.md\">English<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.md\">回到工具指南<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.md#%E4%B8%8B%E8%BC%89\">下載<\/a><\/p>\n<p><strong>Cooling-water / chilled-water flow and heat calculator.<\/strong> 開啟「其他常用快算 → 冷熱水快算」，選「已知水量」或「已知熱量」。基本採清水密度1,000 kg/m³、比熱4.1868 kJ/(kg·K)、水速上限1.5 m/s；流量可用LPM、US GPM或m³/h。<\/p>\n<p>公式：<code>Q[kW]=LPM/60000×ρ×cp×ΔT[K]<\/code>。US RT採3.51685284 kW/RT；ΔT是供回水溫差，不是其中一個水溫。乙二醇或其他液體應改用適用物性；快算清水值不能直接套用。<\/p>\n<p><a id=\"case-10\"><\/a><\/p>\n<h2>案例10：PCW 100 LPM、ΔT 5 K<\/h2>\n<p>選「已知水量」填100 LPM及5 K。\n<code>100/60000×1000×4.1868×5=34.89 kW≈9.921 US RT<\/code>。\n按1.5 m/s上限定寸，候選40A（1-1/2英吋）、參考內徑40.9 mm，水速1.269 m/s。<\/p>\n<p><a id=\"case-11\"><\/a><\/p>\n<h2>案例11：CHW 100 kW、ΔT 5 K<\/h2>\n<p>選「已知熱量」填100 kW及5 K。\n<code>LPM=100×60000/(1000×4.1868×5)=286.615 LPM<\/code>。\n候選65A（2-1/2英吋）、參考內徑67.9 mm、水速1.319 m/s。<\/p>\n<p>候選僅符合指定水速；沒有代表整個水系統已合格。水泵揚程、換熱器／盤管壓降、完整供回水路徑、膨脹槽、靜壓及NPSH另核。<\/p>\n<p>案例輸入：<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/10-water.json\">10<\/a>、<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/11-water.json\">11<\/a>。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">反算記錄<\/a>。<\/p>\n"},{"id":"air","title":"選讀：空氣線圖計算機：乾球、RH、濕球、露點、焓與含濕比","html":"<h2>空氣線圖計算機：乾球、RH、濕球、露點、焓與含濕比<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/psychrometrics.en.md\">English<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.md\">回到工具指南<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.md#%E4%B8%8B%E8%BC%89\">下載<\/a><\/p>\n<p><strong>Psychrometric calculator with a live humidity-ratio chart.<\/strong> 開啟「其他常用快算 → 空氣狀態／線圖」，填乾球°C與相對濕度%RH，數值與對應點位即時更新。進階大氣壓預設101.325 kPa(abs)，可依當地壓力調整；曲線跟隨目前壓力。快算入口是乾球＋RH；完整工作台另有其他空氣狀態組合。<\/p>\n<p><a id=\"case-12\"><\/a><\/p>\n<h2>案例12：35°C、70%RH、101.325 kPa(abs)<\/h2>\n<table>\n<thead>\n<tr>\n<th>空氣性質<\/th>\n<th>結果<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>含濕比<\/td>\n<td>25.159 g/kg乾空氣<\/td>\n<\/tr>\n<tr>\n<td>焓<\/td>\n<td>99.771 kJ/kg乾空氣<\/td>\n<\/tr>\n<tr>\n<td>露點<\/td>\n<td>28.701°C<\/td>\n<\/tr>\n<tr>\n<td>濕球<\/td>\n<td>30.059°C<\/td>\n<\/tr>\n<tr>\n<td>比容<\/td>\n<td>0.90827 m³/kg乾空氣<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>公式：<code>Pw=RH/100×Pws(T)<\/code>；<code>w=0.621945×Pw/(P−Pw)<\/code>；<code>h=1.006T+w(2501+1.86T)<\/code>。P與Pw必須使用相同單位，w在焓公式中用kg/kg乾空氣，不能直接代入g/kg。<\/p>\n<p><a id=\"case-13\"><\/a><\/p>\n<h2>案例13：25°C、50%RH、大氣壓80 kPa(abs)<\/h2>\n<p>進階大氣壓改80。含濕比12.568 g/kg乾空氣、焓57.167 kJ/kg乾空氣、露點13.864°C、濕球17.332°C、比容1.09139 m³/kg乾空氣。相同乾球／RH下，水蒸氣分壓相同；含濕比及比容會隨總壓變化，不能全採海平面數值。<\/p>\n<p>RH=0%時不存在有限露點，軟體不以假數值代替。冬夏盤管容量還需要乾空氣質量流率及進出口狀態；單一空氣點不能推得空調總負荷。<\/p>\n<p>以下是Windows原生驗收的實際畫面，顯示預設25°C／50%RH；不是上方35°C案例的截圖：<\/p>\n<p><img src=\"data:image/svg+xml;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAMACAIAAAA12IJaAAD92UlEQVR4nOz9D1yUZb4//r8pP+d8Tue7tsf8gyIjoECk7Kq5ioKhiYjISUVTgx+Vok ，Cv(US)以水在壓差1 psi下的US GPM表示。此換算採 <code>Kv≈0.865×Cv(US)<\/code>，不是管徑換算，也不是完整氣體閥門選型。<\/p>\n<p>壓力換算保留原來表壓／絕壓基準；將bar換成kPa，不會自動把表壓變成絕壓。US GPM與UK GPM、US RT與日本冷凍噸在工具內分開。<\/p>\n<p>單次基本換算可以直接解答；需要重複比較、離線使用或把結果連到工程計算時，這個入口更有用。<\/p>\n<p>案例輸入：<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/14-units.json\">14<\/a>、<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/15-units.json\">15<\/a>。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">反算記錄<\/a>。<\/p>\n"},{"id":"equipment","title":"選讀：Excel／CSV 設備需求分析：電力、PCW、CDA、N2、EXHAUST、DI、PV","html":"<h2>Excel／CSV 設備需求分析：電力、PCW、CDA、N2、EXHAUST、DI、PV<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/equipment.en.md\">English<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.md\">回到工具指南<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.md#%E4%B8%8B%E8%BC%89\">下載<\/a><\/p>\n<p><strong>Equipment-schedule demand analysis.<\/strong> 開啟主畫面右上「設備表匯入」，先「匯出公檔範本」，依設備填值，再匯入分析。完整懶人包也有範本；<a href=\"https://github.com/azx4121/facility-studio/blob/main/windows/facility_studio/resources/Equipment_Template.xlsx\">原始範本<\/a>可下載。先選 English 再匯出即可取得英文欄位／說明的範本；包內與原始範本可能仍為中文，兩種語言均可匯入。Excel內有七個系統；CSV依所選系統分析。<\/p>\n<ol>\n<li>每台設備填編號、名稱、供應群組、台數、同時使用率及系統數據。<\/li>\n<li>要計算的設備設「啟用(1/0)」為1；範本示例預設0，避免無意納入。<\/li>\n<li>輸入欄貼上實際值；不要填Excel公式、TRUE／FALSE或錯誤值。<\/li>\n<li>匯入後確認分組、基本值、待補資料及結果，再匯出報告。<\/li>\n<\/ol>\n<p>同時使用率指最大同時需求的估算比例，不是「每小時運轉分鐘」。支路不能直接因主管同時率而縮小。設備表中的型錄條件、不同氣體流量基準、電壓／相數與排氣類型都需要確認。<\/p>\n<h2>分析、帶入與保存是三個動作<\/h2>\n<p>分析不會自動修改主案。選取一個供應群組，選 UP／NP 或特氣目的路別，再按「預覽帶入主案」；看改前／改後後確認。沒有主案時可建立主案。每次只帶入選取群組：同一系統／群組／目的再匯入更新原來源，不重複累加；同一群組的所有設備請放在同一份表，勿分批當成不同來源。<\/p>\n<p>電力只有與主案相同線電壓的三相群組可帶入。不同電壓或單相保留獨立分析；各群組 P/Q、連續負載餘裕、最大單支路設計電流下限及最長配線距離保留。插座數是點位統計，不能決定未知插座的功率。電氣輸入 kW 不會填進室內設備散熱。<\/p>\n<p>PCW 帶入流量與流量加權 ΔT，原表未給供回水時，25°C 僅是占位並列待補；不同服務群組分列水路。CDA／N2 帶入標準需求，主案逐路最低壓力、溫度與允許流速仍須和表內要求對照。排氣按類型分列，設備端靜壓不是風機 ESP。DI 包含持續循環，水質參考不等於實測；PV 仍需幫浦／導通率資料。儲存主案時一起保存「需求彙整」，匯出設備報告本身不是保存主案。<\/p>\n<h2>百分比怎麼填<\/h2>\n<table>\n<thead>\n<tr>\n<th>輸入<\/th>\n<th>採用同時率<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>數字 <code>50<\/code> 或文字 <code>50%<\/code><\/td>\n<td>50%<\/td>\n<\/tr>\n<tr>\n<td>Excel 百分比儲存值 <code>0.5<\/code>，顯示 <code>50%<\/code><\/td>\n<td>50%（依有效儲存格格式辨識）<\/td>\n<\/tr>\n<tr>\n<td>一般格式數字 <code>0.5<\/code><\/td>\n<td>0.5%，不猜成 50%<\/td>\n<\/tr>\n<tr>\n<td>空白<\/td>\n<td>沿用 100% 參考值並列出採用值<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>匯入後在明細核對「採用同時率」及原值／格式。公式、布林、錯誤值不會默默轉成零。支路仍按額定負载覆核。<\/p>\n<p><a id=\"case-16\"><\/a><\/p>\n<h2>案例16：兩種三相設備與一種單相設備<\/h2>\n<table>\n<thead>\n<tr>\n<th>編號<\/th>\n<th>台數<\/th>\n<th>每台kW<\/th>\n<th>供電<\/th>\n<th>PF<\/th>\n<th>同時率<\/th>\n<th>每台插座數<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>E-01<\/td>\n<td>3<\/td>\n<td>10<\/td>\n<td>三相380 V<\/td>\n<td>0.85<\/td>\n<td>50%<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>E-02<\/td>\n<td>2<\/td>\n<td>5<\/td>\n<td>三相380 V<\/td>\n<td>0.85<\/td>\n<td>100%<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>E-03<\/td>\n<td>1<\/td>\n<td>3<\/td>\n<td>單相220 V<\/td>\n<td>1<\/td>\n<td>100%<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>供應群組名稱均填UP-01、負載類型一般設備、單程30 m；其餘沿範本參考值。\n三相全開40 kW、同時需求 <code>3×10×0.5+2×5=25 kW<\/code>、需求29.412 kVA、電流44.687 A、插座7個。\n單相另成一組3 kW、13.636 A、1個插座。即使群組名稱相同，不同電壓／相數也不直接合併電流。插座是點位統計，不會再乘一次kW。<\/p>\n<p><a id=\"case-17\"><\/a><\/p>\n<h2>案例17：六個公用系統示例各2台、同時率50%<\/h2>\n<p>複製範本的PCW、CDA、N2、EXHAUST、DI及PV示例，台數2、同時率50%、啟用1，其餘保留示例值。本案例為合成測試，沒有業主或現場資料。<\/p>\n<table>\n<thead>\n<tr>\n<th>系統<\/th>\n<th>每台條件<\/th>\n<th>同時需求結果<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>PCW<\/td>\n<td>30 LPM、ΔT5 K<\/td>\n<td>30 LPM、10.467 kW<\/td>\n<\/tr>\n<tr>\n<td>CDA<\/td>\n<td>100 SLPM、6 bar(g)<\/td>\n<td>100 SLPM、14.448 ALPM<\/td>\n<\/tr>\n<tr>\n<td>N2<\/td>\n<td>50 SLPM、5 bar(g)<\/td>\n<td>50 SLPM、8.425 ALPM<\/td>\n<\/tr>\n<tr>\n<td>EXHAUST<\/td>\n<td>GEX 500 CMH、設備端200 Pa<\/td>\n<td>500 CMH；200 Pa不是全路徑ESP<\/td>\n<\/tr>\n<tr>\n<td>DI<\/td>\n<td>每台10 LPM、另持續循環2 LPM<\/td>\n<td>製程10＋循環4＝14 LPM<\/td>\n<\/tr>\n<tr>\n<td>PV<\/td>\n<td>100 SLPM、150 Torr(abs)<\/td>\n<td>100 SLPM、506.667 ALPM<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>DI額外循環不乘同時率；水質與供回水路徑另核。完整工作台的UPW／DI／RO水質參考值是規格記錄，不能代替水質實測或據此保證電阻率。PV幫浦與真空導通率仍須另外選型。<\/p>\n<p>公用系統按供應群組分開；酸、鹼、有機及一般排氣依類型彙總，不能因分析表加總而自行混接。氣體標準流量會先統一到25°C／101.325 kPa(abs)，再以群組最低已填絕壓、最高溫度及最低速度上限定寸。<\/p>\n<p>完整案例資料：<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/scenarios.json\">16與17<\/a>。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">解析、分組及反算記錄<\/a>。<\/p>\n"}],"en":[{"id":"start","title":"1. Choose the right starting point","html":"<h2>1. Choose the right starting point<\/h2>\n<table>\n<thead>\n<tr>\n<th>Your task<\/th>\n<th>Entry<\/th>\n<th>Do you need the full workbench?<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>kW to current, NFB and conductor candidate<\/td>\n<td>Electrical sizing on the home screen<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>A duct, CDA pipe, lighting, water or air-state calculation<\/td>\n<td>The corresponding simple calculator<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Room HVAC, heat loads, utilities and a project report<\/td>\n<td>Full workbench<\/td>\n<td>Yes: start at section 3<\/td>\n<\/tr>\n<tr>\n<td>One unit&#39;s preheat, precool, humidification, recool and reheat<\/td>\n<td>AHU management inside the workbench<\/td>\n<td>See section 8<\/td>\n<\/tr>\n<tr>\n<td>Batch Excel/CSV equipment demand<\/td>\n<td>Import equipment schedule<\/td>\n<td>Independent analysis; results do not silently populate the main project<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Do not start by filling every tab in an empty project.<\/strong> Open a practice project, change one condition, observe the result, then replace the example with your site data.<\/p>\n<p>Extract the tutorial ZIP, then open <code>START_HERE.html<\/code> in a normal browser. It supports Chinese/English, step-by-step navigation, progress checkboxes and printing. The tutorial and practice files require neither Python nor an internet connection; external GitHub links need internet. Checkmarks record reading, not software acceptance. Progress counts only the first six required steps; extensions are optional. Read-all mode disables the single-step checkbox to avoid recording the wrong chapter. The application&#39;s <strong>Beginner tutorial<\/strong> button is available from the <strong>win.2 / mac.2 revision<\/strong>. Earlier V5.5.5 binaries can use the HTML directly.<\/p>\n"},{"id":"interface","title":"2. Learn four locations on the screen","html":"<h2>2. Learn four locations on the screen<\/h2>\n<p><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMTAwIiBoZWlnaHQ9IjY1MCIgdmlld0JveD0iMCAwIDExMDAgNjUwIiByb2xlPSJpbWciIGFyaWEtbGFiZWxsZWRieT0ibWFwLXRpdGxlIG1hcC1kZXNjIj48dGl0bGUgaWQ9Im1hcC10aXRsZSI+RnVsbCB3b3JrYmVuY2g6IHdoZXJlIHRvIGNsaWNrPC90aXRsZT48ZGVzYyBpZD0ibWFwLWRlc2MiPkNvbnRyb2wtbG9jYXRpb24gZGlhZ3JhbSBiYXNlZCBvbiBWNS41LjUgc291cmNlOyBub3QgYSBzY3JlZW5zaG90LjwvZGVzYz48cmVjdCB3aWR0aD0iMTEwMCIgaGVpZ2h0PSI2NTAiIHJ4PSIxNiIgZmlsbD0iI2VlZjNmNyIvPjxnIGZvbnQtZmFtaWx5PSJzeXN0ZW0tdWksIHNhbnMtc2VyaWYiPjx0ZXh0IHg9IjMwIiB5PSI0MyIgZm9udC1zaXplPSIyNCIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MzM0ZCI+RnVsbCB3b3JrYmVuY2g6IHdoZXJlIHRvIGNsaWNrPC90ZXh0PjxyZWN0IHg9IjI0IiB5PSI3MCIgd2lkdGg9IjI0OSIgaGVpZ2h0PSI1NDYiIHJ4PSIxMCIgZmlsbD0iIzExMjUzYiIvPjx0ZXh0IHg9IjQyIiB5PSIxMDEiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiM2ZWRhYzciIGZvbnQtd2VpZ2h0PSI3MDAiPkZBQ0lMSVRZIFNUVURJTzwvdGV4dD48cmVjdCB4PSIzNiIgeT0iMTE2IiB3aWR0aD0iMjI1IiBoZWlnaHQ9IjMyIiByeD0iNSIgZmlsbD0iIzI0NTM2ZiIvPjx0ZXh0IHg9IjQ1IiB5PSIxMzkiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiNkN2U1ZjQiPjAxICBPdmVydmlldyAvIHBzeWNocm9tZXRyaWNzPC90ZXh0PjxyZWN0IHg9IjM2IiB5PSIxNTYiIHdpZHRoPSIyMjUiIGhlaWdodD0iMzIiIHJ4PSI1IiBmaWxsPSIjMjQ1MzZmIi8+PHRleHQgeD0iNDUiIHk9IjE3OSIgZm9udC1zaXplPSIxNCIgZmlsbD0iI2Q3ZTVmNCI+MDIgIEhWQUMgLyByb29tczwvdGV4dD \/td>\n<\/tr>\n<tr>\n<td>Center<\/td>\n<td>Input fields, help text and page scrollbars<\/td>\n<td>Scroll smaller windows to reach the remaining fields<\/td>\n<\/tr>\n<tr>\n<td>Bottom<\/td>\n<td>Recalculate, Locate issue, Export Design report<\/td>\n<td>Recalculate first, locate a problem, then export current results<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Basic mode hides less-used fields but still uses the saved effective settings.<\/strong> Disabled or hidden fields do not mean data has been deleted. Values disabled by a control mode remain as drafts and are excluded from that mode&#39;s calculation. Each page discloses retained reference settings and sources. Basic navigation starts with HVAC and heat loads; choose All engineering pages to reveal the other systems. Collapsing navigation preserves saved demand. Advanced mode lets you inspect individual adopted values. <strong>Apply page reference values<\/strong> changes that page&#39;s reference settings; leave it alone during the walkthrough. <strong>Undo import<\/strong> can restore the previous import/preset operation.<\/p>\n"},{"id":"first-case","title":"3. Open the first practice project","html":"<h2>3. Open the first practice project<\/h2>\n<ol>\n<li>Download and completely extract the <a href=\"https://github.com/azx4121/facility-studio/raw/refs/heads/main/docs/tutorial/Facility_Studio_Beginner_Tutorial.zip\">tutorial package<\/a>. Do not operate inside a ZIP preview.<\/li>\n<li>Locate <code>01_Practice_AHU.json<\/code>. You can rename the working copy with the in-app Save as action after opening it.<\/li>\n<li>Open Facility Studio → <strong>Full workbench<\/strong> → <strong>Open<\/strong> at the top.<\/li>\n<li>Select <code>01_Practice_AHU.json<\/code>. Save an existing modified project before switching. Use Save as to write <code>My_First_Project.json<\/code>; subsequent Save workspace actions use that new path.<\/li>\n<li>Select <strong>Basic mode<\/strong>, then click <strong>Recalculate<\/strong> at the bottom, or press F5.<\/li>\n<\/ol>\n<p>This example is a <strong>12 × 8 × 3 m general work area, 8 people, AHU outside/return-air mixing<\/strong>. It is not a cleanroom certification case or a product selection. Unused gases, PV, exhaust, PCW and pure-water demand are zero; other equipment and chilled-water assumptions are provided for practice.<\/p>\n<p><strong>Successful practice means “Calculation complete,” while engineering assessment remains “Data required.”<\/strong> Valid calculation, pending evidence and failed conditions are different outcomes; calculation alone does not certify the design. Manufacturer performance, equipment pressure losses and electrical review are deliberately pending. Do not invent data to turn this into a passing selection.<\/p>\n"},{"id":"inputs","title":"4. Start your own project with five input groups","html":"<h2>4. Start your own project with five input groups<\/h2>\n<table>\n<thead>\n<tr>\n<th>Page / input<\/th>\n<th>Example<\/th>\n<th>What to enter for your project<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>01 Shared climate: summer outdoor / room target<\/td>\n<td>35°C, 70% RH / 22°C, 50% RH<\/td>\n<td>Actual design climate and room requirements; winter example is 8°C, 70% RH<\/td>\n<\/tr>\n<tr>\n<td>02 HVAC/rooms: system / A-zone dimensions / people<\/td>\n<td>Mixed AHU / 12, 8, 3 m / 8 people<\/td>\n<td>Actual architecture, dimensions in m; unused zone B retains zero length, width and people<\/td>\n<\/tr>\n<tr>\n<td>02 Airflow calculation / ACH / specified outside air<\/td>\n<td>ACH / 6 per hour / 0 for automatic<\/td>\n<td>ACH is circulation demand, <strong>not all fresh air<\/strong>; 6 is a practice assumption, not a general requirement<\/td>\n<\/tr>\n<tr>\n<td>03 Equipment heat / operating rate / process moisture<\/td>\n<td>5 kW / 100% / No additional moisture<\/td>\n<td>Heat for the same room boundary; use “Unknown” when moisture is not established<\/td>\n<\/tr>\n<tr>\n<td>03 Lighting / wall and floor areas<\/td>\n<td>500 lux, 4000 lm and 40 W per fixture / 60 and 96 m²<\/td>\n<td>Lux is the target; lumens belong to each fixture; areas are m², not m³<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>On page 01, climate inputs appear before the chart. Edit shared climate also locates the fields. Utilization 0.6, maintenance 0.8 and person sensible/latent gains of 75/55 W are preliminary assumptions. In this example the summer adjacent-floor temperature is 22°C, equal to the room, so summer floor transmission is zero. This advanced assumption also affects the result.<\/p>\n<p><strong>Try one change:<\/strong> set A-zone people from 8 to 12 and recalculate. Person sensible heat should increase by <strong>0.300 kW<\/strong>, and latent heat by <strong>0.220 kW<\/strong>. Then restore 8 and recalculate. Changing one input at a time makes the links easier to understand.<\/p>\n"},{"id":"results","title":"5. Check this short result table first","html":"<h2>5. Check this short result table first<\/h2>\n<p>After restoring the original data, compare the summaries on pages 01/03 and the page 09 report:<\/p>\n<table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Expected result<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Area / volume<\/td>\n<td>96 m² / 288 m³<\/td>\n<td>12 × 8; area × 3 m<\/td>\n<\/tr>\n<tr>\n<td>Lighting<\/td>\n<td>25 fixtures / 1.000 kW<\/td>\n<td>4000 lm and 40 W each, count rounded upward<\/td>\n<\/tr>\n<tr>\n<td>Room sensible heat<\/td>\n<td>7.870 kW<\/td>\n<td>Equipment 5 + people 0.6 + lighting 1 + wall 1.270; other example gains are zero<\/td>\n<\/tr>\n<tr>\n<td>Room latent heat / moisture<\/td>\n<td>0.440 kW / 0.633 kg/h<\/td>\n<td>8 × 55 W; no additional process moisture in this example<\/td>\n<\/tr>\n<tr>\n<td>Minimum make-up outside air<\/td>\n<td>192.0 CMH, room basis<\/td>\n<td>8 × 24 CMH/person for this example, not a general ventilation rule<\/td>\n<\/tr>\n<tr>\n<td>Circulation / treated airflow<\/td>\n<td>1728.0 / 2400.2 CMH, room basis<\/td>\n<td>288 × 6 sets a circulation minimum; heat/moisture balance needs more airflow<\/td>\n<\/tr>\n<tr>\n<td>Linked CHW flow<\/td>\n<td>41.115 LPM<\/td>\n<td>Water-side load including 10% allowance, ΔT 5 K; not the stored manual 400 LPM<\/td>\n<\/tr>\n<tr>\n<td>UP preliminary distribution<\/td>\n<td>8.937 A; NFB candidate 15 AT; 3.5 mm² per phase, one set<\/td>\n<td>Separately entered 5 kW electrical input, 380 V, PF 0.85; electrical review remains pending<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Begin with three formulas: <code>area=length×width<\/code>; <code>circulation CMH=volume×ACH<\/code>; <code>fixture count=ceil(target lux×area/(fixture lumens×utilization×maintenance))<\/code>. The full report also states thermal, moisture and piping formulas.<\/p>\n<p>The overview&#39;s <strong>Process-chart season<\/strong> switches summer/winter. Horizontal axis: dry bulb °C; vertical axis: humidity ratio g/kg dry air. OA is outside air, RA room air, IN inlet, C1/C2 cooling coils, HT heating and SA supply. Plotted points are <strong>required or specified states<\/strong>, not proof that unselected installed equipment achieves them. Bypassed stages can overlap; this is not a missing point.<\/p>\n"},{"id":"export","title":"6. Save and export your first report","html":"<h2>6. Save and export your first report<\/h2>\n<ol>\n<li>Use <strong>Save workspace<\/strong> for <code>My_First_Project.json<\/code>. <strong>An opened project saves back to the same file.<\/strong> Save as changes the path and retains project identity. Duplicate as new scheme saves a new file and project identity while preserving the original. Cancelling file selection leaves the active case unchanged.<\/li>\n<li>Select <strong>09 Design report<\/strong>. Read conditions, results, pending data and formulas.<\/li>\n<li><strong>Export Design report<\/strong> at the bottom writes a <strong>TXT<\/strong> file.<\/li>\n<li><strong>Export printable summary<\/strong> at the top writes <strong>HTML<\/strong>. Open it in a browser and print, choosing <strong>Save as PDF<\/strong> if needed.<\/li>\n<li><strong>Save full calculation data JSON<\/strong> on page 09 exports numerical audit results. <strong>It is not a reopenable workspace JSON.<\/strong><\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>Purpose<\/th>\n<th>Open from the workbench?<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Saved workspace <code>.json<\/code><\/td>\n<td>Main project, all AHUs, A/B, sources and transfer receipts<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Exported TXT / HTML / PDF<\/td>\n<td>Read, print or share results<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Full calculation JSON<\/td>\n<td>Numerical review and calculation evidence<\/td>\n<td>Not as a workspace<\/td>\n<\/tr>\n<tr>\n<td>Saved single-AHU JSON<\/td>\n<td>One AHU&#39;s settings<\/td>\n<td>Open in the AHU window; the main entry also routes it to an independent AHU without replacing the workspace<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><strong>Your first practice report is now complete.<\/strong> Learn this route before adding the optional systems below.<\/p>\n"},{"id":"utilities","title":"7. Use other pages only when needed","html":"<h2>7. Use other pages only when needed<\/h2>\n<p>In Basic mode, choose All engineering pages to reveal utilities. For one calculation, use the corresponding simple tool. Its Tool tutorial button opens the matching offline chapter.<\/p>\n<table>\n<thead>\n<tr>\n<th>Sidebar page<\/th>\n<th>When to use it<\/th>\n<th>First checks<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>04 Gases/vacuum<\/td>\n<td>CDA, N2, other gases or PV<\/td>\n<td><strong>Flow<\/strong>, minimum pipe pressure, units; advanced mode supports per-line pressure/velocity<\/td>\n<\/tr>\n<tr>\n<td>05 Electrical distribution<\/td>\n<td>UP/NP demand estimates<\/td>\n<td>Electrical-input kW, three-phase line voltage and load type; electrical input is separate from room heat<\/td>\n<\/tr>\n<tr>\n<td>06 Exhaust ducts<\/td>\n<td>General, acid, alkali, organic or hot exhaust<\/td>\n<td>CMH per line; review preliminary speed/allowance against actual materials and requirements<\/td>\n<\/tr>\n<tr>\n<td>07 Water/pure water<\/td>\n<td>Cooling/heating water or pure-water main<\/td>\n<td>Flow source and ΔT; pure-water circulation LPM and velocity limit<\/td>\n<\/tr>\n<tr>\n<td>08 Pressure losses<\/td>\n<td>A known critical route<\/td>\n<td>An active system, route length, fitting allowance and whether equipment loss is known<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Unused gases, PV, exhaust, PCW and pure water can stay zero in this example. <strong>Water circuits serving the active HVAC system remain linked to its load.<\/strong> Do not zero an active circuit just to hide a page.<\/p>\n<p><strong>Latent load:<\/strong> removal demand caused by moisture entering the room, distinct from ordinary machine heat. People are calculated automatically. An open tank evaporating 1 kg/h into the room adds <code>1×2501/3600=0.695 kW<\/code>; choose <strong>Known moisture generation (kg/h)<\/strong> and enter 1. If the known value is 1 kW, choose <strong>Known latent load (kW)<\/strong> instead. Only the selected mode is used. Outdoor moisture is handled at the coil, not entered again as room process moisture. Unknown process moisture is excluded pending data and may understate dehumidification demand. It is not a conservative allowance.<\/p>\n<p><strong>Linked water flow:<\/strong> the linked mode calculates <code>LPM=60000×kW/(ρ×cp×ΔT)<\/code> and excludes stored manual flow. To use a measured 100 LPM, select <strong>Independent input<\/strong> before entering 100. Capacity is then compared with demand. Upstream PCW heat removal and the main&#39;s flow boundary must also agree. MCHW, CHW, DCCW, PCW and HW each support independent fluid properties; transferring clean-water assumptions for one adopted loop does not overwrite the other loops.<\/p>\n<p><strong>Simple pressure loss:<\/strong> select CHW → route length 30 m → 30% general preliminary allowance → equipment data unavailable. Water-side length is the <strong>sum of supply and return straight runs<\/strong>. <strong>Closed circulation does not add building height as pump static lift.<\/strong> Unknown equipment losses leave a pipe-only subtotal; this is not full pump selection head. The 10/30/50% choices are scenario allowances, not fitting standards. Check Pa/mmAq versus kPa/water head before combining losses.<\/p>\n<p><strong>CDA/PV:<\/strong> pressure and velocity cannot uniquely size a pipe without flow. Gas sizing defaults to the shared <strong>minimum gauge pressure<\/strong>, distinct from supply pressure. PV Torr/kPa(abs)/mbar(abs) are absolute; unit switching converts the value. Pure-water resistivity is a reference target at 25°C, not measured quality certification.<\/p>\n\n\n<p data-v557-note=\"true\">Closed circulation excludes building height from pump differential pressure; check system static pressure separately. Ducts exclude water-side static lift. Mode changes preserve drafts while the adopted value and reason are shown on screen/in reports.<\/p>\n"},{"id":"ahu","title":"8. AHU management: use the second practice project","html":"<h2>8. AHU management: use the second practice project<\/h2>\n<p><code>02_Practice_MAU_and_AHU.json<\/code> already includes a main project and <strong>Tutorial MAU-01<\/strong>, so you need not start with the large 58,000 CMH default unit. It is a full-outside-air MAU+FFU+DCC teaching model for the same 96 m² area, with 20 ACH circulation. Supply-state single-unit airflow is about 358.3 CMH; room-basis airflow is about 359.2 CMH. The small difference comes from state/specific-volume bases.<\/p>\n<ol>\n<li>Save the first project. Open practice copy loads the second example with a new project identity. Alternatively open the second JSON and use Save as.<\/li>\n<li><strong>Recalculate<\/strong> the main project, then open <strong>AHU management<\/strong>.<\/li>\n<li>Select <strong>Tutorial MAU-01<\/strong> → <strong>Open selected AHU<\/strong>. Do not add a new large default unit first.<\/li>\n<li>On <strong>1 Design conditions<\/strong>, inspect airflow, summer/winter conditions/targets, H1/H2 sources, C1/C2 water temperatures/candidate capacities and humidifier type.<\/li>\n<li>All stages initially use automatic demand. H1/H2 each have 8 kW electric heat, C1/C2 each 3 US RT, with wet media operating only when humidification is needed. <strong>These are synthetic practice ratings<\/strong>; manufacturer curves, resistance and media data remain pending.<\/li>\n<li>Recalculate, switch summer/winter in the results, and inspect each inlet/outlet, demand and rating check. Demand states do not simulate actual leaving air from undersized equipment.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Function<\/th>\n<th>Start with<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>H1 preheat<\/td>\n<td>Initial heating, possibly needed for downstream evaporative humidification<\/td>\n<td>Automatic demand; select actual electric, recovered hot water, combined or disabled sources<\/td>\n<\/tr>\n<tr>\n<td>C1 precool<\/td>\n<td>First cooling stage<\/td>\n<td>Automatic demand; review supply/return water and candidate RT<\/td>\n<\/tr>\n<tr>\n<td>Humidification<\/td>\n<td>Evaporative wet media or steam<\/td>\n<td>Actual equipment type; water/energy effects differ<\/td>\n<\/tr>\n<tr>\n<td>C2 recool<\/td>\n<td>Further cooling or dehumidification<\/td>\n<td>Automatic demand; water temperature must support the target humidity ratio<\/td>\n<\/tr>\n<tr>\n<td>H2 reheat<\/td>\n<td>Final supply dry-bulb adjustment<\/td>\n<td>Automatic demand; review this stage&#39;s installed capacity separately<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>For stage outlet targets, enable <strong>Show advanced / manufacturer data<\/strong>, then choose a summer/winter stage&#39;s specified outlet dry bulb. Cooling stages also offer specified T/RH. <strong>Each inlet follows the preceding outlet<\/strong>, rather than restarting at outdoor conditions. Use bypass for an unused stage, not 0°C.<\/p>\n<p><strong>Main → AHU:<\/strong> <strong>Import main-project seasonal supply demand<\/strong> shows a confirmation. It currently supports <strong>full-outside-air MAU main projects only<\/strong> and asks for the unit service share (for example, 50% for each of two units); the first mixed-AHU example cannot be imported into this full-outside-air unit model. It updates seasonal inlet/supply demand and chilled-water temperatures. Explicit stage targets and installed ratings remain and require recalculation. Changing the main boundary expires the old link; reimport it.<\/p>\n<p><strong>AHU → main:<\/strong> use <strong>Preview water / rated-power transfer<\/strong>, read before/after values, then confirm. This example previews MCHW <strong>12.443 LPM<\/strong>, CHW <strong>12.348 LPM<\/strong>, NP fan <strong>0.370 kW<\/strong>, heating <strong>16.000 kW<\/strong>, and confirmed wash pump <strong>0.100 kW<\/strong>. Heating 16 kW is the sum of installed heater ratings, <strong>not concurrent air-heating demand<\/strong>.<\/p>\n<p>Demand ledger records explicitly included sources. <strong>Returning the same AHU ID updates that source; different units add.<\/strong> On first transfer, confirm whether existing electrical or gas values represent other equipment. No rebuilds those targets from included sources, avoiding double counting. Unknown pump or steam input leaves a known-power subtotal with pending data.<\/p>\n<p>Water circuits merge only at matching supply/return temperatures, fluid and service group. Design flow is <code>max(sum of summer, sum of winter)<\/code>, not a sum of individual seasonal maxima. Incompatible circuits remain separate; one main hydraulic row can adopt only one selected circuit. The others remain in the report. Electrical design retains P/Q, source design allowances and a branch-current floor. A/B alternatives must not be included as concurrent installed units. Transfer does not certify manufacturer performance.<\/p>\n<p>Closing an AHU window retains the unit. Save the whole workspace from the main window. <strong>Save single AHU<\/strong> writes a separate unit file. Read the <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/ahu.en.md\">larger stage-capacity worked example<\/a> next if needed.<\/p>\n\n\n<p data-v557-note=\"true\">Inactive fields retain drafts but do not affect calculations or reports. Non-electric stages ignore electric efficiency. Offline heat recovery omits adopted water conditions; non-wash equipment omits wash-pump and wash-makeup sizing. Rated power sums selected direct heaters, steam generators and EC fans; pumps/auxiliaries require separate confirmation. Main C1 mode applies to summer only; use seasonal AHU controls for winter stages.<\/p>\n"},{"id":"recovery","title":"9. Sources, A/B comparison and recovery","html":"<h2>9. Sources, A/B comparison and recovery<\/h2>\n<p><strong>Sources / comparison / recovery<\/strong> contains three tabs:<\/p>\n<table>\n<thead>\n<tr>\n<th>Tab<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Parameter sources<\/td>\n<td>Identify assumptions, measurements and manufacturer documents, with selection/catalog references<\/td>\n<\/tr>\n<tr>\n<td>A/B scenarios<\/td>\n<td>Recalculate and capture A; change one input, recalculate and capture B; compare. Captured snapshots do not automatically update after further edits<\/td>\n<\/tr>\n<tr>\n<td>Backups and calculation basis<\/td>\n<td>View recovery; automatic recovery runs about every 30 seconds and does not replace deliberate saving<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Resaving an existing project preserves a <code>.json.bak<\/code>. An exported calculation result is not a project backup. Keep the workspace, not only a TXT report. Invalid inputs can be saved as a draft; they do not thereby become valid report inputs.<\/p>\n"},{"id":"faq","title":"10. When you get stuck","html":"<h2>10. When you get stuck<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Next action<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Shared temperature/humidity fields are missing<\/td>\n<td>On 01, climate inputs precede the chart; Edit shared climate also locates them<\/td>\n<\/tr>\n<tr>\n<td>A field is hidden/disabled<\/td>\n<td>Check basic/advanced and control modes; inactive values are retained, not deleted<\/td>\n<\/tr>\n<tr>\n<td>Editing shows Recalculation required<\/td>\n<td>The last valid plot/report remains for comparison, marked stale with export/transfer disabled. Correct inputs and recalculate for current results<\/td>\n<\/tr>\n<tr>\n<td>Red input outline or export disabled<\/td>\n<td>Locate issue, fix that field/unit and recalculate; do not reuse an old report<\/td>\n<\/tr>\n<tr>\n<td>Data required<\/td>\n<td>Read what is missing; preliminary calculation does not certify product selection<\/td>\n<\/tr>\n<tr>\n<td>Conditions not met<\/td>\n<td>Inspect the capacity, temperature or flow limitation; increasing a safety allowance alone is not a repair<\/td>\n<\/tr>\n<tr>\n<td>Process moisture unknown<\/td>\n<td>Choose the unknown mode and retain pending data rather than guessing a large kW<\/td>\n<\/tr>\n<tr>\n<td>PCW removal exceeds equipment heat<\/td>\n<td>Recheck common operating boundary, unit count, flow, ΔT, operating rate and exhaust share<\/td>\n<\/tr>\n<tr>\n<td>Manual water flow has no effect<\/td>\n<td>Linked mode ignores it; choose Independent input for measured flow<\/td>\n<\/tr>\n<tr>\n<td>Mixed AHU cannot link to the unit<\/td>\n<td>The full-outside-air unit model supports MAU links; do not change a real system&#39;s architecture just to bypass this restriction<\/td>\n<\/tr>\n<tr>\n<td>Transfer says the source expired<\/td>\n<td>Reimport current main demand; detach only for a deliberate independent design<\/td>\n<\/tr>\n<tr>\n<td>You only need one calculation<\/td>\n<td>Return to the simple calculator instead of filling a whole facility<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Practice verification runs <strong>20 operation-related conditions per source platform<\/strong>, including heat/moisture conservation, units, water ownership, pressure-loss scope, MAU linking and insufficient capacity. See <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/tutorial/README.md\">inputs, verifier and evidence<\/a>. Control locations were checked against source. Native acceptance of the new tutorial entry and author credit is tracked separately; numerical checks are not described as manual testing of every UI control.<\/p>\n<p>For remaining problems, <a href=\"https://github.com/azx4121/facility-studio/issues\">report an issue<\/a> with version, platform, page, steps and synthetic input. Formal product/protection selection needs site conditions and manufacturer data. Use remains governed by the <a href=\"https://github.com/azx4121/facility-studio/blob/main/LICENSE_GUIDE.en.md\">current license guide<\/a>, including the internal engineering-work permission.<\/p>\n"},{"id":"electrical","title":"Optional: Electrical calculator: kW, current, NFB and conductor candidates","html":"<h2>Electrical calculator: kW, current, NFB and conductor candidates<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/electrical.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Select <strong>English<\/strong> at the top right, then open <strong>Electrical sizing<\/strong>. Enter equipment input power, supply and use type. <strong>kW means electrical input power<\/strong>; convert motor shaft kW or HP using efficiency before using this quick tool.<\/p>\n<p>Under <strong>Adjust defaults / advanced settings<\/strong>, check PF, one-way cable length, ambient temperature, loaded conductors and terminal temperature. The example defaults are PF 0.85, copper XLPE, 30 m one-way, 35°C ambient, 60°C terminals, three conductors in conduit and 3% maximum voltage drop. These are reference assumptions, not universal installation rules.<\/p>\n<p><a id=\"case-01\"><\/a><\/p>\n<h2>Case 01: 10 kW, three-phase 380 V<\/h2>\n<table>\n<thead>\n<tr>\n<th>Condition / result<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Electrical input / supply<\/td>\n<td>10 kW / three-phase 380 V line-to-line<\/td>\n<\/tr>\n<tr>\n<td>Use / PF / one-way length<\/td>\n<td>General load / 0.85 / 30 m<\/td>\n<\/tr>\n<tr>\n<td>Operating and design current<\/td>\n<td>17.8746 A<\/td>\n<\/tr>\n<tr>\n<td>Candidate<\/td>\n<td>NFB 20 AT; 5.5 mm² per phase × 1 set<\/td>\n<\/tr>\n<tr>\n<td>Effective ampacity<\/td>\n<td>25 A<\/td>\n<\/tr>\n<tr>\n<td>Voltage drop<\/td>\n<td>2.903 V; 0.764%<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Formula: <code>I = P[kW] × 1000 / (√3 × V_line-to-line × PF)<\/code>.\nCandidates must meet <code>design current ≤ NFB AT ≤ effective ampacity<\/code> and the configured voltage-drop limit. Sizes come from this project&#39;s reference tables; actual installation and manufacturer data need review.<\/p>\n<p><a id=\"case-02\"><\/a><\/p>\n<h2>Case 02: 5 kW, single-phase 220 V, continuous load<\/h2>\n<p>Use PF 1 and 20 m one-way; retain other defaults. <code>I = 5000 / (220 × 1) = 22.7273 A<\/code>. The tool&#39;s 125% continuous-load estimate gives 28.4091 A design current. Candidate: NFB 30 AT, 8 mm² × 1 set, effective ampacity 33 A, voltage drop 1.031%. Single-phase voltage drop includes the outgoing and return conductors; enter the one-way distance.<\/p>\n<p>Resistance heaters may be near PF 1. Motors and drives need their actual data. Motor breaker selection also needs FLC, starting behavior and independent overload protection. Neutral, grounding, short-circuit ratings and protective coordination require separate checks.<\/p>\n<p><a id=\"case-19\"><\/a><\/p>\n<h2>Case 19: fault current, Icu and protective coordination<\/h2>\n<p>This request is <strong>outside this tool&#39;s complete scope<\/strong>. Load current and breaker AT are not fault current or interrupting capacity Icu/Ics. Obtain source fault level, transformer impedance, cable impedance and protection curves, then use a suitable model and engineering review.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/01-electrical.json\">01<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/02-electrical.json\">02<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original inverse-check results<\/a>.<\/p>\n\n\n<p data-v557-note=\"true\">Workbench: general/motor loads with listed HP use the largest-motor allowance; 0 means unknown and uses 125% of total current. Continuous loads always use 125%, excluding inactive largest-motor drafts. Derating uses ambient/conductor dropdown ranges; independent tools use entered ambient/count values.<\/p>\n"},{"id":"duct","title":"Optional: Duct calculator: airflow, rectangular / round sizes and static pressure","html":"<h2>Duct calculator: airflow, rectangular / round sizes and static pressure<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/duct.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open <strong>Duct sizing<\/strong>. Default size-only mode needs airflow in CMH, CFM or L/s and does not require static pressure. Enable the known-route check to enter available pressure, length, fittings and equipment loss. Advanced settings expose velocity, aspect ratio and properties. Defaults are maximum 8 m/s and rectangular aspect-ratio limit 2; these do not suit every supply, corrosive exhaust or noise requirement.<\/p>\n<p><a id=\"case-03\"><\/a><\/p>\n<h2>Case 03: 3,000 CMH, 200 Pa<\/h2>\n<p>Use maximum velocity 8 m/s, aspect-ratio limit 2 and no route input.<\/p>\n<table>\n<thead>\n<tr>\n<th>Result<\/th>\n<th>Rectangular<\/th>\n<th>Round<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Candidate<\/td>\n<td>350 × 300 mm<\/td>\n<td>Ø406.4 mm (16 in)<\/td>\n<\/tr>\n<tr>\n<td>Actual velocity<\/td>\n<td>7.937 m/s<\/td>\n<td>6.424 m/s<\/td>\n<\/tr>\n<tr>\n<td>Inactive pressure draft<\/td>\n<td>200 Pa, not assessed in size-only mode<\/td>\n<td>Same<\/td>\n<\/tr>\n<tr>\n<td>Pressure sufficiency<\/td>\n<td>Route not assessed<\/td>\n<td>Route not assessed<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>A = CMH / 3600 / v<\/code>; <code>D_round = √(4A / π)<\/code>. Discrete size increments reduce actual velocity below the limit. <strong>Static pressure alone cannot determine size; without a route, 200 Pa is not declared sufficient.<\/strong><\/p>\n<p><a id=\"case-04\"><\/a><\/p>\n<h2>Case 04: 2,000 CFM and a known 20 m route<\/h2>\n<p>Use 2,000 CFM, 300 Pa available pressure, enable the known-route check, and enter 20 m straight length, fitting <code>ΣK = 4<\/code>, equipment/terminal loss 100 Pa and maximum velocity 8 m/s. Retain other defaults.<\/p>\n<table>\n<thead>\n<tr>\n<th>Result<\/th>\n<th>Rectangular<\/th>\n<th>Round<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Airflow<\/td>\n<td>3,398.022 CMH<\/td>\n<td>Same<\/td>\n<\/tr>\n<tr>\n<td>Candidate<\/td>\n<td>400 × 300 mm<\/td>\n<td>Ø406.4 mm (16 in)<\/td>\n<\/tr>\n<tr>\n<td>Actual velocity<\/td>\n<td>7.866 m/s<\/td>\n<td>7.277 m/s<\/td>\n<\/tr>\n<tr>\n<td>Route loss<\/td>\n<td>286.912 Pa<\/td>\n<td>254.095 Pa<\/td>\n<\/tr>\n<tr>\n<td>Remaining pressure<\/td>\n<td>13.088 Pa<\/td>\n<td>45.905 Pa<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>Δp = f(L/Dh)ρv²/2 + ΣKρv²/2 + equipment loss<\/code>.\nFor a rectangle, <code>Dh = 2WH/(W+H)<\/code>, but velocity uses the <strong>actual rectangular area<\/strong>. Do not recalculate velocity using a circle of diameter Dh. This example uses air density 1.2 kg/m³, viscosity 1.81 × 10⁻⁵ Pa·s and roughness 0.09 mm.<\/p>\n<p>The quick route assumes constant size and flow along the route. Branch networks, changing sections, pollutant treatment, fan curves and filter final resistance need separate modeling. The maximum equipment-end static-pressure requirement is not total fan ESP.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/03-duct.json\">03<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/04-duct.json\">04<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original inverse-check results<\/a>.<\/p>\n"},{"id":"gas","title":"Optional: CDA / N2 / process vacuum: standard flow, actual flow and pressure","html":"<h2>CDA / N2 / process vacuum: standard flow, actual flow and pressure<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/gas-vacuum.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Pipe size needs <strong>flow, pressure and a velocity limit<\/strong>. Pressure and velocity without flow cannot determine a diameter. <strong>CDA / gas piping<\/strong> supports CDA, N2 and Ar; use the full workbench for other gases and PV. This is a velocity-based cross-section estimate, not a full compressible pipe-loss solver.<\/p>\n<p>SLPM, SCFM and Sm³/h are standard-volume units; ALPM is actual pipe volume flow. Default reference: 25°C and 101.325 kPa absolute. Default pipe temperature and local atmospheric pressure are also 25°C and 101.325 kPa. Check the equipment&#39;s reference conditions and adjust them if needed.<\/p>\n<p><code>P_absolute = P_gauge + P_local_atmosphere<\/code><\/p>\n<p><code>Q_actual = Q_standard × P_standard/P_absolute × T_pipe[K]/T_standard[K]<\/code><\/p>\n<p>The examples use ideal-gas Z ratio 1. Nominal size is not actual inner diameter; material and wall thickness require confirmation.<\/p>\n<p>Choose Standard flow for SLPM/SCFM/Sm³/h or Actual pipe flow for ALPM/ACFM/Am³/h. Switching basis converts equivalent demand using current pressure and temperature; 800 SLPM is not renamed 800 ALPM. If a nameplate states only L/min, establish its temperature/pressure basis before sizing.<\/p>\n<p><a id=\"case-05\"><\/a><\/p>\n<h2>Case 05: CDA 800 SLPM, 6 bar(g), maximum 15 m/s<\/h2>\n<table>\n<thead>\n<tr>\n<th>Result<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Absolute pipe pressure<\/td>\n<td>701.325 kPa(abs)<\/td>\n<\/tr>\n<tr>\n<td>Actual flow<\/td>\n<td>115.581 ALPM<\/td>\n<\/tr>\n<tr>\n<td>Minimum theoretical ID<\/td>\n<td>12.787 mm<\/td>\n<\/tr>\n<tr>\n<td>Table candidate<\/td>\n<td>1/2 in (15A), reference ID 16.1 mm<\/td>\n<\/tr>\n<tr>\n<td>Actual velocity<\/td>\n<td>9.462 m/s<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>D_inner[mm] = √(4 × ALPM / 60000 / π / v_limit) × 1000<\/code>.<\/p>\n<p><a id=\"case-06\"><\/a><\/p>\n<h2>Case 06: N2 100 Sm³/h, 600 kPa(g), maximum 12 m/s<\/h2>\n<p>100 Sm³/h = 1,666.667 SLPM; 600 kPa(g) = 6 bar(g). Actual flow is 240.794 ALPM, minimum ID 20.635 mm. Candidate: 3/4 in (20A), reference ID 21.4 mm, actual velocity 11.158 m/s.<\/p>\n<p><a id=\"case-07\"><\/a><\/p>\n<h2>Case 07: PV 2,000 SLPM, 150 Torr(abs)<\/h2>\n<p>In <strong>Full workbench<\/strong>, open the gas/PV section and enter 2,000 SLPM and 150 Torr absolute. Use maximum velocity 18 m/s, pipe/reference temperature 25°C and Z ratio 1.<\/p>\n<p>150 Torr(abs) = 19.9984 kPa(abs) = 199.984 mbar(abs).\n<code>Q_actual = 2000 × 760/150 = 10,133.333 ALPM<\/code>.\nMinimum ID is 109.300 mm. The reference table selects 6 in (150A), ID 160.3 mm, velocity 8.368 m/s. Its 4 in candidate has ID 108.3 mm and is too small.<\/p>\n<p>This is a <strong>process-vacuum volume-flow estimate<\/strong>, not high-vacuum performance, conductance, evacuation time or pump selection. Obtain pump curves, conductance, leaks/outgassing and external-pressure collapse data separately. Torr/kPa/mbar conversion retains the absolute-pressure basis. Supply and remote minimum pressures must satisfy the full workbench&#39;s pressure bounds.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/05-gas.json\">05<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/06-gas.json\">06<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/scenarios.json\">PV scenario 07<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original results<\/a>.<\/p>\n"},{"id":"lighting","title":"Optional: Lighting calculator: m² / m³, lumens, lux and luminaire count","html":"<h2>Lighting calculator: m² / m³, lumens, lux and luminaire count<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/lighting.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open <strong>Lighting<\/strong> and choose illuminance estimation or luminaire-count calculation. Space input can be m², Taiwan ping, length × width or m³. For volume, enter the clear height of <strong>the same room<\/strong>: <code>illuminated area = volume / clear height<\/code>. Enter volume, not area, in the m³ field.<\/p>\n<p>Luminaire output is <strong>lumens (lm)<\/strong>; illuminance is <strong>lux = lm/m²<\/strong>. Watts alone do not determine lux. Use manufacturer lumens when known; an LED-watts estimate must retain its assumed efficacy.<\/p>\n<p><a id=\"case-08\"><\/a><\/p>\n<h2>Case 08: 90 m³, 3 m height, 40 W × 10 luminaires<\/h2>\n<p>Select volume and enter 90 m³ and 3 m. Use 40 W per luminaire, count 10, estimated efficacy 100 lm/W, utilization U 0.6 and maintenance factor M 0.8.<\/p>\n<p><code>Area = 90/3 = 30 m²<\/code><\/p>\n<p><code>Lumens per luminaire = 40 × 100 = 4000 lm<\/code><\/p>\n<p><code>Average lux = 10 × 4000 × 0.6 × 0.8 / 30 = 640 lux<\/code><\/p>\n<p>Lighting power is 0.4 kW.<\/p>\n<p><a id=\"case-09\"><\/a><\/p>\n<h2>Case 09: 30 m² and target 500 lux<\/h2>\n<p>Choose count calculation, area 30 m², target 500 lux, manufacturer output 4,000 lm per luminaire, 40 W each, U 0.6 and M 0.8.<\/p>\n<p><code>N = ceil(500 × 30 / (4000 × 0.6 × 0.8)) = 8<\/code><\/p>\n<p>The rounded-up count gives 512 lux and 0.32 kW. Seven luminaires give only 448 lux.<\/p>\n<p>U, M and 100 lm/W are example assumptions. Confirm luminaire data, reflectance, installation height, cleaning and aging. This tool estimates average illuminance; it does not simulate photometric files, glare, point illuminance or uniformity.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/08-lighting.json\">08<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/09-lighting.json\">09<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original inverse-check results<\/a>.<\/p>\n"},{"id":"water","title":"Optional: PCW / CHW / hot water: flow, kW, RT, ΔT and pipe size","html":"<h2>PCW / CHW / hot water: flow, kW, RT, ΔT and pipe size<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/water.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open <strong>More quick tools → Water / heat load<\/strong>. Choose <strong>Known water flow<\/strong> or <strong>Known heat load<\/strong>. Example defaults: clean-water density 1,000 kg/m³, specific heat 4.1868 kJ/(kg·K), maximum water velocity 1.5 m/s. Flow units include LPM, US GPM and m³/h.<\/p>\n<p><code>Q[kW] = LPM/60000 × ρ × cp × ΔT[K]<\/code><\/p>\n<p>US RT uses 3.51685284 kW/RT. ΔT is the supply/return <strong>temperature difference<\/strong>, not either water temperature. Glycol and other liquids need their applicable properties; do not use the clean-water defaults unchanged.<\/p>\n<p><a id=\"case-10\"><\/a><\/p>\n<h2>Case 10: PCW 100 LPM, ΔT 5 K<\/h2>\n<p><code>100/60000 × 1000 × 4.1868 × 5 = 34.89 kW ≈ 9.921 US RT<\/code><\/p>\n<p>At maximum velocity 1.5 m/s, candidate 40A (1-1/2 in), reference ID 40.9 mm, actual velocity 1.269 m/s.<\/p>\n<p><a id=\"case-11\"><\/a><\/p>\n<h2>Case 11: CHW 100 kW, ΔT 5 K<\/h2>\n<p><code>LPM = 100 × 60000 / (1000 × 4.1868 × 5) = 286.615 LPM<\/code><\/p>\n<p>Candidate 65A (2-1/2 in), reference ID 67.9 mm, velocity 1.319 m/s.<\/p>\n<p>The candidate satisfies the chosen velocity limit only. Pump head, coil/heat-exchanger loss, complete supply/return routes, expansion vessel, static pressure and NPSH need separate checks.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/10-water.json\">10<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/11-water.json\">11<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original inverse-check results<\/a>.<\/p>\n"},{"id":"air","title":"Optional: Psychrometric calculator: dry bulb, RH, wet bulb, dew point and enthalpy","html":"<h2>Psychrometric calculator: dry bulb, RH, wet bulb, dew point and enthalpy<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/psychrometrics.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open <strong>More quick tools → Psychrometrics<\/strong>. Enter dry-bulb temperature in °C and relative humidity in %RH. Properties and the chart point update live. Atmospheric pressure defaults to 101.325 kPa(abs) and can be changed in advanced settings; chart curves follow the selected pressure. This quick tool uses dry bulb plus RH; the full workbench offers additional state-input combinations.<\/p>\n<p><a id=\"case-12\"><\/a><\/p>\n<h2>Case 12: 35°C, 70% RH, 101.325 kPa(abs)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Property<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Humidity ratio<\/td>\n<td>25.159 g/kg dry air<\/td>\n<\/tr>\n<tr>\n<td>Enthalpy<\/td>\n<td>99.771 kJ/kg dry air<\/td>\n<\/tr>\n<tr>\n<td>Dew point<\/td>\n<td>28.701°C<\/td>\n<\/tr>\n<tr>\n<td>Wet bulb<\/td>\n<td>30.059°C<\/td>\n<\/tr>\n<tr>\n<td>Specific volume<\/td>\n<td>0.90827 m³/kg dry air<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>Pw = RH/100 × Pws(T)<\/code><\/p>\n<p><code>w = 0.621945 × Pw/(P − Pw)<\/code><\/p>\n<p><code>h = 1.006T + w(2501 + 1.86T)<\/code><\/p>\n<p>P and Pw must use the same pressure unit. In the enthalpy equation, w is kg/kg dry air, not g/kg.<\/p>\n<p><a id=\"case-13\"><\/a><\/p>\n<h2>Case 13: 25°C, 50% RH, 80 kPa(abs)<\/h2>\n<p>Change atmospheric pressure to 80 kPa. Results: 12.568 g/kg dry air, enthalpy 57.167 kJ/kg dry air, dew point 13.864°C, wet bulb 17.332°C, specific volume 1.09139 m³/kg dry air. At the same dry bulb and RH, vapor partial pressure is unchanged, but humidity ratio and specific volume depend on total pressure.<\/p>\n<p>At RH 0%, no finite dew point exists; the software does not invent one. Coil loads require dry-air mass flow and inlet/outlet states; a single plotted point does not determine an HVAC load.<\/p>\n<p>Actual native English macOS screen below uses <strong>25°C / 50% RH at standard pressure<\/strong>, not the 35°C case above:<\/p>\n<p><img src=\"data
