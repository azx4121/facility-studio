lux, catalogue output 4000 lm per luminaire, 40 W each and the same U/M. Expect 8 luminaires, 512 lux and 0.32 kW.<\/li><\/ol>\n<p>These are synthetic examples, not universal design values. Lux is illuminance; lm is light output. Watts alone do not establish lux. Catalogue U + room-index K requires actual length, width, mounting height and workplane height. K helps select U from manufacturer data; it does not generate U. The lumen method has no point illuminance, uniformity or UGR calculation.<\/p>\n<p>Advanced conditions accept project, room, luminaire and source references. Export this tool's result to HTML for browser printing / Save as PDF, or select TXT. Textual source references do not import photometry.<\/p>\n<h3>Use manufacturer IES/LDT for direct illuminance<\/h3><ol><li>Open Layout / direct illuminance and Import IES / LDT. Review the source ID, luminaire/file and SHA-256. Unsupported formats are rejected; renaming an extension does not convert the data.<\/li><li>Enter room length/width, workplane height, edge inset, X/Y sample counts and maintenance factor. Distances are metres. Maintenance defaults to 1 and does not inherit the lumen method's 0.8.<\/li><li>Select a Photometry ID, rows (Y), columns (X) and mounting height, then Generate editable schedule. This replaces the schedule below, so retain any existing work first. Or edit CSV rows directly as <code>ID,x,y,z,yaw,scale<\/code>: ID is the photometry source ID and scale is a 0–1 light-output multiplier.<\/li><li>The origin is lower left, +X right, +Y up and z is height above floor. Every luminaire faces down; tilt is unsupported. At yaw=0, file C0 points along +X and C90 along +Y. Positive yaw is counterclockwise from above. C0 need not be the housing front.<\/li><li>Calculate direct illuminance. Review sampled mean/minimum/maximum, Emin/Eavg, Emin/Emax, layout and isolux contours. Refine the grid and compare results to avoid missing narrow beams or dark regions.<\/li><li>Export HTML, CSV or JSON. Editing conditions, sources or layout clears the old result and requires recalculation. Changes during a save dialog also prevent stale export.<\/li><\/ol>\n<p><strong>Direct light is not a full lighting simulation.<\/strong> This is downward point-source direct light on a horizontal plane, excluding reflections, shadows, daylight, reflected wall/ceiling results and UGR. It is not DIALux-equivalent. Statistics describe the sampled grid; interpolated contours do not establish continuous extrema or compliance. Maintenance is applied once, U is not applied, and scale does not imply proportionally lower electrical power.<\/p>\n<p>IES support is a strict subset including LM-63-1995/2002, Type C and TILT=NONE. LDT support includes one lamp set, Isym 0/1/2/4 and zero measurement tilt. Imports are file snapshots; reimport changed source files explicitly. CSV/JSON preserve results and traceability; <strong>this version cannot reopen a direct-lighting project<\/strong>. Retain source files, inputs and schedule before closing. See <a href=\"https://github.com/azx4121/facility-studio/blob/2d42afdeb4c09d4edc64f02e55376e239ce0fe4d/docs/2026-11-03-direct-lighting.md\">format and model limits (internet required)<\/a>.<\/p>\n"},{"id":"water","title":"Optional: PCW / CHW / hot water: flow, kW, RT, ΔT and pipe size","html":"<h2>PCW / CHW / hot water: flow, kW, RT, ΔT and pipe size<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/water.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open <strong>Water / heat load in the sidebar<\/strong>. Choose <strong>Known water flow<\/strong> or <strong>Known heat load<\/strong>. Example defaults: clean-water density 1,000 kg/m³, specific heat 4.1868 kJ/(kg·K), maximum water velocity 1.5 m/s. Flow units include LPM, US GPM and m³/h.<\/p>\n<p><code>Q[kW] = LPM/60000 × ρ × cp × ΔT[K]<\/code><\/p>\n<p>US RT uses 3.51685284 kW/RT. ΔT is the supply/return <strong>temperature difference<\/strong>, not either water temperature. Glycol and other liquids need their applicable properties; do not use the clean-water defaults unchanged.<\/p>\n<p><a id=\"case-10\"><\/a><\/p>\n<h2>Case 10: PCW 100 LPM, ΔT 5 K<\/h2>\n<p><code>100/60000 × 1000 × 4.1868 × 5 = 34.89 kW ≈ 9.921 US RT<\/code><\/p>\n<p>At maximum velocity 1.5 m/s, candidate 40A (1-1/2 in), reference ID 40.9 mm, actual velocity 1.269 m/s.<\/p>\n<p><a id=\"case-11\"><\/a><\/p>\n<h2>Case 11: CHW 100 kW, ΔT 5 K<\/h2>\n<p><code>LPM = 100 × 60000 / (1000 × 4.1868 × 5) = 286.615 LPM<\/code><\/p>\n<p>Candidate 65A (2-1/2 in), reference ID 67.9 mm, velocity 1.319 m/s.<\/p>\n<p>The candidate satisfies the chosen velocity limit only. Pump head, coil/heat-exchanger loss, complete supply/return routes, expansion vessel, static pressure and NPSH need separate checks.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/10-water.json\">10<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/11-water.json\">11<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original inverse-check results<\/a>.<\/p>\n<p data-v560-note=\"true\">Automatic water references extend to 30 inches, selecting one pipe within the velocity limit before parallel circuits. Added 14–30 inch carbon-steel STD references use 9.5 mm walls; enter the actual ID when supplied dimensions differ. 7,000 LPM at 1 m/s selects one 16-inch pipe, ID387.4mm; 30,000 LPM at 2 m/s selects one 24-inch pipe, ID590.6mm. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/2026-10-16-gemini-integration-review.md\">Current dimension sources and review<\/a>.<\/p>\n"},{"id":"air","title":"Optional: Psychrometric calculator: dry bulb, RH, wet bulb, dew point and enthalpy","html":"<h2>Psychrometric calculator: dry bulb, RH, wet bulb, dew point and enthalpy<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/psychrometrics.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open Psychrometrics. Enter state A dry bulb and RH; enable Compare a second air state for B and select whether B represents the room or coil leaving/supply air. Advanced Local atmospheric pressure uses kPa(abs), default 101.325. Both states use the same pressure; do not enter gauge pressure.<\/p>\n<p><a id=\"case-12\"><\/a><\/p>\n<h2>Case 12: 35°C, 70% RH, 101.325 kPa(abs)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Property<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Humidity ratio<\/td>\n<td>25.159 g/kg dry air<\/td>\n<\/tr>\n<tr>\n<td>Enthalpy<\/td>\n<td>99.771 kJ/kg dry air<\/td>\n<\/tr>\n<tr>\n<td>Dew point<\/td>\n<td>28.701°C<\/td>\n<\/tr>\n<tr>\n<td>Wet bulb<\/td>\n<td>30.059°C<\/td>\n<\/tr>\n<tr>\n<td>Specific volume<\/td>\n<td>0.90827 m³/kg dry air<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p><code>Pw = RH/100 × Pws(T)<\/code><\/p>\n<p><code>w = 0.621945 × Pw/(P − Pw)<\/code><\/p>\n<p><code>h = 1.006T + w(2501 + 1.86T)<\/code><\/p>\n<p>P and Pw must use the same pressure unit. In the enthalpy equation, w is kg/kg dry air, not g/kg.<\/p>\n<p><a id=\"case-13\"><\/a><\/p>\n<h2>Case 13: 25°C, 50% RH, 80 kPa(abs)<\/h2>\n<p>Change atmospheric pressure to 80 kPa. Results: 12.568 g/kg dry air, enthalpy 57.167 kJ/kg dry air, dew point 13.864°C, wet bulb 17.332°C, specific volume 1.09139 m³/kg dry air. At the same dry bulb and RH, vapor partial pressure is unchanged, but humidity ratio and specific volume depend on total pressure.<\/p>\n<p>At RH 0%, no finite dew point exists; the software does not invent one. Coil loads require dry-air mass flow and inlet/outlet states; a single plotted point does not determine an HVAC load.<\/p>\n\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/12-air.json\">12<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/13-air.json\">13<\/a>. The original verifier independently checks humidity ratio/enthalpy against the Buck saturation-pressure correlation with 0.3% approximation tolerance: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">results<\/a>.<\/p>\n<h3>Reading the enlarged chart<\/h3><ol><li>Obtain a valid result, then select Enlarge psychrometric chart. The full chart includes dry-bulb/humidity-ratio grids, 10–100% RH curves, enthalpy, wet-bulb and specific-volume families at the selected pressure.<\/li><li>The horizontal axis is dry bulb °C; the right axis is g/kg dry air. The outer green ruler is enthalpy h, brown WB marks wet bulb, and purple v marks specific volume. Enthalpy and wet bulb are different scales.<\/li><li>Use Zoom in / Zoom out or the wheel; drag to pan. Fit / reset or double-click restores the full chart. Maximize enlarges the window; Esc or Close exits.<\/li><li>Read A/B with their numerical summaries. The connection compares endpoints only; <strong>it does not certify an actual coil or equipment process<\/strong>. Loads also need airflow and the correct state basis.<\/li><\/ol><p><strong>The enlarged window is a snapshot at opening, not a live view.<\/strong> After changing A/B or pressure, obtain a fresh valid result on the main page, close the old chart and reopen it. Correct stale or invalid main inputs before using a chart as a current result.<\/p>"},{"id":"units","title":"Optional: Engineering units: CFM / CMH, temperature, temperature difference and Kv / Cv","html":"<h2>Engineering units: CFM / CMH, temperature, temperature difference and Kv / Cv<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/units.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open <strong>Unit converter in the sidebar<\/strong>. Choose the physical quantity, value and source unit. Supported quantities include airflow, water flow, pressure, thermal power, length, temperature, temperature difference and valve flow coefficient.<\/p>\n<p><a id=\"case-14\"><\/a><\/p>\n<h2>Case 14: 1,000 CFM<\/h2>\n<p>Choose airflow, value 1,000 and source CFM.<\/p>\n<p><code>1,000 CFM = 1,699.0108 CMH = 471.9474 L/s = 0.4719474 m³/s<\/code><\/p>\n<p><code>1 CFM = 1.69901079552 CMH<\/code>. CMM (m³/min) and CMH (m³/h) are different.<\/p>\n<p><a id=\"case-15\"><\/a><\/p>\n<h2>Case 15: chilled water 12°C to 7°C<\/h2>\n<p>Choose <strong>temperature difference<\/strong>, value 5 and source °C difference. Result: 5 K = 9°F difference.<\/p>\n<p><code>ΔT_F = ΔT_C × 9/5<\/code>, without adding 32. For an actual temperature, use the separate temperature quantity: 25°C = 77°F = 298.15 K.<\/p>\n<p><strong>Kv/Cv are valve flow coefficients.<\/strong> Kv expresses water flow in m³/h at a 1 bar pressure drop; Cv(US) uses US GPM at 1 psi. This conversion uses <code>Kv ≈ 0.865 × Cv(US)<\/code>. It is not pipe diameter conversion or complete gas-valve selection.<\/p>\n<p>Pressure conversion retains the gauge/absolute basis: changing bar to kPa does not add atmospheric pressure. US and UK GPM, and US RT and Japanese refrigeration tons, remain separate.<\/p>\n<p>A one-off stable conversion can be answered directly. The tool is useful for repeated offline comparison and engineering calculations.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/14-units.json\">14<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/15-units.json\">15<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original results<\/a>.<\/p>\n"},{"id":"equipment","title":"Optional: Excel / CSV equipment demand: electricity, PCW, CDA, N2, EXHAUST, DI and PV","html":"<h2>Excel / CSV equipment demand: electricity, PCW, CDA, N2, EXHAUST, DI and PV<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/equipment.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Choose <strong>English<\/strong>, then open <strong>Equipment schedules<\/strong> at the top right and export a template. Newly exported Excel/CSV templates use the selected language. The bundled and <a href=\"https://github.com/azx4121/facility-studio/blob/main/windows/facility_studio/resources/Equipment_Template.xlsx\">repository template<\/a> may retain Chinese labels; both languages can be imported. Excel contains seven systems; a CSV file represents one selected system.<\/p>\n<ol>\n<li>Enter each equipment ID/name, supply group, quantity, simultaneous-use percentage and per-unit system data.<\/li>\n<li>Set <strong>Enabled (1/0)<\/strong> to <strong>1<\/strong> for actual equipment. Example rows default to 0 and are excluded.<\/li>\n<li>Enter actual numeric values in input cells. Paste values instead of formulas; do not use TRUE/FALSE or Excel error values.<\/li>\n<li>Import and inspect groups, assumptions, missing data and results before exporting the report.<\/li>\n<\/ol>\n<p>Retain sheet names and row 5 headers, and sort complete rows. Row 6 is a disabled example; add equipment from row 7 or replace the example. The template provides 100 rows; insert extra rows before the field instructions, up to 10,000 records per system. Input formulas, macros and legacy .xls files are not accepted. Gray formula columns do not replace the importer’s independent calculation.<\/p>\n<p>Simultaneous use estimates peak coincident demand; it is not an hourly operating-time fraction. A main&#39;s diversity factor does not automatically reduce branch ratings. Verify equipment ratings, gas reference conditions, supply voltage/phase and exhaust type.<\/p>\n<h2>Analyze, transfer and save separately<\/h2>\n<p>Analysis does not change the main project. Select one supply group and UP/NP or a destination gas route, then use Preview transfer to main and confirm the before/after values. A main project can be created if none is open. Reimporting the same system/group/destination updates its source instead of adding again. Keep all equipment for one group in the same schedule rather than treating partial batches as separate sources.<\/p>\n<p>Electrical transfer supports only three-phase groups at the main line voltage. Other voltages and single-phase groups stay independent. P/Q, continuous-load allowances, the largest active branch-current floor and longest feeder run are retained. Socket counts describe connection points and cannot establish unknown socket kW. Electrical input is not transferred into room heat gain.<\/p>\n<p>PCW transfers flow and flow-weighted delta T. Where supply/return temperatures are absent, 25 C is only a pending placeholder; different service groups remain separate circuits. CDA/N2 transfer standard demand; compare main route pressure, temperature and velocity with imported requirements. Exhaust stays separated by type and terminal static pressure is not fan ESP. DI includes continuous circulation; reference quality is not measured quality. PV still needs pump/conductance data. Save the workspace to retain Demand ledger; an equipment-report export does not save the main workspace.<\/p>\n<h2>Percentage input<\/h2>\n<table>\n<thead>\n<tr>\n<th>Input<\/th>\n<th>Adopted simultaneous rate<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Number <code>50<\/code> or text <code>50%<\/code><\/td>\n<td>50%<\/td>\n<\/tr>\n<tr>\n<td>Excel percent cell stored as <code>0.5<\/code>, displayed as <code>50%<\/code><\/td>\n<td>50%, based on the active cell number format<\/td>\n<\/tr>\n<tr>\n<td>General-format number <code>0.5<\/code><\/td>\n<td>0.5%, without a magnitude guess<\/td>\n<\/tr>\n<tr>\n<td>Blank<\/td>\n<td>100% reference, disclosed in the detail<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Review the adopted rate, raw value and format after import. Formula, Boolean and error cells are rejected rather than silently becoming zero. Branches retain rated-load checks.<\/p>\n<p><a id=\"case-16\"><\/a><\/p>\n<h2>Case 16: three electrical equipment types<\/h2>\n<table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Quantity<\/th>\n<th>kW per unit<\/th>\n<th>Supply<\/th>\n<th>PF<\/th>\n<th>Simultaneous use<\/th>\n<th>Sockets per unit<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>E-01<\/td>\n<td>3<\/td>\n<td>10<\/td>\n<td>Three-phase 380 V<\/td>\n<td>0.85<\/td>\n<td>50%<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>E-02<\/td>\n<td>2<\/td>\n<td>5<\/td>\n<td>Three-phase 380 V<\/td>\n<td>0.85<\/td>\n<td>100%<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>E-03<\/td>\n<td>1<\/td>\n<td>3<\/td>\n<td>Single-phase 220 V<\/td>\n<td>1<\/td>\n<td>100%<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Use supply group UP-01, general load and 30 m one-way; retain remaining template assumptions.<\/p>\n<p>Three-phase connected load: 40 kW. Simultaneous demand: <code>3×10×0.5 + 2×5 = 25 kW<\/code>; 29.412 kVA, 44.687 A and seven sockets. The single-phase equipment is a separate group: 3 kW, 13.636 A, one socket. Matching group names do not merge different voltages/phases. Sockets are connection counts, not an additional power multiplier.<\/p>\n<p><a id=\"case-17\"><\/a><\/p>\n<h2>Case 17: six utility examples, quantity two and 50% simultaneous use<\/h2>\n<p>Enable the PCW, CDA, N2, EXHAUST, DI and PV template examples; set quantity two and simultaneous use 50%, retaining other example data. These are synthetic cases.<\/p>\n<table>\n<thead>\n<tr>\n<th>System<\/th>\n<th>Per-unit input<\/th>\n<th>Simultaneous result<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>PCW<\/td>\n<td>30 LPM, ΔT 5 K<\/td>\n<td>30 LPM, 10.467 kW<\/td>\n<\/tr>\n<tr>\n<td>CDA<\/td>\n<td>100 SLPM, 6 bar(g)<\/td>\n<td>100 SLPM, 14.448 ALPM<\/td>\n<\/tr>\n<tr>\n<td>N2<\/td>\n<td>50 SLPM, 5 bar(g)<\/td>\n<td>50 SLPM, 8.425 ALPM<\/td>\n<\/tr>\n<tr>\n<td>EXHAUST<\/td>\n<td>GEX 500 CMH, equipment-end 200 Pa<\/td>\n<td>500 CMH; 200 Pa is not full-route ESP<\/td>\n<\/tr>\n<tr>\n<td>DI<\/td>\n<td>Process 10 LPM plus continuous circulation 2 LPM<\/td>\n<td>Process 10 + circulation 4 = 14 LPM<\/td>\n<\/tr>\n<tr>\n<td>PV<\/td>\n<td>100 SLPM, 150 Torr(abs)<\/td>\n<td>100 SLPM, 506.667 ALPM<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>DI continuous circulation is not reduced by diversity. Water quality and supply/return routing require review; UPW/DI/RO quality defaults record specifications, not measured resistivity or production guarantees. PV needs separate pump and conductance selection.<\/p>\n<p>Utilities remain separated by supply group. Acid, alkaline, organic and general exhaust remain separated by type; aggregation does not permit mixing incompatible systems. Gas standard flows normalize to 25°C / 101.325 kPa(abs); group sizing uses the lowest entered absolute pressure, highest temperature and lowest velocity limit.<\/p>\n<p>Data: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/scenarios.json\">cases 16 and 17<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Parsing, grouping and inverse checks<\/a>.<\/p>\n"},{"id":"liquid","title":"Liquid piping and insulation","html":"<h2>Liquid / pure water<\/h2><ol><li>Select medium, material, flow, temperature and absolute pressure. The heating/cooling water shortcut transfers flow only; it does not approve material or replace property inputs.<\/li><li>Supported media use a property model. Chemicals, wastewater, mixed waste and custom liquids require operating density, specific heat, dynamic viscosity and a reference at the stated temperature and concentration. Viscosity is Pa.s, not cSt.<\/li><li>Use actual outside diameter and minimum wall for a known product. The diameter-series/SDR mode is a geometric estimate, not a commercial product or pressure rating.<\/li><li>The same page shows dimensions, flow, velocity and pressure loss, with warnings above project limits. View design reference opens the material source; exports retain the complete URL.<\/li><li>Reconfirm the property reference after changing medium or operating conditions. An upstream change invalidates adopted results. Recalculate upstream and explicitly reimport, or edit adopted flow to calculate independently.<\/li><\/ol><h3>Insulation<\/h3><p>Enter ambient temperature/humidity, conductivity, combined external coefficient, allowed heat flow and contract minimum thickness. Selection must satisfy heat-flow limits and cold-pipe condensation control. The water tool requires actual outside diameter when unknown, and clears it after changing automatic sizing conditions. Bore cannot replace outside diameter. Some conditions, including positive dew-point margin at 100%RH, have no feasible solution.<\/p><p>Materials are candidates only. Verify compatibility, pressure-temperature derating, seals and joints with vendor data. Solids, non-Newtonian waste and gravity drainage require separate design.<\/p>"},{"id":"vacuum","title":"PV vacuum calculator","html":"<h2>PV stays in the simple tools<\/h2><ol><li>Select PV vacuum calculator and enter standard flow with reference temperature and pressure.<\/li><li>Enter operating gas temperature and absolute pressure below local atmosphere. Unit changes preserve the physical quantity; gauge pressure or percent vacuum cannot replace absolute pressure.<\/li><li>Estimate bore by velocity or enter the actual bore; exceeding the project velocity limit produces a warning.<\/li><li>Enter length and vendor pumping speed at operating pressure. Conductance and effective speed are calculated only for the stated long-round-air-tube molecular-flow conditions. Viscous and transition flow do not receive an invented effective speed.<\/li><\/ol><p>Review fittings, actual gas, pump curves and pressure profiles separately. An insufficient effective speed is warned. Use the single Unit conversion page for conversions.<\/p>"},{"id":"cleanroom","title":"Cleanroom ACH, MAU and relief","html":"<h2>Cleanroom conditions and coil checks<\/h2><p>Cleanroom airflow includes room temperature/humidity, summer outdoor conditions, room moisture generation and coil conditions. The MAU shortcut creates a standalone staged-coil case for further feasibility checks.<\/p><p>New cases use total FFU supply ACH, including MAU air entering the plenum. For 100 m² x 3 m at 60 ACH and MAU 3000 CMH: FFU supply is 18000 CMH, DCC return is 15000 CMH, and 18 units at 1000 CMH each are required. Only the explicit return-plus-outdoor-air basis adds MAU flow.<\/p><p>With zero exhaust and 300 CMH pressure leakage, a further 2700 CMH relief/discharge path is required. The report states this flow; excess outdoor air cannot disappear, and ACH alone cannot establish cleanroom class.<\/p><p>Use the corresponding tools for design. AHU model comparison evaluates numerical differences and does not replace coil feasibility and engineering quality checks.<\/p>"},{"id":"design_review","title":"Design basis and document review","html":"<h2>Design basis and document review<\/h2><p>Create a separate project, enter the design basis and list each standard as Name｜Edition｜Clause｜Scope｜Source. Attach documents and record independent human review. Changed inputs or evidence invalidate prior reviews. Export saves a corresponding immutable revision. Attach an updated report whenever its original calculation changes. Move the entire project folder, including evidence. Document readiness is not certification; reviewer identities are manually recorded, not authenticated.<\/p>"},{"id":"pump_suction","title":"Pump suction check","html":"<h2>Pump suction check<\/h2><p>Enable the suction check on the liquid page. Enter vessel-surface absolute pressure, minimum level relative to pump datum and complete suction losses. The suction pipe uses the displayed diameter and flow; discharge losses are not reused. Mixtures need a sourced bubble-point pressure. Compare NPSHa with the actual manufacturer NPSHr plus a sourced project margin. Missing inputs or flashing do not pass. Changed conditions invalidate losses and curve references. Scope excludes transients, entrained gas and minimum submergence.<\/p>"},{"id":"capacity","title":"Optional: capacity / expansion planning","html":"<h2>Optional: capacity / expansion planning<\/h2>\n<p>In the full workbench, select Capacity / expansion planning. The separate Capacity / expansion / alternatives window screens ELECTRIC (kW), CHW/PCW (LPM) and EXHAUST (CMH). It is an independent plan, not an automatic appendix to the main workspace.<\/p>\n<ol><li>Enter plan name, complete service scope, additional margin and its basis. Leave unknown data blank; enter 0 only for confirmed zero demand.<\/li><li>On Existing / expansion demand, choose a system and Add row. Enter row ID, physical asset/source ID, service boundary, quantity and summer/winter per-unit values. Use current for existing loads and expansion for additions. Apply coincidence only if not already included in the per-unit value. Source-included margin is recorded, not multiplied again.<\/li><li>On Conditions and source, enter the relevant electrical voltage/phases/frequency, fluid/supply/return/properties, or exhaust type/temperature/absolute pressure/static pressure. Add document and revision references. Preserve unresolved tasks in Pending and notes. Confirm complete demand only after checking that it is more than a known subtotal.<\/li><li>On Supply capacity, add same-boundary, same-condition per-unit ratings, quantity and derating. Different panels, circuits, exhaust types or conditions remain separate and cannot offset a deficit. Do not duplicate a physical asset under different row IDs.<\/li><li>Without alternatives, all rows are evaluated. To compare alternatives, select the full demand and supply rows on both tabs, then use Save the selected rows from both tabs as an alternative. Include every current/expansion demand for that alternative. Alternatives are compared, not added.<\/li><li>Confirm scope, complete register and N−1 assumptions only after review, then Recalculate. Check normal and N−1 capacity, headroom, deficits and pending data separately. A numerical result is not a pass.<\/li><li>Save plan as stores an independent JSON reopened from this window; Export report saves TXT. <strong>Save workspace does not save this capacity plan<\/strong>, and a capacity JSON is not a main-workspace JSON.<\/li><\/ol>\n<h3>Starting from the demand ledger<\/h3><p>Capture from demand summary creates a source snapshot, not a complete facility register or supply-capacity list. Save the current plan before replacing it by a capture. Resolve source tasks and conditions, then add complete demands and supplies. Main/source edits or switching projects can make the capture stale. Recapture and review; recalculation alone cannot refresh an old source snapshot. Manually edited captured values also need updated source documents/revisions.<\/p>\n<p><strong>Capacity export rechecks inputs but can export a report marked data/review required.<\/strong> Stale sources, missing values and incomplete confirmation do not become adequate capacity. Unlike invalid direct-lighting results, such reports are not all blocked from export; read their status.<\/p>\n<h3>Synthetic arithmetic example<\/h3><p>For one panel and identical conditions: existing 100 kW + expansion 60 kW, coincidence 1 each, plus 10% additional margin gives demand 176 kW. Three 100 kW units, each derated to 0.9, provide 270 kW normally. N−1 removes the largest single derated unit (90 kW), leaving 180 kW. Headroom is 94/4 kW. Sum each summer/winter case before comparing peaks; do not add individual peaks from different seasons.<\/p>\n<p>N−1 only removes the largest single derated unit and assumes the others can supply simultaneously. It does not verify common-cause failure, changeover, electrical kVA/starting/short-circuit/protection, full hydraulic head or fan curves. Screening capacity adequate is not complete FEED or engineering approval. Never clear unresolved tasks merely to obtain a pass.<\/p>\n"}]},"labels":{"zh-Hant":{"title":"Facility Studio 新手教學","subtitle":"先完成前六步；其餘依需求再學。","next":"下一步","previous":"上一步","mark":"我已閱讀此步（手動記錄，非軟體驗收）","print":"列印教學","all":"閱讀全文","guided":"逐步跟做","reset":"重設勾選進度","progress":"前六步閱讀進度","files":"練習檔案","offline":"離線版｜V5.7.3 | Windows / macOS","signature":"DESIGNED BY ANDY HUANG ©","n":6},"en":{"title":"Facility Studio beginner tutorial","subtitle":"Finish the first six steps; learn the rest when needed.","next":"Next step","previous":"Previous","mark":"I have read this step (manual record, not software verification)","print":"Print tutorial","all":"Read all","guided":"Guided steps","reset":"Reset checkmarks","progress":"Required reading progress","files":"Practice files","offline":"Offline | V5.7.3 | Windows / macOS","signature":"DESIGNED BY ANDY HUANG ©","n":6}}}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('tutorial-data').textContent);
const ids=data.content['zh-Hant'].map(s=>s.id);const required=ids.slice(0,6);const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem('facility-tutorial-v556-r1')||'{}')||{};}catch(e){}
const requestedLanguage=new URLSearchParams(location.search).get('language');
let lang=Object.prototype.hasOwnProperty.call(data.content,requestedLanguage)?requestedLanguage:Object.prototype.hasOwnProperty.call(data.content,saved.lang)?saved.lang:'zh-Hant';let step=Math.max(0,ids.indexOf(location.hash.slice(1)));let all=false;
const done=new Set(Array.isArray(saved.done)?saved.done.filter(x=>ids.includes(x)):[]);
function persist(){try{localStorage.setItem('facility-tutorial-v556-r1',JSON.stringify({lang,done:[...done]}));}catch(e){}}
function render(){const labels=data.labels[lang];document.documentElement.lang=lang;document.title=labels.title;$('title').textContent=labels.title;$('subtitle').textContent=labels.subtitle;$('offline').textContent=labels.offline;$('language').value=lang;$('all').textContent=all?labels.guided:labels.all;$('print').textContent=labels.print;$('files-label').textContent=labels.files;$('reset').textContent=labels.reset;$('previous').textContent=labels.previous;$('next').textContent=labels.next;$('mark').textContent=labels.mark+'：'+data.content[lang][step].title;$('done').disabled=all;$('previous').disabled=step===0;$('next').disabled=step===ids.length-1;$('done').checked=done.has(ids[step]);const completed=required.filter(id=>done.has(id)).length;$('progress-label').textContent=labels.progress+' '+completed+' / 6';$('progress').value=completed;document.body.classList.toggle('all-mode',all);$('nav').replaceChildren();$('sheet').replaceChildren();data.content[lang].forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=(done.has(s.id)?'✓ ':'')+(i>=6&&i<10?(lang==='en'?'Optional: ':'選讀：'):'')+s.title;b.classList.toggle('active',i===step);if(i===step)b.setAttribute('aria-current','step');b.onclick=()=>go(i);$('nav').append(b);const section=document.createElement('section');section.id=s.id;section.hidden=!all&&i!==step;section.innerHTML=s.html;$('sheet').append(section);});}
function go(i){step=Math.max(0,Math.min(ids.length-1,i));try{history.replaceState(null,'','#'+ids[step]);}catch(e){location.hash=ids[step];}render();if(all)$(ids[step]).scrollIntoView({block:'start',behavior:'smooth'});else $('main').scrollIntoView({block:'start',behavior:'smooth'});}
$('language').onchange=()=>{lang=$('language').value;persist();render();};$('all').onclick=()=>{all=!all;render();};$('print').onclick=()=>window.print();$('previous').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);$('done').onchange=()=>{if(all)return;if($('done').checked)done.add(ids[step]);else done.delete(ids[step]);persist();render();};$('reset').onclick=()=>{done.clear();persist();render();};window.onhashchange=()=>{const i=ids.indexOf(location.hash.slice(1));if(i>=0){step=i;render();}};document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&ids.includes(a.getAttribute('href').slice(1))){e.preventDefault();go(ids.indexOf(a.getAttribute('href').slice(1)));}});render();
</script></body></html>
