<script type="application/json" id="tutorial-data">{"content": {"zh-Hant": [{"id": "start", "title": "1. 先選對入口", "html": "<h2>1. 先選對入口<\/h2><div class=\"table-scroll\"><table><thead><tr><th>您今天要做什麼<\/th><th>使用入口<\/th><th>需要完整工作台嗎？<\/th><\/tr><\/thead><tbody><tr><td>只算 kW → 電流／NFB／線徑<\/td><td>主畫面「電力配線」<\/td><td>不需要<\/td><\/tr><tr><td>只算風管、CDA、照度、水量或空氣狀態<\/td><td>對應的簡易工具<\/td><td>不需要<\/td><\/tr><tr><td>整理整個空間的空調、熱負荷、廠務及報告<\/td><td>「完整工程工作台」<\/td><td>需要，從本教學第 3 節開始<\/td><\/tr><tr><td>比較單台箱的預熱、預冷、加濕、再冷、再熱<\/td><td>工作台上方「空調箱管理」<\/td><td>看第 8 節<\/td><\/tr><tr><td>整批設備 Excel／CSV 彙總<\/td><td>「設備表匯入」<\/td><td>可獨立使用；分析結果不會默默填入主案<\/td><\/tr><\/tbody><\/table><\/div><p><strong>第一次不要從空白案件填完所有分頁。<\/strong> 先開練習案、只改一個條件、觀察結果，再換成自己的現場資料。<\/p><p>離線包解壓縮後，雙擊 <code>START_HERE.html<\/code>：用一般瀏覽器閱讀，可切換中英文、逐步跟做、勾選進度或列印。教學及練習不需要 Python，也不需要連網；GitHub 外部連結需要網路。程式內的「新手教學」按鈕從 <strong>win.2／mac.2 修訂<\/strong>起提供，較早的 V5.5.5 請直接開啟離線 HTML。<\/p>"}, {"id": "interface", "title": "2. 工作台只要先認識四個位置", "html": "<h2>2. 工作台只要先認識四個位置<\/h2><p><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1100\" height=\"650\" viewBox=\"0 0 1100 650\" role=\"img\" aria-labelledby=\"map-title map-desc\"><title id=\"map-title\">完整工程工作台：先認識操作位置<\/title><desc id=\"map-desc\">Control-location diagram based on V5.5.5 source; not a screenshot.<\/desc><rect width=\"1100\" height=\"650\" rx=\"16\" fill=\"#eef3f7\"/><g font-family=\"system-ui, sans-serif\"><text x=\"30\" y=\"43\" font-size=\"24\" font-weight=\"700\" fill=\"#18334d\">完整工程工作台：先認識操作位置<\/text><rect x=\"24\" y=\"70\" width=\"249\" height=\"546\" rx=\"10\" fill=\"#11253b\"/><text x=\"42\" y=\"101\" font-size=\"17\" fill=\"#6edac7\" font-weight=\"700\">FACILITY STUDIO<\/text><rect x=\"36\" y=\"116\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"139\" font-size=\"16\" fill=\"#d7e5f4\">01  總覽與空氣線圖<\/text><rect x=\"36\" y=\"156\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"179\" font-size=\"16\" fill=\"#d7e5f4\">02  空調與空間<\/text><rect x=\"36\" y=\"196\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"219\" font-size=\"16\" fill=\"#d7e5f4\">03  熱負荷與照明<\/text><text x=\"45\" y=\"259\" font-size=\"16\" fill=\"#d7e5f4\">04  特氣與真空<\/text><text x=\"45\" y=\"299\" font-size=\"16\" fill=\"#d7e5f4\">05  動力配電<\/text><text x=\"45\" y=\"339\" font-size=\"16\" fill=\"#d7e5f4\">06  排氣風管<\/text><text x=\"45\" y=\"379\" font-size=\"16\" fill=\"#d7e5f4\">07  水系統與純水<\/text><text x=\"45\" y=\"419\" font-size=\"16\" fill=\"#d7e5f4\">08  壓損矩陣<\/text><rect x=\"36\" y=\"436\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"459\" font-size=\"16\" fill=\"#d7e5f4\">09  設計報告<\/text><text x=\"43\" y=\"574\" font-size=\"14\" fill=\"#829aaf\">DESIGNED BY<\/text><text x=\"43\" y=\"595\" font-size=\"14\" fill=\"#829aaf\">ANDY HUANG ©<\/text><rect x=\"291\" y=\"70\" width=\"785\" height=\"130\" rx=\"10\" fill=\"white\"/><text x=\"313\" y=\"107\" font-size=\"20\" font-weight=\"700\" fill=\"#126d80\">① 開啟  ｜  儲存整案  ｜  基本模式<\/text><text x=\"313\" y=\"150\" font-size=\"18\" fill=\"#536b7d\">空調箱管理  ｜  匯出可列印摘要  ｜  新手教學（r2）<\/text><rect x=\"291\" y=\"217\" width=\"785\" height=\"322\" rx=\"10\" fill=\"white\"/><text x=\"313\" y=\"254\" font-size=\"20\" font-weight=\"700\" fill=\"#18334d\">③ 填寫條件：往下捲動可看到其餘欄位<\/text><text x=\"323\" y=\"311\" font-size=\"17\" fill=\"#526d80\">夏季外氣<\/text><rect x=\"550\" y=\"290\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"313\" font-size=\"17\" fill=\"#17324a\">35°C / 70% RH<\/text><text x=\"323\" y=\"363\" font-size=\"17\" fill=\"#526d80\">室內目標<\/text><rect x=\"550\" y=\"342\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"365\" font-size=\"17\" fill=\"#17324a\">22°C / 50% RH<\/text><text x=\"323\" y=\"415\" font-size=\"17\" fill=\"#526d80\">A 區長寬高<\/text><rect x=\"550\" y=\"394\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"417\" font-size=\"17\" fill=\"#17324a\">12 × 8 × 3 m<\/text><text x=\"323\" y=\"467\" font-size=\"17\" fill=\"#526d80\">同時在室人數<\/text><rect x=\"550\" y=\"446\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"469\" font-size=\"17\" fill=\"#17324a\">8<\/text><rect x=\"1052\" y=\"273\" width=\"7\" height=\"240\" rx=\"4\" fill=\"#e5edf3\"/><rect x=\"1052\" y=\"290\" width=\"7\" height=\"87\" rx=\"4\" fill=\"#9fb3c3\"/><rect x=\"291\" y=\"556\" width=\"785\" height=\"60\" rx=\"10\" fill=\"#e0efee\"/><text x=\"313\" y=\"594\" font-size=\"20\" font-weight=\"700\" fill=\"#126d80\">④ 重新計算  →  定位問題  →  匯出設計報告<\/text><\/g><\/svg><\/p><p>這是按實際控制項整理的<strong>位置示意圖，非 GUI 截圖<\/strong>。<\/p><div class=\"table-scroll\"><table><thead><tr><th>位置<\/th><th>先學這些按鈕<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>上方<\/td><td>開啟、儲存整案、基本模式<\/td><td>開練習案，保留主案及單機資料；初學先用基本模式<\/td><\/tr><tr><td>左側<\/td><td>01、02、03、09<\/td><td>共同氣候 → 空調與空間 → 熱負荷 → 報告<\/td><\/tr><tr><td>中間<\/td><td>欄位及其說明、頁面捲軸<\/td><td>短頁面向下捲，不必一次看到所有欄位<\/td><\/tr><tr><td>下方<\/td><td>重新計算、定位問題、匯出設計報告<\/td><td>先重算，遇問題用定位，再輸出目前結果<\/td><\/tr><\/tbody><\/table><\/div><p><strong>基本模式是把較少用的欄位收起來，仍採用已保存的有效設定。<\/strong> 灰色或隱藏欄位不等於資料消失；模式停用的欄位保留草稿，但不參與該模式的計算。進階模式可以檢查採用值。「套用本頁初估係數」會變更本頁參考值；做跟練時先不用，誤按可用「復原帶入」。<\/p>"}, {"id": "first-case", "title": "3. 開啟第一個練習案", "html": "<h2>3. 開啟第一個練習案<\/h2><ol><li>本頁已離線開啟；練習 JSON 與本頁放在同一資料夾。可用左側「練習檔案」連結另存，或在檔案總管／Finder 找到本頁資料夾，複製 JSON 到桌面。若使用 ZIP，請先完整解壓縮。<\/li><li><strong>複製<\/strong> <code>01_Practice_AHU.json<\/code> 到桌面，改名 <code>My_First_Project.json<\/code>，保留原範例方便重來。<\/li><li>開啟 Facility Studio →「完整工程工作台」→ 上方「開啟」。<\/li><li>選擇剛剛複製的 <code>My_First_Project.json<\/code>。若現有案件未保存，先保存再切換。<\/li><li>上方選「基本模式」，按下方「重新計算」，或按 F5。<\/li><\/ol><p>本例是 <strong>12 × 8 × 3 m 的一般作業區，8 人，AHU 外氣／回風混合<\/strong>。不是無塵室認證案例，也不是任何產品的選型書。其他無需求的氣體、PV、排氣、PCW、純水設為 0；已有設備與冰水等初估資料供練習。<\/p><p><strong>跟練成功的狀態是「結果與報告已同步」，品質標示仍為「待補資料」。<\/strong> 本例故意保留原廠性能、設備阻力及配電覆核待補，不應把它改成假資料只為取得通過。<\/p>"}, {"id": "inputs", "title": "4. 自己的案件先填這五組資料", "html": "<h2>4. 自己的案件先填這五組資料<\/h2><div class=\"table-scroll\"><table><thead><tr><th>頁面／欄位<\/th><th>本例輸入<\/th><th>您自己的案子如何填<\/th><\/tr><\/thead><tbody><tr><td>01 共同氣候：夏季外氣／室內目標<\/td><td>35°C、70%RH／22°C、50%RH<\/td><td>採實際設計氣候與室內需求；冬季例為 8°C、70%RH<\/td><\/tr><tr><td>02 空調與空間：空調系統／A 區長寬高／人數<\/td><td>AHU (OA+RA 混合)／12、8、3 m／8 人<\/td><td>選真實架構，尺寸用 m；不用 B 區就保留長寬及人數為 0<\/td><\/tr><tr><td>02 風量計算模式／換氣次數／指定外氣<\/td><td>ACH／6 次/h／0 自動<\/td><td>ACH 是循環需求，<strong>不是全部新鮮外氣<\/strong>；6 是本例練習值，不是通用規定<\/td><\/tr><tr><td>03 設備發熱／運轉率／製程水氣<\/td><td>5 kW／100%／沒有額外產濕<\/td><td>設備熱用同一範圍的入室熱收支；不知道產濕就選「尚不清楚」，不當作已確認沒有<\/td><\/tr><tr><td>03 照度與燈具／外牆及樓板<\/td><td>500 Lux、4000 lm/盞、40 W/盞／60、96 m²<\/td><td>Lux 是目標，lm 是單燈光通量；面積用 m²，不填 m³<\/td><\/tr><\/tbody><\/table><\/div><p>在 01 頁按「編輯共同氣候」會捲到溫濕度欄位。這些欄位放在總覽圖下方；不是只有圖而沒有設定。照明利用係數 0.6、維護係數 0.8、人員顯／潛熱 75／55 W 是本例的初估值。樓板鄰側夏季溫度在本例採 22°C，與室內相同，所以樓板夏季傳熱為 0；這個進階條件也會影響結果。<\/p><p><strong>動手一次：<\/strong>只把 A 區人數 8 改成 12，再重算。人員顯熱應增加 <strong>0.300 kW<\/strong>，人員潛熱增加 <strong>0.220 kW<\/strong>。觀察後改回 8，重算再繼續。每次改一項，最容易理解連動。<\/p>"}, {"id": "results", "title": "5. 結果只先看這張表", "html": "<h2>5. 結果只先看這張表<\/h2><p>回到原練習資料重算後，在 01 摘要、03 計算摘要及 09 報告核對：<\/p><div class=\"table-scroll\"><table><thead><tr><th>項目<\/th><th>本例應得結果<\/th><th>怎麼理解<\/th><\/tr><\/thead><tbody><tr><td>面積／體積<\/td><td>96 m²／288 m³<\/td><td>12 × 8；面積 × 3 m<\/td><\/tr><tr><td>照明<\/td><td>25 盞／1.000 kW<\/td><td>每盞 4000 lm、40 W；盞數向上取整<\/td><\/tr><tr><td>室內顯熱<\/td><td>7.870 kW<\/td><td>設備 5 + 人員 0.6 + 照明 1 + 外牆 1.270；其他本例為 0<\/td><\/tr><tr><td>室內潛熱／產濕<\/td><td>0.440 kW／0.633 kg/h<\/td><td>8 人 × 55 W；本例沒有額外製程產濕<\/td><\/tr><tr><td>最低補償外氣<\/td><td>192.0 CMH，室內基準<\/td><td>本例由 8 人 × 24 CMH/人決定，不是通用通風法規<\/td><\/tr><tr><td>循環需求／實際處理風量<\/td><td>1728.0／2400.2 CMH，室內基準<\/td><td>288 × 6 是循環下限；熱濕平衡需要更高風量<\/td><\/tr><tr><td>CHW 連動水量<\/td><td>41.115 LPM<\/td><td>水側冷量含 10% 餘裕，ΔT=5 K；不是原手填 400 LPM<\/td><\/tr><tr><td>UP 盤初估<\/td><td>8.937 A；NFB 候選 15 AT；每相 3.5 mm² × 1 組<\/td><td>本例另外填了 5 kW 電力、380 V、PF0.85；仍待配電覆核<\/td><\/tr><\/tbody><\/table><\/div><p>公式只先記三個：<code>面積=長×寬<\/code>；<code>循環CMH=體積×ACH<\/code>；<code>燈數=向上取整(目標Lux×面積÷(單燈lm×利用係數×維護係數))<\/code>。完整報告會列熱濕守恆及管路公式。<\/p><p>總覽圖下拉「流程圖季節」可選夏季／冬季。橫軸乾球 °C、縱軸含濕比 g/kg乾空氣；OA 外氣、RA 室內、IN 入口、C1／C2 盤管、HT 加熱、SA 送風。圖上的點是<strong>需求或指定狀態<\/strong>，不代表尚未選型的實體設備已能達到。某段旁通時點會重疊；它不是圖點遺漏。<\/p>"}, {"id": "export", "title": "6. 保存與匯出，完成第一輪", "html": "<h2>6. 保存與匯出，完成第一輪<\/h2><ol><li>按「儲存整案」保存目前 <code>My_First_Project.json<\/code>。<strong>開啟過的案件會存回同一個檔案<\/strong>；想另做一案，先在檔案總管／Finder 複製改名再開啟。<\/li><li>點左側 <strong>09 設計報告<\/strong>，先看設計條件、結果、待補事項及公式。<\/li><li>下方「匯出設計報告」輸出 <strong>TXT<\/strong>，適合傳送文字結果。<\/li><li>上方「匯出可列印摘要」輸出 <strong>HTML<\/strong>；以瀏覽器開啟，再按列印，可選「另存 PDF」。<\/li><li>如需數值追溯，09 的「另存完整驗算資料 JSON」另存計算結果。<strong>它不是可重新開啟的整案 JSON<\/strong>。<\/li><\/ol><div class=\"table-scroll\"><table><thead><tr><th>檔案<\/th><th>用途<\/th><th>可以用工作台「開啟」嗎？<\/th><\/tr><\/thead><tbody><tr><td>儲存整案的 <code>.json<\/code><\/td><td>主案、所有空調箱、A/B、參數來源與回傳記錄<\/td><td>可以<\/td><\/tr><tr><td>匯出的 TXT／HTML／PDF<\/td><td>閱讀、列印、分享結果<\/td><td>不可以<\/td><\/tr><tr><td>完整驗算資料 JSON<\/td><td>檢查數值與計算依據<\/td><td>不作為整案開啟<\/td><\/tr><tr><td>另存單機 JSON<\/td><td>單台空調箱資料<\/td><td>在單機視窗「開啟」，不是主案入口<\/td><\/tr><\/tbody><\/table><\/div><p><strong>到這裡就完成第一份練習報告。<\/strong> 先熟悉這條路徑；需要其他廠務系統再往下學。<\/p>"}, {"id": "utilities", "title": "7. 其他分頁，需要時才填", "html": "<h2>7. 其他分頁，需要時才填<\/h2><div class=\"table-scroll\"><table><thead><tr><th>左側頁面<\/th><th>何時用<\/th><th>最少先確認<\/th><\/tr><\/thead><tbody><tr><td>04 特氣與真空<\/td><td>有 CDA、N2 等氣體或 PV<\/td><td><strong>流量<\/strong>、最低管內壓力、單位；進階可逐路改壓力和風速<\/td><\/tr><tr><td>05 動力配電<\/td><td>要估 UP／NP 盤需求<\/td><td>電氣輸入 kW、三相線電壓、負載類型；電力與設備熱是不同資料<\/td><\/tr><tr><td>06 排氣風管<\/td><td>有一般、酸、鹼、有機或熱排<\/td><td>各路 CMH；初估流速／餘裕可先沿用，之後依實際材質與需求核對<\/td><\/tr><tr><td>07 水系統與純水<\/td><td>要估冷熱水或純水主管<\/td><td>選水量來源、ΔT；純水填循環 LPM 和流速限制<\/td><\/tr><tr><td>08 壓損矩陣<\/td><td>已有最不利路徑，要估壓差<\/td><td>選有流量的系統、路徑長、管件餘裕及設備壓差是否已知<\/td><\/tr><\/tbody><\/table><\/div><p>沒有需求的氣體、PV、排氣、PCW、純水，在本例保留 0 即可；<strong>CHW 等服務正在運轉的空調水路仍由負荷連動計算<\/strong>，不能為了隱藏頁面而隨意歸零。<\/p><p><strong>潛熱：<\/strong>它是進入室內的水氣造成的除濕需求，跟機台散熱不是同一件事。人員會自動算；若開放水槽每小時蒸發 1 kg 進室內，選「已知產濕量 kg/h」填 1，就增加 <code>1×2501÷3600 = 0.695 kW<\/code> 的製程潛熱。若已知的是 1 kW 潛熱就選「已知潛熱 kW」。只採所選的一種，不兩種都加；外氣水氣另在盤管算，不再填成室內製程水氣。未知用「尚不清楚」保留待補。<\/p><p><strong>水量連動：<\/strong>「連動負荷」用 <code>LPM=60000×kW÷(ρ×cp×ΔT)<\/code> 自動算，手填欄位不採用。要使用量測的 100 LPM，先選「獨立輸入」才填 100；模型會比較這個水量的冷熱容量與需求。上游 PCW 機台熱移除和主管流量來源也要一致。<\/p><p><strong>簡易壓損：<\/strong>選 CHW → 路徑長 30 m → 一般初估 30% → 尚無設備資料。30 m 在水側是供、回直管加總；<strong>閉式循環不把樓層高度直接當泵靜揚程<\/strong>。設備壓差未知時只報管路小計，不能把它當完整選泵揚程。10／30／50%是方案餘裕，不是管件標準。風管壓差顯示 Pa／mmAq、水側可顯示 kPa／水頭，勿直接把不同單位的數字相加。<\/p><p><strong>CDA／PV：<\/strong>只填壓力及流速不能求唯一管徑，還需要流量。氣體預設用共用的<strong>最低表壓<\/strong>定寸，與供氣表壓不同；PV 的 Torr／kPa(abs)／mbar(abs) 都是絕壓，切換會換算數值。純水電阻率是 25°C 參考目標，不是量測證明。<\/p>"}, {"id": "ahu", "title": "8. 空調箱管理：先用第二份練習案", "html": "<h2>8. 空調箱管理：先用第二份練習案<\/h2><p>第二案 <code>02_Practice_MAU_and_AHU.json<\/code> 已包含一個主案及 <strong>Tutorial MAU-01<\/strong> 單機，讓您不必從預設的 58,000 CMH 大箱開始。此案是全外氣 MAU＋FFU＋DCC 的教學模型，同樣 96 m²，循環需求採 20 ACH；供風及單機送風狀態約 358.3 CMH，室內基準約 359.2 CMH。兩個數字因狀態／比容基準不同而稍異。<\/p><ol><li>先保存第一案。複製第二案並改名後，從主工作台「開啟」。<\/li><li>主案按「重新計算」，再按上方「空調箱管理」。<\/li><li>選 <strong>Tutorial MAU-01<\/strong> →「開啟選取單機」，不要先新增一台大預設箱。<\/li><li>在「1 設計條件」先看風量、夏冬外氣與目標、H1／H2 熱源、C1／C2 供回水及候選容量、加濕設備。<\/li><li>本例各段先採「自動需求」，H1／H2 各配置 8 kW 電熱，C1／C2 各 3 US RT，濕膜只在需要加濕時運轉。<strong>這些是合成練習配置<\/strong>；原廠曲線、阻力及濕膜資料仍待補。<\/li><li>按「重算」，在結果頁切夏季／冬季，對照每段入口、出口、需求與容量檢核；需求點不是設備不足時的實際出風模擬。<\/li><\/ol><div class=\"table-scroll\"><table><thead><tr><th>段落<\/th><th>作用<\/th><th>初學先怎麼設定<\/th><\/tr><\/thead><tbody><tr><td>H1 預熱<\/td><td>外氣先加熱，可能是後續水洗加濕所需<\/td><td>自動需求；電熱、回收熱水、並用或停用按實際配置<\/td><\/tr><tr><td>C1 預冷<\/td><td>第一段冷卻<\/td><td>自動需求；核供回水及候選 RT<\/td><\/tr><tr><td>加濕<\/td><td>濕膜蒸發冷卻或蒸汽加濕<\/td><td>選真實設備；濕膜和蒸汽的水分／能量不相同<\/td><\/tr><tr><td>C2 再冷<\/td><td>深冷、除濕或再冷卻<\/td><td>自動需求；水溫需能達到目標含濕量<\/td><\/tr><tr><td>H2 再熱<\/td><td>調整最終送風乾球<\/td><td>自動需求；核本段已配置容量，不挪用 H1 的容量<\/td><\/tr><\/tbody><\/table><\/div><p>要指定每段出口，先勾「顯示進階／廠商資料」，分別設定夏季、冬季該段的「指定出口乾球」；冷卻段另可選「指定出口 T/RH」。<strong>入口由上一段連動，不能當作每一段都重新從外氣開始<\/strong>。不用段落選旁通，不是任意填 0°C。<\/p><p><strong>主案 → 單機：<\/strong>按「帶入主案分季送風需求」，看提示再確認。此功能目前<strong>只支援全外氣 MAU 主案<\/strong>；第一案混風 AHU 不能直接帶入這個全外氣單機模型。帶入會更新分季入口、送風需求及冰水供回水；既有逐段指定值與額定容量保留，需重算核對。改主案後，舊連動快照會過期，需再帶入。<\/p><p><strong>單機 → 主案：<\/strong>按「預覽回傳水量／額定電力」，先看改前／改後再確認。本例預覽 MCHW <strong>12.443 LPM<\/strong>、CHW <strong>12.348 LPM<\/strong>、NP 風機 <strong>0.370 kW<\/strong>、加熱 <strong>16.000 kW<\/strong>、已確認水洗泵 <strong>0.100 kW<\/strong>。加熱 16 kW 是兩台已配置電熱器額定合計，<strong>不是同一工況的加熱需求<\/strong>。<\/p><p>回傳會<strong>取代列出的欄位，不累加多台箱<\/strong>；未知水洗泵及未採用熱水等項目可能保持主案原值，須看預覽註記。多台箱或其他設備要另做範圍彙整，不能連按回傳當作加總。回傳也不代表容量已獲原廠認證。<\/p><p>關閉單機視窗不會刪掉這台箱；回主案按「儲存整案」一起保存。單機「另存單機」是另外的單機檔案。<a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/ahu.md\">更完整的分段公式與大型容量不足案例<\/a>適合下一階段閱讀。<\/p>"}, {"id": "recovery", "title": "9. 紀錄來源、比較方案與復原", "html": "<h2>9. 紀錄來源、比較方案與復原<\/h2><p>上方「來源／比較／復原」有三個分頁：<\/p><div class=\"table-scroll\"><table><thead><tr><th>分頁<\/th><th>用法<\/th><\/tr><\/thead><tbody><tr><td>參數來源<\/td><td>記錄初估、量測或原廠文件；原廠資料留下型錄／選型編號<\/td><\/tr><tr><td>方案 A／B<\/td><td>重算後固定目前案為 A；修改一項再重算、固定為 B，再比較。固定快照不會隨後續修改自動覆寫<\/td><\/tr><tr><td>備份與計算依據<\/td><td>查看備份／復原；自動復原約每 30 秒保存，不能替代主動「儲存整案」<\/td><\/tr><\/tbody><\/table><\/div><p>再存同一檔時會保留 <code>.json.bak<\/code> 備份。另存的計算結果不是專案備份。不要只留 TXT 就關閉而未保存整案。無效輸入可保存成草稿，但不因此變成可用報告。<\/p>"}, {"id": "faq", "title": "10. 卡住時看這裡", "html": "<h2>10. 卡住時看這裡<\/h2><div class=\"table-scroll\"><table><thead><tr><th>遇到什麼<\/th><th>下一個動作<\/th><\/tr><\/thead><tbody><tr><td>找不到共同溫濕度<\/td><td>01 按「編輯共同氣候」，或往圖下方捲動<\/td><\/tr><tr><td>欄位突然不見或不能填<\/td><td>看基本／進階及控制模式；選項停用的欄位收起，不是刪掉；確認後再切進階<\/td><\/tr><tr><td>改了數值，舊圖／結果消失<\/td><td>這是避免顯示過期結果；完成輸入，按「重新計算」<\/td><\/tr><tr><td>紅框、不能匯出<\/td><td>按「定位問題」，修正指定欄位及單位，再重算；不要沿用舊報告<\/td><\/tr><tr><td>顯示「待補資料」<\/td><td>看報告缺哪份資料；可以做初估，不能當正式選型通過<\/td><\/tr><tr><td>顯示「未達條件」<\/td><td>看容量、換熱溫差或水量等具體原因；不要只放大安全係數<\/td><\/tr><tr><td>製程產濕不知道<\/td><td>選「尚不清楚（暫不計製程）」，保留待補；不要先猜一個大 kW<\/td><\/tr><tr><td>PCW 熱移除超過設備總熱<\/td><td>同一運轉範圍重新核對台數、水量、ΔT、開機率及排氣比例，避免重複扣熱<\/td><\/tr><tr><td>水量改了卻沒變<\/td><td>「連動負荷」不採手填量；要用量測值先選「獨立輸入」<\/td><\/tr><tr><td>AHU 主案不能帶入單機<\/td><td>混風 AHU 不支援全外氣單機連動；先用第二案練 MAU，實案勿任意改架構來繞過<\/td><\/tr><tr><td>回傳說來源已過期<\/td><td>先重新帶入目前主案需求；只有刻意獨立設計時才解除連動<\/td><\/tr><tr><td>想只算一個系統<\/td><td>回主畫面用簡易工具，無須填全廠<\/td><\/tr><\/tbody><\/table><\/div><p>練習核對：兩平台原始碼各以 <strong>20 個操作相關條件<\/strong>重算，含熱濕守恆、單位、水量來源、壓損範圍、MAU 連動及容量不足。<a href=\"https://github.com/azx4121/facility-studio/tree/main/docs/tutorial\">輸入、檢查腳本與驗證紀錄<\/a>可重現。教學位置按程式控制項核對；新增教學入口與署名的原生驗收狀態另見發布紀錄，不把數值測試稱為人工點擊全部 UI。<\/p><p>仍有問題時，到 <a href=\"https://github.com/azx4121/facility-studio/issues\">Issues<\/a> 提供版本、平台、頁面、步驟與合成測試專案。正式設備選型及保護設計仍須現場條件與原廠資料覆核。授權依 <a href=\"https://github.com/azx4121/facility-studio/blob/main/LICENSE_GUIDE.md\">LICENSE_GUIDE<\/a>，正常公司工程工作適用現有附加許可。<\/p>"}], "en": [{"id": "start", "title": "1. Choose the right starting point", "html": "<h2>1. Choose the right starting point<\/h2><div class=\"table-scroll\"><table><thead><tr><th>Your task<\/th><th>Entry<\/th><th>Do you need the full workbench?<\/th><\/tr><\/thead><tbody><tr><td>kW to current, NFB and conductor candidate<\/td><td>Electrical sizing on the home screen<\/td><td>No<\/td><\/tr><tr><td>A duct, CDA pipe, lighting, water or air-state calculation<\/td><td>The corresponding simple calculator<\/td><td>No<\/td><\/tr><tr><td>Room HVAC, heat loads, utilities and a project report<\/td><td>Full workbench<\/td><td>Yes: start at section 3<\/td><\/tr><tr><td>One unit&#x27;s preheat, precool, humidification, recool and reheat<\/td><td>AHU management inside the workbench<\/td><td>See section 8<\/td><\/tr><tr><td>Batch Excel/CSV equipment demand<\/td><td>Import equipment schedule<\/td><td>Independent analysis; results do not silently populate the main project<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Do not start by filling every tab in an empty project.<\/strong> Open a practice project, change one condition, observe the result, then replace the example with your site data.<\/p><p>Extract the tutorial ZIP, then open <code>START_HERE.html<\/code> in a normal browser. It supports Chinese/English, step-by-step navigation, progress checkboxes and printing. The tutorial and practice files require neither Python nor an internet connection; external GitHub links need internet. The application&#x27;s <strong>Beginner tutorial<\/strong> button is available from the <strong>win.2 / mac.2 revision<\/strong>. Earlier V5.5.5 binaries can use the HTML directly.<\/p>"}, {"id": "interface", "title": "2. Learn four locations on the screen", "html": "<h2>2. Learn four locations on the screen<\/h2><p><svg xmlns=\"http://www.w3.org/2000/svg\" width=\"1100\" height=\"650\" viewBox=\"0 0 1100 650\" role=\"img\" aria-labelledby=\"map-title map-desc\"><title id=\"map-title\">Full workbench: where to click<\/title><desc id=\"map-desc\">Control-location diagram based on V5.5.5 source; not a screenshot.<\/desc><rect width=\"1100\" height=\"650\" rx=\"16\" fill=\"#eef3f7\"/><g font-family=\"system-ui, sans-serif\"><text x=\"30\" y=\"43\" font-size=\"24\" font-weight=\"700\" fill=\"#18334d\">Full workbench: where to click<\/text><rect x=\"24\" y=\"70\" width=\"249\" height=\"546\" rx=\"10\" fill=\"#11253b\"/><text x=\"42\" y=\"101\" font-size=\"17\" fill=\"#6edac7\" font-weight=\"700\">FACILITY STUDIO<\/text><rect x=\"36\" y=\"116\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"139\" font-size=\"14\" fill=\"#d7e5f4\">01  Overview / psychrometrics<\/text><rect x=\"36\" y=\"156\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"179\" font-size=\"14\" fill=\"#d7e5f4\">02  HVAC / rooms<\/text><rect x=\"36\" y=\"196\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"219\" font-size=\"14\" fill=\"#d7e5f4\">03  Heat loads / lighting<\/text><text x=\"45\" y=\"259\" font-size=\"14\" fill=\"#d7e5f4\">04  Gases / vacuum<\/text><text x=\"45\" y=\"299\" font-size=\"14\" fill=\"#d7e5f4\">05  Electrical distribution<\/text><text x=\"45\" y=\"339\" font-size=\"14\" fill=\"#d7e5f4\">06  Exhaust ducts<\/text><text x=\"45\" y=\"379\" font-size=\"14\" fill=\"#d7e5f4\">07  Water / pure water<\/text><text x=\"45\" y=\"419\" font-size=\"14\" fill=\"#d7e5f4\">08  Pressure losses<\/text><rect x=\"36\" y=\"436\" width=\"225\" height=\"32\" rx=\"5\" fill=\"#24536f\"/><text x=\"45\" y=\"459\" font-size=\"14\" fill=\"#d7e5f4\">09  Design report<\/text><text x=\"43\" y=\"574\" font-size=\"14\" fill=\"#829aaf\">DESIGNED BY<\/text><text x=\"43\" y=\"595\" font-size=\"14\" fill=\"#829aaf\">ANDY HUANG ©<\/text><rect x=\"291\" y=\"70\" width=\"785\" height=\"130\" rx=\"10\" fill=\"white\"/><text x=\"313\" y=\"107\" font-size=\"20\" font-weight=\"700\" fill=\"#126d80\">① Open  |  Save workspace  |  Basic mode<\/text><text x=\"313\" y=\"150\" font-size=\"16\" fill=\"#536b7d\">AHU management  |  Printable summary  |  Beginner tutorial (r2)<\/text><rect x=\"291\" y=\"217\" width=\"785\" height=\"322\" rx=\"10\" fill=\"white\"/><text x=\"313\" y=\"254\" font-size=\"20\" font-weight=\"700\" fill=\"#18334d\">③ Inputs and help: scroll for remaining fields<\/text><text x=\"323\" y=\"311\" font-size=\"17\" fill=\"#526d80\">Summer outdoor<\/text><rect x=\"550\" y=\"290\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"313\" font-size=\"17\" fill=\"#17324a\">35°C / 70% RH<\/text><text x=\"323\" y=\"363\" font-size=\"17\" fill=\"#526d80\">Room target<\/text><rect x=\"550\" y=\"342\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"365\" font-size=\"17\" fill=\"#17324a\">22°C / 50% RH<\/text><text x=\"323\" y=\"415\" font-size=\"17\" fill=\"#526d80\">Zone A dimensions<\/text><rect x=\"550\" y=\"394\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"417\" font-size=\"17\" fill=\"#17324a\">12 × 8 × 3 m<\/text><text x=\"323\" y=\"467\" font-size=\"17\" fill=\"#526d80\">People<\/text><rect x=\"550\" y=\"446\" width=\"373\" height=\"33\" rx=\"5\" fill=\"#f1f5f9\" stroke=\"#ccd9e2\"/><text x=\"568\" y=\"469\" font-size=\"17\" fill=\"#17324a\">8<\/text><rect x=\"1052\" y=\"273\" width=\"7\" height=\"240\" rx=\"4\" fill=\"#e5edf3\"/><rect x=\"1052\" y=\"290\" width=\"7\" height=\"87\" rx=\"4\" fill=\"#9fb3c3\"/><rect x=\"291\" y=\"556\" width=\"785\" height=\"60\" rx=\"10\" fill=\"#e0efee\"/><text x=\"313\" y=\"594\" font-size=\"20\" font-weight=\"700\" fill=\"#126d80\">④ Recalculate → Locate issue → Export report<\/text><\/g><\/svg><\/p><p>This is a <strong>location diagram based on actual controls, not a GUI screenshot<\/strong>.<\/p><div class=\"table-scroll\"><table><thead><tr><th>Location<\/th><th>Controls to learn first<\/th><th>Purpose<\/th><\/tr><\/thead><tbody><tr><td>Top<\/td><td>Open, Save workspace, Basic mode<\/td><td>Open the example and retain the main project and AHUs<\/td><\/tr><tr><td>Left<\/td><td>01, 02, 03, 09<\/td><td>Shared climate → HVAC/rooms → heat loads → report<\/td><\/tr><tr><td>Center<\/td><td>Input fields, help text and page scrollbars<\/td><td>Scroll smaller windows to reach the remaining fields<\/td><\/tr><tr><td>Bottom<\/td><td>Recalculate, Locate issue, Export Design report<\/td><td>Recalculate first, locate a problem, then export current results<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Basic mode hides less-used fields but still uses the saved effective settings.<\/strong> Disabled or hidden fields do not mean data has been deleted. Values disabled by a control mode remain as drafts and are excluded from that mode&#x27;s calculation. Advanced mode lets you inspect adopted values. <strong>Apply page reference values<\/strong> changes that page&#x27;s reference settings; leave it alone during the walkthrough. <strong>Undo import<\/strong> can restore the previous import/preset operation.<\/p>"}, {"id": "first-case", "title": "3. Open the first practice project", "html": "<h2>3. Open the first practice project<\/h2><ol><li>This page is already open offline. Practice JSON files are in the same folder. Save a copy using the Practice files links on the left, or locate this page folder in File Explorer/Finder and copy a JSON to your Desktop. If using a ZIP, extract it completely first.<\/li><li><strong>Copy<\/strong> <code>01_Practice_AHU.json<\/code> to your Desktop and rename it <code>My_First_Project.json<\/code>. Keep the original for restarting.<\/li><li>Open Facility Studio → <strong>Full workbench<\/strong> → <strong>Open<\/strong> at the top.<\/li><li>Select your copied <code>My_First_Project.json<\/code>. Save an existing modified project before switching.<\/li><li>Select <strong>Basic mode<\/strong>, then click <strong>Recalculate<\/strong> at the bottom, or press F5.<\/li><\/ol><p>This example is a <strong>12 × 8 × 3 m general work area, 8 people, AHU outside/return-air mixing<\/strong>. It is not a cleanroom certification case or a product selection. Unused gases, PV, exhaust, PCW and pure-water demand are zero; other equipment and chilled-water assumptions are provided for practice.<\/p><p><strong>Successful practice means current results and the report are synchronized, while quality remains “Data required.”<\/strong> Manufacturer performance, equipment pressure losses and electrical review are deliberately pending. Do not invent data to turn this into a passing selection.<\/p>"}, {"id": "inputs", "title": "4. Start your own project with five input groups", "html": "<h2>4. Start your own project with five input groups<\/h2><div class=\"table-scroll\"><table><thead><tr><th>Page / input<\/th><th>Example<\/th><th>What to enter for your project<\/th><\/tr><\/thead><tbody><tr><td>01 Shared climate: summer outdoor / room target<\/td><td>35°C, 70% RH / 22°C, 50% RH<\/td><td>Actual design climate and room requirements; winter example is 8°C, 70% RH<\/td><\/tr><tr><td>02 HVAC/rooms: system / A-zone dimensions / people<\/td><td>Mixed AHU / 12, 8, 3 m / 8 people<\/td><td>Actual architecture, dimensions in m; unused zone B retains zero length, width and people<\/td><\/tr><tr><td>02 Airflow calculation / ACH / specified outside air<\/td><td>ACH / 6 per hour / 0 for automatic<\/td><td>ACH is circulation demand, <strong>not all fresh air<\/strong>; 6 is a practice assumption, not a general requirement<\/td><\/tr><tr><td>03 Equipment heat / operating rate / process moisture<\/td><td>5 kW / 100% / No additional moisture<\/td><td>Heat for the same room boundary; use “Unknown” when moisture is not established<\/td><\/tr><tr><td>03 Lighting / wall and floor areas<\/td><td>500 lux, 4000 lm and 40 W per fixture / 60 and 96 m²<\/td><td>Lux is the target; lumens belong to each fixture; areas are m², not m³<\/td><\/tr><\/tbody><\/table><\/div><p>On page 01, <strong>Edit shared climate<\/strong> scrolls to the temperature/humidity inputs below the chart. The inputs have not disappeared. Utilization 0.6, maintenance 0.8 and person sensible/latent gains of 75/55 W are preliminary assumptions. In this example the summer adjacent-floor temperature is 22°C, equal to the room, so summer floor transmission is zero. This advanced assumption also affects the result.<\/p><p><strong>Try one change:<\/strong> set A-zone people from 8 to 12 and recalculate. Person sensible heat should increase by <strong>0.300 kW<\/strong>, and latent heat by <strong>0.220 kW<\/strong>. Then restore 8 and recalculate. Changing one input at a time makes the links easier to understand.<\/p>"}, {"id": "results", "title": "5. Check this short result table first", "html": "<h2>5. Check this short result table first<\/h2><p>After restoring the original data, compare the summaries on pages 01/03 and the page 09 report:<\/p><div class=\"table-scroll\"><table><thead><tr><th>Item<\/th><th>Expected result<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Area / volume<\/td><td>96 m² / 288 m³<\/td><td>12 × 8; area × 3 m<\/td><\/tr><tr><td>Lighting<\/td><td>25 fixtures / 1.000 kW<\/td><td>4000 lm and 40 W each, count rounded upward<\/td><\/tr><tr><td>Room sensible heat<\/td><td>7.870 kW<\/td><td>Equipment 5 + people 0.6 + lighting 1 + wall 1.270; other example gains are zero<\/td><\/tr><tr><td>Room latent heat / moisture<\/td><td>0.440 kW / 0.633 kg/h<\/td><td>8 × 55 W; no additional process moisture in this example<\/td><\/tr><tr><td>Minimum make-up outside air<\/td><td>192.0 CMH, room basis<\/td><td>8 × 24 CMH/person for this example, not a general ventilation rule<\/td><\/tr><tr><td>Circulation / treated airflow<\/td><td>1728.0 / 2400.2 CMH, room basis<\/td><td>288 × 6 sets a circulation minimum; heat/moisture balance needs more airflow<\/td><\/tr><tr><td>Linked CHW flow<\/td><td>41.115 LPM<\/td><td>Water-side load including 10% allowance, ΔT 5 K; not the stored manual 400 LPM<\/td><\/tr><tr><td>UP preliminary distribution<\/td><td>8.937 A; NFB candidate 15 AT; 3.5 mm² per phase, one set<\/td><td>Separately entered 5 kW electrical input, 380 V, PF 0.85; electrical review remains pending<\/td><\/tr><\/tbody><\/table><\/div><p>Begin with three formulas: <code>area=length×width<\/code>; <code>circulation CMH=volume×ACH<\/code>; <code>fixture count=ceil(target lux×area/(fixture lumens×utilization×maintenance))<\/code>. The full report also states thermal, moisture and piping formulas.<\/p><p>The overview&#x27;s <strong>Process-chart season<\/strong> switches summer/winter. Horizontal axis: dry bulb °C; vertical axis: humidity ratio g/kg dry air. OA is outside air, RA room air, IN inlet, C1/C2 cooling coils, HT heating and SA supply. Plotted points are <strong>required or specified states<\/strong>, not proof that unselected installed equipment achieves them. Bypassed stages can overlap; this is not a missing point.<\/p>"}, {"id": "export", "title": "6. Save and export your first report", "html": "<h2>6. Save and export your first report<\/h2><ol><li>Use <strong>Save workspace<\/strong> for <code>My_First_Project.json<\/code>. <strong>An opened project saves back to the same file.<\/strong> To make another project, first copy/rename it in File Explorer or Finder, then open the copy.<\/li><li>Select <strong>09 Design report<\/strong>. Read conditions, results, pending data and formulas.<\/li><li><strong>Export Design report<\/strong> at the bottom writes a <strong>TXT<\/strong> file.<\/li><li><strong>Export printable summary<\/strong> at the top writes <strong>HTML<\/strong>. Open it in a browser and print, choosing <strong>Save as PDF<\/strong> if needed.<\/li><li><strong>Save full calculation data JSON<\/strong> on page 09 exports numerical audit results. <strong>It is not a reopenable workspace JSON.<\/strong><\/li><\/ol><div class=\"table-scroll\"><table><thead><tr><th>File<\/th><th>Purpose<\/th><th>Open from the workbench?<\/th><\/tr><\/thead><tbody><tr><td>Saved workspace <code>.json<\/code><\/td><td>Main project, all AHUs, A/B, sources and transfer receipts<\/td><td>Yes<\/td><\/tr><tr><td>Exported TXT / HTML / PDF<\/td><td>Read, print or share results<\/td><td>No<\/td><\/tr><tr><td>Full calculation JSON<\/td><td>Numerical review and calculation evidence<\/td><td>Not as a workspace<\/td><\/tr><tr><td>Saved single-AHU JSON<\/td><td>One AHU&#x27;s settings<\/td><td>Open in the AHU window, not the main workbench<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Your first practice report is now complete.<\/strong> Learn this route before adding the optional systems below.<\/p>"}, {"id": "utilities", "title": "7. Use other pages only when needed", "html": "<h2>7. Use other pages only when needed<\/h2><div class=\"table-scroll\"><table><thead><tr><th>Sidebar page<\/th><th>When to use it<\/th><th>First checks<\/th><\/tr><\/thead><tbody><tr><td>04 Gases/vacuum<\/td><td>CDA, N2, other gases or PV<\/td><td><strong>Flow<\/strong>, minimum pipe pressure, units; advanced mode supports per-line pressure/velocity<\/td><\/tr><tr><td>05 Electrical distribution<\/td><td>UP/NP demand estimates<\/td><td>Electrical-input kW, three-phase line voltage and load type; electrical input is separate from room heat<\/td><\/tr><tr><td>06 Exhaust ducts<\/td><td>General, acid, alkali, organic or hot exhaust<\/td><td>CMH per line; review preliminary speed/allowance against actual materials and requirements<\/td><\/tr><tr><td>07 Water/pure water<\/td><td>Cooling/heating water or pure-water main<\/td><td>Flow source and ΔT; pure-water circulation LPM and velocity limit<\/td><\/tr><tr><td>08 Pressure losses<\/td><td>A known critical route<\/td><td>An active system, route length, fitting allowance and whether equipment loss is known<\/td><\/tr><\/tbody><\/table><\/div><p>Unused gases, PV, exhaust, PCW and pure water can stay zero in this example. <strong>Water circuits serving the active HVAC system remain linked to its load.<\/strong> Do not zero an active circuit just to hide a page.<\/p><p><strong>Latent load:<\/strong> removal demand caused by moisture entering the room, distinct from ordinary machine heat. People are calculated automatically. An open tank evaporating 1 kg/h into the room adds <code>1×2501/3600=0.695 kW<\/code>; choose <strong>Known moisture generation (kg/h)<\/strong> and enter 1. If the known value is 1 kW, choose <strong>Known latent load (kW)<\/strong> instead. Only the selected mode is used. Outdoor moisture is handled at the coil, not entered again as room process moisture. Unknown data should remain unknown.<\/p><p><strong>Linked water flow:<\/strong> the linked mode calculates <code>LPM=60000×kW/(ρ×cp×ΔT)<\/code> and excludes stored manual flow. To use a measured 100 LPM, select <strong>Independent input<\/strong> before entering 100. Capacity is then compared with demand. Upstream PCW heat removal and the main&#x27;s flow boundary must also agree.<\/p><p><strong>Simple pressure loss:<\/strong> select CHW → route length 30 m → 30% general preliminary allowance → equipment data unavailable. Water-side length is the <strong>sum of supply and return straight runs<\/strong>. <strong>Closed circulation does not add building height as pump static lift.<\/strong> Unknown equipment losses leave a pipe-only subtotal; this is not full pump selection head. The 10/30/50% choices are scenario allowances, not fitting standards. Check Pa/mmAq versus kPa/water head before combining losses.<\/p><p><strong>CDA/PV:<\/strong> pressure and velocity cannot uniquely size a pipe without flow. Gas sizing defaults to the shared <strong>minimum gauge pressure<\/strong>, distinct from supply pressure. PV Torr/kPa(abs)/mbar(abs) are absolute; unit switching converts the value. Pure-water resistivity is a reference target at 25°C, not measured quality certification.<\/p>"}, {"id": "ahu", "title": "8. AHU management: use the second practice project", "html": "<h2>8. AHU management: use the second practice project<\/h2><p><code>02_Practice_MAU_and_AHU.json<\/code> already includes a main project and <strong>Tutorial MAU-01<\/strong>, so you need not start with the large 58,000 CMH default unit. It is a full-outside-air MAU+FFU+DCC teaching model for the same 96 m² area, with 20 ACH circulation. Supply-state single-unit airflow is about 358.3 CMH; room-basis airflow is about 359.2 CMH. The small difference comes from state/specific-volume bases.<\/p><ol><li>Save the first project. Copy/rename the second file and open the copy in the main workbench.<\/li><li><strong>Recalculate<\/strong> the main project, then open <strong>AHU management<\/strong>.<\/li><li>Select <strong>Tutorial MAU-01<\/strong> → <strong>Open selected AHU<\/strong>. Do not add a new large default unit first.<\/li><li>On <strong>1 Design conditions<\/strong>, inspect airflow, summer/winter conditions/targets, H1/H2 sources, C1/C2 water temperatures/candidate capacities and humidifier type.<\/li><li>All stages initially use automatic demand. H1/H2 each have 8 kW electric heat, C1/C2 each 3 US RT, with wet media operating only when humidification is needed. <strong>These are synthetic practice ratings<\/strong>; manufacturer curves, resistance and media data remain pending.<\/li><li>Recalculate, switch summer/winter in the results, and inspect each inlet/outlet, demand and rating check. Demand states do not simulate actual leaving air from undersized equipment.<\/li><\/ol><div class=\"table-scroll\"><table><thead><tr><th>Stage<\/th><th>Function<\/th><th>Start with<\/th><\/tr><\/thead><tbody><tr><td>H1 preheat<\/td><td>Initial heating, possibly needed for downstream evaporative humidification<\/td><td>Automatic demand; select actual electric, recovered hot water, combined or disabled sources<\/td><\/tr><tr><td>C1 precool<\/td><td>First cooling stage<\/td><td>Automatic demand; review supply/return water and candidate RT<\/td><\/tr><tr><td>Humidification<\/td><td>Evaporative wet media or steam<\/td><td>Actual equipment type; water/energy effects differ<\/td><\/tr><tr><td>C2 recool<\/td><td>Further cooling or dehumidification<\/td><td>Automatic demand; water temperature must support the target humidity ratio<\/td><\/tr><tr><td>H2 reheat<\/td><td>Final supply dry-bulb adjustment<\/td><td>Automatic demand; review this stage&#x27;s installed capacity separately<\/td><\/tr><\/tbody><\/table><\/div><p>For stage outlet targets, enable <strong>Show advanced / manufacturer data<\/strong>, then choose a summer/winter stage&#x27;s specified outlet dry bulb. Cooling stages also offer specified T/RH. <strong>Each inlet follows the preceding outlet<\/strong>, rather than restarting at outdoor conditions. Use bypass for an unused stage, not 0°C.<\/p><p><strong>Main → AHU:<\/strong> <strong>Import main-project seasonal supply demand<\/strong> shows a confirmation. It currently supports <strong>full-outside-air MAU main projects only<\/strong>; the first mixed-AHU example cannot be imported into this full-outside-air unit model. It updates seasonal inlet/supply demand and chilled-water temperatures. Explicit stage targets and installed ratings remain and require recalculation. Changing the main boundary expires the old link; reimport it.<\/p><p><strong>AHU → main:<\/strong> use <strong>Preview water / rated-power transfer<\/strong>, read before/after values, then confirm. This example previews MCHW <strong>12.443 LPM<\/strong>, CHW <strong>12.348 LPM<\/strong>, NP fan <strong>0.370 kW<\/strong>, heating <strong>16.000 kW<\/strong>, and confirmed wash pump <strong>0.100 kW<\/strong>. Heating 16 kW is the sum of installed heater ratings, <strong>not concurrent air-heating demand<\/strong>.<\/p><p>Transfer <strong>replaces listed fields; it does not add multiple AHUs<\/strong>. Unknown pump power or unused hot-water service may preserve existing main values; read the preview notes. Aggregate other units/equipment separately; repeated transfers are not a summation function. Transfer does not certify installed capacity.<\/p><p>Closing an AHU window retains the unit. Save the whole workspace from the main window. <strong>Save single AHU<\/strong> writes a separate unit file. Read the <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/ahu.en.md\">larger stage-capacity worked example<\/a> next if needed.<\/p>"}, {"id": "recovery", "title": "9. Sources, A/B comparison and recovery", "html": "<h2>9. Sources, A/B comparison and recovery<\/h2><p><strong>Sources / comparison / recovery<\/strong> contains three tabs:<\/p><div class=\"table-scroll\"><table><thead><tr><th>Tab<\/th><th>Use<\/th><\/tr><\/thead><tbody><tr><td>Parameter sources<\/td><td>Identify assumptions, measurements and manufacturer documents, with selection/catalog references<\/td><\/tr><tr><td>A/B scenarios<\/td><td>Recalculate and capture A; change one input, recalculate and capture B; compare. Captured snapshots do not automatically update after further edits<\/td><\/tr><tr><td>Backups and calculation basis<\/td><td>View recovery; automatic recovery runs about every 30 seconds and does not replace deliberate saving<\/td><\/tr><\/tbody><\/table><\/div><p>Resaving an existing project preserves a <code>.json.bak<\/code>. An exported calculation result is not a project backup. Keep the workspace, not only a TXT report. Invalid inputs can be saved as a draft; they do not thereby become valid report inputs.<\/p>"}, {"id": "faq", "title": "10. When you get stuck", "html": "<h2>10. When you get stuck<\/h2><div class=\"table-scroll\"><table><thead><tr><th>Problem<\/th><th>Next action<\/th><\/tr><\/thead><tbody><tr><td>Shared temperature/humidity fields are missing<\/td><td>On 01, use Edit shared climate or scroll below the chart<\/td><\/tr><tr><td>A field is hidden/disabled<\/td><td>Check basic/advanced and control modes; inactive values are retained, not deleted<\/td><\/tr><tr><td>Changing a number clears a previous chart/result<\/td><td>Stale results are deliberately cleared; finish editing and recalculate<\/td><\/tr><tr><td>Red input outline or export disabled<\/td><td>Locate issue, fix that field/unit and recalculate; do not reuse an old report<\/td><\/tr><tr><td>Data required<\/td><td>Read what is missing; preliminary calculation does not certify product selection<\/td><\/tr><tr><td>Conditions not met<\/td><td>Inspect the capacity, temperature or flow limitation; increasing a safety allowance alone is not a repair<\/td><\/tr><tr><td>Process moisture unknown<\/td><td>Choose the unknown mode and retain pending data rather than guessing a large kW<\/td><\/tr><tr><td>PCW removal exceeds equipment heat<\/td><td>Recheck common operating boundary, unit count, flow, ΔT, operating rate and exhaust share<\/td><\/tr><tr><td>Manual water flow has no effect<\/td><td>Linked mode ignores it; choose Independent input for measured flow<\/td><\/tr><tr><td>Mixed AHU cannot link to the unit<\/td><td>The full-outside-air unit model supports MAU links; do not change a real system&#x27;s architecture just to bypass this restriction<\/td><\/tr><tr><td>Transfer says the source expired<\/td><td>Reimport current main demand; detach only for a deliberate independent design<\/td><\/tr><tr><td>You only need one calculation<\/td><td>Return to the simple calculator instead of filling a whole facility<\/td><\/tr><\/tbody><\/table><\/div><p>Practice verification runs <strong>20 operation-related conditions per source platform<\/strong>, including heat/moisture conservation, units, water ownership, pressure-loss scope, MAU linking and insufficient capacity. See <a href=\"https://github.com/azx4121/facility-studio/tree/main/docs/tutorial\">inputs, verifier and evidence<\/a>. Control locations were checked against source. Native acceptance of the new tutorial entry and author credit is tracked separately; numerical checks are not described as manual testing of every UI control.<\/p><p>For remaining problems, <a href=\"https://github.com/azx4121/facility-studio/issues\">report an issue<\/a> with version, platform, page, steps and synthetic input. Formal product/protection selection needs site conditions and manufacturer data. Use remains governed by the <a href=\"https://github.com/azx4121/facility-studio/blob/main/LICENSE_GUIDE.en.md\">current license guide<\/a>, including the internal engineering-work permission.<\/p>"}]}, "labels": {"zh-Hant": {"title": "Facility Studio 新手教學", "subtitle": "先完成前六步；其餘依需求再學。", "next": "下一步", "previous": "上一步", "mark": "本步驟已完成", "print": "列印教學", "all": "閱讀全文", "guided": "逐步跟做", "reset": "重設勾選進度", "progress": "學習進度", "files": "練習檔案", "offline": "離線版｜V5.5.5｜Windows / macOS", "signature": "DESIGNED BY ANDY HUANG ©", "n": 10}, "en": {"title": "Facility Studio beginner tutorial", "subtitle": "Finish the first six steps; learn the rest when needed.", "next": "Next step", "previous": "Previous", "mark": "Step completed", "print": "Print tutorial", "all": "Read all", "guided": "Guided steps", "reset": "Reset checkmarks", "progress": "Progress", "files": "Practice files", "offline": "Offline | V5.5.5 | Windows / macOS", "signature": "DESIGNED BY ANDY HUANG ©", "n": 10}}}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('tutorial-data').textContent);
const ids=data.content['zh-Hant'].map(s=>s.id);const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem('facility-tutorial-v555-r2')||'{}')||{};}catch(e){}
const requestedLanguage=new URLSearchParams(location.search).get('language');
let lang=Object.prototype.hasOwnProperty.call(data.content,requestedLanguage)?requestedLanguage:Object.prototype.hasOwnProperty.call(data.content,saved.lang)?saved.lang:'zh-Hant';let step=Math.max(0,ids.indexOf(location.hash.slice(1)));let all=false;
const done=new Set(Array.isArray(saved.done)?saved.done.filter(x=>ids.includes(x)):[]);
function persist(){try{localStorage.setItem('facility-tutorial-v555-r2',JSON.stringify({lang,done:[...done]}));}catch(e){}}
function render(){const labels=data.labels[lang];document.documentElement.lang=lang;document.title=labels.title;$('title').textContent=labels.title;$('subtitle').textContent=labels.subtitle;$('offline').textContent=labels.offline;$('language').value=lang;$('all').textContent=all?labels.guided:labels.all;$('print').textContent=labels.print;$('files-label').textContent=labels.files;$('reset').textContent=labels.reset;$('previous').textContent=labels.previous;$('next').textContent=labels.next;$('mark').textContent=labels.mark;$('previous').disabled=step===0;$('next').disabled=step===ids.length-1;$('done').checked=done.has(ids[step]);$('progress-label').textContent=labels.progress+' '+done.size+' / '+ids.length;$('progress').value=done.size;document.body.classList.toggle('all-mode',all);$('nav').replaceChildren();$('sheet').replaceChildren();data.content[lang].forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=(done.has(s.id)?'✓ ':'')+s.title;b.classList.toggle('active',i===step);if(i===step)b.setAttribute('aria-current','step');b.onclick=()=>go(i);$('nav').append(b);const section=document.createElement('section');section.id=s.id;section.hidden=!all&&i!==step;section.innerHTML=s.html;$('sheet').append(section);});}
function go(i){step=Math.max(0,Math.min(ids.length-1,i));try{history.replaceState(null,'','#'+ids[step]);}catch(e){location.hash=ids[step];}render();if(all)$(ids[step]).scrollIntoView({block:'start',behavior:'smooth'});else $('main').scrollIntoView({block:'start',behavior:'smooth'});}
$('language').onchange=()=>{lang=$('language').value;persist();render();};$('all').onclick=()=>{all=!all;render();};$('print').onclick=()=>window.print();$('previous').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);$('done').onchange=()=>{if($('done').checked)done.add(ids[step]);else done.delete(ids[step]);persist();render();};$('reset').onclick=()=>{done.clear();persist();render();};window.onhashchange=()=>{const i=ids.indexOf(location.hash.slice(1));if(i>=0){step=i;render();}};document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&ids.includes(a.getAttribute('href').slice(1))){e.preventDefault();go(ids.indexOf(a.getAttribute('href').slice(1)));}});render();
</script></body></html>
