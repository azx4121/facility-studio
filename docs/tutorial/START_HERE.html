hcIzBpegYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgbXCAwBbGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYHCNwBDABgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBtcIDAFsYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBggGsD/z+y4PRibaxltQAAAABJRU5ErkJggg==\" alt=\"Native English psychrometric chart on macOS\"><\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/12-air.json\">12<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/13-air.json\">13<\/a>. The original verifier independently checks humidity ratio/enthalpy against the Buck saturation-pressure correlation with 0.3% approximation tolerance: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">results<\/a>.<\/p>\n"},{"id":"units","title":"Optional: Engineering units: CFM / CMH, temperature, temperature difference and Kv / Cv","html":"<h2>Engineering units: CFM / CMH, temperature, temperature difference and Kv / Cv<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/units.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Open <strong>More quick tools → Unit converter<\/strong>. Choose the physical quantity, value and source unit. Supported quantities include airflow, water flow, pressure, thermal power, length, temperature, temperature difference and valve flow coefficient.<\/p>\n<p><a id=\"case-14\"><\/a><\/p>\n<h2>Case 14: 1,000 CFM<\/h2>\n<p>Choose airflow, value 1,000 and source CFM.<\/p>\n<p><code>1,000 CFM = 1,699.0108 CMH = 471.9474 L/s = 0.4719474 m³/s<\/code><\/p>\n<p><code>1 CFM = 1.69901079552 CMH<\/code>. CMM (m³/min) and CMH (m³/h) are different.<\/p>\n<p><a id=\"case-15\"><\/a><\/p>\n<h2>Case 15: chilled water 12°C to 7°C<\/h2>\n<p>Choose <strong>temperature difference<\/strong>, value 5 and source °C difference. Result: 5 K = 9°F difference.<\/p>\n<p><code>ΔT_F = ΔT_C × 9/5<\/code>, without adding 32. For an actual temperature, use the separate temperature quantity: 25°C = 77°F = 298.15 K.<\/p>\n<p><strong>Kv/Cv are valve flow coefficients.<\/strong> Kv expresses water flow in m³/h at a 1 bar pressure drop; Cv(US) uses US GPM at 1 psi. This conversion uses <code>Kv ≈ 0.865 × Cv(US)<\/code>. It is not pipe diameter conversion or complete gas-valve selection.<\/p>\n<p>Pressure conversion retains the gauge/absolute basis: changing bar to kPa does not add atmospheric pressure. US and UK GPM, and US RT and Japanese refrigeration tons, remain separate.<\/p>\n<p>A one-off stable conversion can be answered directly. The tool is useful for repeated offline comparison and engineering calculations.<\/p>\n<p>Inputs: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/14-units.json\">14<\/a>, <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/15-units.json\">15<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Original results<\/a>.<\/p>\n"},{"id":"equipment","title":"Optional: Excel / CSV equipment demand: electricity, PCW, CDA, N2, EXHAUST, DI and PV","html":"<h2>Excel / CSV equipment demand: electricity, PCW, CDA, N2, EXHAUST, DI and PV<\/h2>\n<p><a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/equipment.md\">繁體中文<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/guides/README.en.md\">All guides<\/a> · <a href=\"https://github.com/azx4121/facility-studio/blob/main/README.en.md#download-and-run\">Downloads<\/a><\/p>\n<p>Choose <strong>English<\/strong>, then open <strong>Equipment schedules<\/strong> at the top right and export a template. Newly exported Excel/CSV templates use the selected language. The bundled and <a href=\"https://github.com/azx4121/facility-studio/blob/main/windows/facility_studio/resources/Equipment_Template.xlsx\">repository template<\/a> may retain Chinese labels; both languages can be imported. Excel contains seven systems; a CSV file represents one selected system.<\/p>\n<ol>\n<li>Enter each equipment ID/name, supply group, quantity, simultaneous-use percentage and per-unit system data.<\/li>\n<li>Set <strong>Enabled (1/0)<\/strong> to <strong>1<\/strong> for actual equipment. Example rows default to 0 and are excluded.<\/li>\n<li>Enter actual numeric values in input cells. Paste values instead of formulas; do not use TRUE/FALSE or Excel error values.<\/li>\n<li>Import and inspect groups, assumptions, missing data and results before exporting the report.<\/li>\n<\/ol>\n<p>Retain sheet names and row 5 headers, and sort complete rows. Row 6 is a disabled example; add equipment from row 7 or replace the example. The template provides 100 rows; insert extra rows before the field instructions, up to 10,000 records per system. Input formulas, macros and legacy .xls files are not accepted. Gray formula columns do not replace the importer’s independent calculation.<\/p>\n<p>Simultaneous use estimates peak coincident demand; it is not an hourly operating-time fraction. A main&#39;s diversity factor does not automatically reduce branch ratings. Verify equipment ratings, gas reference conditions, supply voltage/phase and exhaust type.<\/p>\n<h2>Analyze, transfer and save separately<\/h2>\n<p>Analysis does not change the main project. Select one supply group and UP/NP or a destination gas route, then use Preview transfer to main and confirm the before/after values. A main project can be created if none is open. Reimporting the same system/group/destination updates its source instead of adding again. Keep all equipment for one group in the same schedule rather than treating partial batches as separate sources.<\/p>\n<p>Electrical transfer supports only three-phase groups at the main line voltage. Other voltages and single-phase groups stay independent. P/Q, continuous-load allowances, the largest active branch-current floor and longest feeder run are retained. Socket counts describe connection points and cannot establish unknown socket kW. Electrical input is not transferred into room heat gain.<\/p>\n<p>PCW transfers flow and flow-weighted delta T. Where supply/return temperatures are absent, 25 C is only a pending placeholder; different service groups remain separate circuits. CDA/N2 transfer standard demand; compare main route pressure, temperature and velocity with imported requirements. Exhaust stays separated by type and terminal static pressure is not fan ESP. DI includes continuous circulation; reference quality is not measured quality. PV still needs pump/conductance data. Save the workspace to retain Demand ledger; an equipment-report export does not save the main workspace.<\/p>\n<h2>Percentage input<\/h2>\n<table>\n<thead>\n<tr>\n<th>Input<\/th>\n<th>Adopted simultaneous rate<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Number <code>50<\/code> or text <code>50%<\/code><\/td>\n<td>50%<\/td>\n<\/tr>\n<tr>\n<td>Excel percent cell stored as <code>0.5<\/code>, displayed as <code>50%<\/code><\/td>\n<td>50%, based on the active cell number format<\/td>\n<\/tr>\n<tr>\n<td>General-format number <code>0.5<\/code><\/td>\n<td>0.5%, without a magnitude guess<\/td>\n<\/tr>\n<tr>\n<td>Blank<\/td>\n<td>100% reference, disclosed in the detail<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Review the adopted rate, raw value and format after import. Formula, Boolean and error cells are rejected rather than silently becoming zero. Branches retain rated-load checks.<\/p>\n<p><a id=\"case-16\"><\/a><\/p>\n<h2>Case 16: three electrical equipment types<\/h2>\n<table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Quantity<\/th>\n<th>kW per unit<\/th>\n<th>Supply<\/th>\n<th>PF<\/th>\n<th>Simultaneous use<\/th>\n<th>Sockets per unit<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>E-01<\/td>\n<td>3<\/td>\n<td>10<\/td>\n<td>Three-phase 380 V<\/td>\n<td>0.85<\/td>\n<td>50%<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>E-02<\/td>\n<td>2<\/td>\n<td>5<\/td>\n<td>Three-phase 380 V<\/td>\n<td>0.85<\/td>\n<td>100%<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>E-03<\/td>\n<td>1<\/td>\n<td>3<\/td>\n<td>Single-phase 220 V<\/td>\n<td>1<\/td>\n<td>100%<\/td>\n<td>1<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>Use supply group UP-01, general load and 30 m one-way; retain remaining template assumptions.<\/p>\n<p>Three-phase connected load: 40 kW. Simultaneous demand: <code>3×10×0.5 + 2×5 = 25 kW<\/code>; 29.412 kVA, 44.687 A and seven sockets. The single-phase equipment is a separate group: 3 kW, 13.636 A, one socket. Matching group names do not merge different voltages/phases. Sockets are connection counts, not an additional power multiplier.<\/p>\n<p><a id=\"case-17\"><\/a><\/p>\n<h2>Case 17: six utility examples, quantity two and 50% simultaneous use<\/h2>\n<p>Enable the PCW, CDA, N2, EXHAUST, DI and PV template examples; set quantity two and simultaneous use 50%, retaining other example data. These are synthetic cases.<\/p>\n<table>\n<thead>\n<tr>\n<th>System<\/th>\n<th>Per-unit input<\/th>\n<th>Simultaneous result<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>PCW<\/td>\n<td>30 LPM, ΔT 5 K<\/td>\n<td>30 LPM, 10.467 kW<\/td>\n<\/tr>\n<tr>\n<td>CDA<\/td>\n<td>100 SLPM, 6 bar(g)<\/td>\n<td>100 SLPM, 14.448 ALPM<\/td>\n<\/tr>\n<tr>\n<td>N2<\/td>\n<td>50 SLPM, 5 bar(g)<\/td>\n<td>50 SLPM, 8.425 ALPM<\/td>\n<\/tr>\n<tr>\n<td>EXHAUST<\/td>\n<td>GEX 500 CMH, equipment-end 200 Pa<\/td>\n<td>500 CMH; 200 Pa is not full-route ESP<\/td>\n<\/tr>\n<tr>\n<td>DI<\/td>\n<td>Process 10 LPM plus continuous circulation 2 LPM<\/td>\n<td>Process 10 + circulation 4 = 14 LPM<\/td>\n<\/tr>\n<tr>\n<td>PV<\/td>\n<td>100 SLPM, 150 Torr(abs)<\/td>\n<td>100 SLPM, 506.667 ALPM<\/td>\n<\/tr>\n<\/tbody><\/table>\n<p>DI continuous circulation is not reduced by diversity. Water quality and supply/return routing require review; UPW/DI/RO quality defaults record specifications, not measured resistivity or production guarantees. PV needs separate pump and conductance selection.<\/p>\n<p>Utilities remain separated by supply group. Acid, alkaline, organic and general exhaust remain separated by type; aggregation does not permit mixing incompatible systems. Gas standard flows normalize to 25°C / 101.325 kPa(abs); group sizing uses the lowest entered absolute pressure, highest temperature and lowest velocity limit.<\/p>\n<p>Data: <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/scenarios.json\">cases 16 and 17<\/a>. <a href=\"https://github.com/azx4121/facility-studio/blob/main/docs/examples/calculation-results-windows.json\">Parsing, grouping and inverse checks<\/a>.<\/p>\n"}]},"labels":{"zh-Hant":{"title":"Facility Studio 新手教學","subtitle":"先完成前六步；其餘依需求再學。","next":"下一步","previous":"上一步","mark":"我已閱讀此步（手動記錄，非軟體驗收）","print":"列印教學","all":"閱讀全文","guided":"逐步跟做","reset":"重設勾選進度","progress":"前六步閱讀進度","files":"練習檔案","offline":"離線版｜V5.5.8 | Windows / macOS","signature":"DESIGNED BY ANDY HUANG ©","n":6},"en":{"title":"Facility Studio beginner tutorial","subtitle":"Finish the first six steps; learn the rest when needed.","next":"Next step","previous":"Previous","mark":"I have read this step (manual record, not software verification)","print":"Print tutorial","all":"Read all","guided":"Guided steps","reset":"Reset checkmarks","progress":"Required reading progress","files":"Practice files","offline":"Offline | V5.5.8 | Windows / macOS","signature":"DESIGNED BY ANDY HUANG ©","n":6}}}</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('tutorial-data').textContent);
const ids=data.content['zh-Hant'].map(s=>s.id);const required=ids.slice(0,6);const $=id=>document.getElementById(id);
let saved={};try{saved=JSON.parse(localStorage.getItem('facility-tutorial-v556-r1')||'{}')||{};}catch(e){}
const requestedLanguage=new URLSearchParams(location.search).get('language');
let lang=Object.prototype.hasOwnProperty.call(data.content,requestedLanguage)?requestedLanguage:Object.prototype.hasOwnProperty.call(data.content,saved.lang)?saved.lang:'zh-Hant';let step=Math.max(0,ids.indexOf(location.hash.slice(1)));let all=false;
const done=new Set(Array.isArray(saved.done)?saved.done.filter(x=>ids.includes(x)):[]);
function persist(){try{localStorage.setItem('facility-tutorial-v556-r1',JSON.stringify({lang,done:[...done]}));}catch(e){}}
function render(){const labels=data.labels[lang];document.documentElement.lang=lang;document.title=labels.title;$('title').textContent=labels.title;$('subtitle').textContent=labels.subtitle;$('offline').textContent=labels.offline;$('language').value=lang;$('all').textContent=all?labels.guided:labels.all;$('print').textContent=labels.print;$('files-label').textContent=labels.files;$('reset').textContent=labels.reset;$('previous').textContent=labels.previous;$('next').textContent=labels.next;$('mark').textContent=labels.mark+'：'+data.content[lang][step].title;$('done').disabled=all;$('previous').disabled=step===0;$('next').disabled=step===ids.length-1;$('done').checked=done.has(ids[step]);const completed=required.filter(id=>done.has(id)).length;$('progress-label').textContent=labels.progress+' '+completed+' / 6';$('progress').value=completed;document.body.classList.toggle('all-mode',all);$('nav').replaceChildren();$('sheet').replaceChildren();data.content[lang].forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=(done.has(s.id)?'✓ ':'')+(i>=6&&i<10?(lang==='en'?'Optional: ':'選讀：'):'')+s.title;b.classList.toggle('active',i===step);if(i===step)b.setAttribute('aria-current','step');b.onclick=()=>go(i);$('nav').append(b);const section=document.createElement('section');section.id=s.id;section.hidden=!all&&i!==step;section.innerHTML=s.html;$('sheet').append(section);});}
function go(i){step=Math.max(0,Math.min(ids.length-1,i));try{history.replaceState(null,'','#'+ids[step]);}catch(e){location.hash=ids[step];}render();if(all)$(ids[step]).scrollIntoView({block:'start',behavior:'smooth'});else $('main').scrollIntoView({block:'start',behavior:'smooth'});}
$('language').onchange=()=>{lang=$('language').value;persist();render();};$('all').onclick=()=>{all=!all;render();};$('print').onclick=()=>window.print();$('previous').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);$('done').onchange=()=>{if(all)return;if(all)return;if($('done').checked)done.add(ids[step]);else done.delete(ids[step]);persist();render();};$('reset').onclick=()=>{done.clear();persist();render();};window.onhashchange=()=>{const i=ids.indexOf(location.hash.slice(1));if(i>=0){step=i;render();}};document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a&&ids.includes(a.getAttribute('href').slice(1))){e.preventDefault();go(ids.indexOf(a.getAttribute('href').slice(1)));}});render();
</script></body></html>
