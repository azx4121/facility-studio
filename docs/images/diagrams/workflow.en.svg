<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">Your first report in six steps</title><desc id="desc">Learn with a synthetic practice project before entering your own design conditions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#007e87"/></marker></defs>
<g font-family="Noto Sans CJK TC, Microsoft JhengHei, PingFang TC, Arial, sans-serif">
<rect x="0" y="0" width="1280" height="900" rx="0" fill="#f2f6f8" stroke="none"/>
<rect x="0" y="0" width="1280" height="178" rx="0" fill="#10293c" stroke="none"/>
<text x="48" y="48" font-size="18" font-weight="600" fill="#9de0de">FACILITY STUDIO   /   5.7.3 DOCUMENTATION</text>
<text x="48" y="105" font-size="40" font-weight="700" fill="white">Your first report in six steps</text>
<text x="48" y="148" font-size="20" font-weight="400" fill="#d7e4ea">Learn with a synthetic practice project before entering your own design conditions.</text>
<path d="M77 268 L77 296" fill="none" stroke="#007e87" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="208" width="58" height="58" rx="29" fill="#007e87" stroke="none"/>
<text x="68" y="247" font-size="27" font-weight="700" fill="white">1</text>
<text x="128" y="233" font-size="26" font-weight="700" fill="#10293c">Verify the build</text>
<text x="128" y="268" font-size="20" font-weight="400" fill="#526575">Check platform, source, SHA256 and the in-app version.</text>
<path d="M77 362 L77 390" fill="none" stroke="#007e87" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="302" width="58" height="58" rx="29" fill="#007e87" stroke="none"/>
<text x="68" y="341" font-size="27" font-weight="700" fill="white">2</text>
<text x="128" y="327" font-size="26" font-weight="700" fill="#10293c">Save a practice copy</text>
<text x="128" y="362" font-size="20" font-weight="400" fill="#526575">Open the first offline example and save your own file.</text>
<path d="M77 456 L77 484" fill="none" stroke="#007e87" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="396" width="58" height="58" rx="29" fill="#007e87" stroke="none"/>
<text x="68" y="435" font-size="27" font-weight="700" fill="white">3</text>
<text x="128" y="421" font-size="26" font-weight="700" fill="#10293c">Enter inputs and units</text>
<text x="128" y="456" font-size="20" font-weight="400" fill="#526575">Review climate, room, loads, paths and adopted values.</text>
<path d="M77 550 L77 578" fill="none" stroke="#007e87" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="490" width="58" height="58" rx="29" fill="#007e87" stroke="none"/>
<text x="68" y="529" font-size="27" font-weight="700" fill="white">4</text>
<text x="128" y="515" font-size="26" font-weight="700" fill="#10293c">Recalculate</text>
<text x="128" y="550" font-size="20" font-weight="400" fill="#526575">Reimport changed upstream inputs into downstream tools.</text>
<path d="M77 644 L77 672" fill="none" stroke="#007e87" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="48" y="584" width="58" height="58" rx="29" fill="#007e87" stroke="none"/>
<text x="68" y="623" font-size="27" font-weight="700" fill="white">5</text>
<text x="128" y="609" font-size="26" font-weight="700" fill="#10293c">Read engineering states</text>
<text x="128" y="644" font-size="20" font-weight="400" fill="#526575">Review requirements, missing data and failed conditions.</text>
<rect x="48" y="678" width="58" height="58" rx="29" fill="#007e87" stroke="none"/>
<text x="68" y="717" font-size="27" font-weight="700" fill="white">6</text>
<text x="128" y="703" font-size="26" font-weight="700" fill="#10293c">Save, then export</text>
<text x="128" y="738" font-size="20" font-weight="400" fill="#526575">Reopen project JSON; read reports as TXT or HTML.</text>
<rect x="48" y="792" width="1184" height="58" rx="16" fill="#fff0cf" stroke="none"/>
<text x="72" y="829" font-size="20" font-weight="600" fill="#10293c">Reading progress, successful export and complete attachments are not design certification.</text>
<text x="48" y="876" font-size="17" font-weight="400" fill="#526575">Documentation illustration, not a UI screenshot or acceptance evidence.</text>
</g></svg>
