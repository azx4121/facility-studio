# The one-time 2026-10-08 historical asset cleanup must not run on new releases.
name: Retired historical download cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse the historical cleanup
        run: |
          echo "The historical download cleanup is retired. Existing releases and assets are preserved."
          echo "No software was built, tested or published."
          exit 1
