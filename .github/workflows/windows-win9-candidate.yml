name: Build and verify Windows win.9 candidate

# Native acceptance of Source/windows (the win.9 candidate) with the same build and verification
# scripts as the published line. The candidate is staged as <stage>/windows so every existing
# script keeps its repository-relative paths. Manual only; there is no publish job.

on:
  workflow_dispatch:

concurrency:
  group: facility-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Stage the win.9 candidate as the windows tree
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item Source/windows stage/windows -Recurse
          Copy-Item tools stage/tools -Recurse
          New-Item -ItemType Directory stage/docs | Out-Null
          Copy-Item docs/tutorial stage/docs/tutorial -Recurse
          Copy-Item docs/examples stage/docs/examples -Recurse
          Copy-Item LICENSE, LICENSE_GUIDE.md, LICENSE_LEGACY_MIT, THIRD_PARTY_NOTICES.md stage/
      - name: Install hash-locked build dependencies and the independent psychrometric reference
        working-directory: stage
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r windows/winrelease/requirements.lock.txt
          python -m pip install psychrolib==2.5.0
      - name: Engineering, regression and stress checks
        working-directory: stage
        run: |
          function Invoke-CheckedPython {
            & python @args
            if ($LASTEXITCODE -ne 0) {
              throw "Validation failed (exit $LASTEXITCODE): $($args -join ' ')"
            }
          }
          Invoke-CheckedPython windows/tests/electrical_units.py --gui
          Invoke-CheckedPython windows/tests/lighting_presets.py --gui
          Invoke-CheckedPython windows/tests/audit_regressions.py --gui --output "$env:RUNNER_TEMP/audit-regressions.json"
          Invoke-CheckedPython -X utf8=0 windows/tests/report_regressions.py --gui --output "$env:RUNNER_TEMP/report-regressions.json"
          Invoke-CheckedPython windows/tests/regression.py
          Invoke-CheckedPython windows/tests/v55_features.py
          Invoke-CheckedPython windows/tests/v552_core.py
          Invoke-CheckedPython windows/tests/simple_features.py
          Invoke-CheckedPython windows/tests/v554_features.py
          Invoke-CheckedPython windows/tests/v556_features.py
          Invoke-CheckedPython windows/tests/v557_inactive.py
          Invoke-CheckedPython windows/tests/v558_review.py
          Invoke-CheckedPython windows/tests/v559_resilience.py
          Invoke-CheckedPython windows/tests/v5510_keypad.py
          Invoke-CheckedPython windows/tests/v560_features.py
          Invoke-CheckedPython windows/tests/reference_psychrometrics.py
          Invoke-CheckedPython windows/tests/airflow_guard_checks.py
          Invoke-CheckedPython windows/tests/optional_inputs_checks.py
          Invoke-CheckedPython windows/tests/panel_demand_checks.py
          Invoke-CheckedPython windows/tests/c2_coil_feasibility_checks.py
          Invoke-CheckedPython windows/tests/winter_terminal_heat_checks.py
          Invoke-CheckedPython windows/tests/ahu_link_boundary_checks.py
          Invoke-CheckedPython windows/tests/fluid_adoption_checks.py
          Invoke-CheckedPython windows/tests/fluid_selection_history_checks.py
          Invoke-CheckedPython windows/tests/ui_theme_and_actions_checks.py
          Invoke-CheckedPython windows/tests/text_clipping_checks.py
          Invoke-CheckedPython windows/tests/stress100.py --output "$env:RUNNER_TEMP/win-native-stress-source.json"
          Invoke-CheckedPython windows/tests/maintenance_checks.py
          Invoke-CheckedPython windows/tests/security_checks.py
          Invoke-CheckedPython windows/tests/bilingual.py
          Invoke-CheckedPython tools/verify_stress_io.py
          Invoke-CheckedPython tools/cleanroom100_stress.py --source . --platform windows --manifest "$env:RUNNER_TEMP/cleanroom100.json" --generate --seed 20261013
          Invoke-CheckedPython tools/cleanroom100_stress.py --source . --platform windows --manifest "$env:RUNNER_TEMP/cleanroom100.json" --output "$env:RUNNER_TEMP/cleanroom100-windows.json" --repeat 20
          Invoke-CheckedPython tools/verify_use_cases.py --platform windows --output "$env:RUNNER_TEMP/win-use-cases.json"
          Invoke-CheckedPython tools/verify_engineering_dashboard.py --platform windows --output "$env:RUNNER_TEMP/win-dashboard-boundaries.json"
          Invoke-CheckedPython tools/verify_gemini_review.py --platform windows --output "$env:RUNNER_TEMP/gemini-review-windows.json"
          Invoke-CheckedPython tools/verify_dashboard_reports.py --platform windows --output "$env:RUNNER_TEMP/win-dashboard-reports.json"
      - name: Engineering scenario suite (20 cases, 5 sweeps) and priority defects
        working-directory: stage/windows
        run: |
          python tests/engineering_scenarios/run_scenarios.py
          if ($LASTEXITCODE -ne 0) { throw "scenario suite reported a FAIL" }
          python tests/engineering_scenarios/priority_defects.py
          Copy-Item tests/engineering_scenarios/results.json, tests/engineering_scenarios/priority_defects.json "$env:RUNNER_TEMP/"
        continue-on-error: true
      - name: Audits not yet adapted to the win.9 defaults (informational, never counted as passed)
        working-directory: stage
        continue-on-error: true
        run: |
          python tools/verify_100x_all_fields_and_reports.py --platform windows --iterations 100 --output "$env:RUNNER_TEMP/all-fields-windows.json"
          if ($LASTEXITCODE -ne 0) { throw "verify_100x not adapted" }
          python docs/tutorial/verify_tutorial.py --platform windows --output "$env:RUNNER_TEMP/tutorial-windows.json"
          if ($LASTEXITCODE -ne 0) { throw "verify_tutorial not adapted" }
      - name: Build the standalone windowed EXE and complete offline ZIP
        run: python -m winrelease.build --output "$env:RUNNER_TEMP/windows-offline"
        working-directory: stage/windows
      - name: Native execution with external Python hidden and outbound traffic blocked
        run: python -m winrelease.verify --assets "$env:RUNNER_TEMP/windows-offline" --output "$env:RUNNER_TEMP/windows-offline/evidence/native"
        working-directory: stage/windows
      - name: Retain build and native acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win9-build-evidence
          path: |
            ${{ runner.temp }}/windows-offline/evidence
            stage/windows/evidence/*.json
            ${{ runner.temp }}/tutorial-windows.json
            ${{ runner.temp }}/win-use-cases.json
            ${{ runner.temp }}/win-native-stress-source.json
            ${{ runner.temp }}/audit-regressions.json
            ${{ runner.temp }}/report-regressions.json
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/priority_defects.json
            ${{ runner.temp }}/all-fields-*.json
            ${{ runner.temp }}/gemini-review-*.json
            ${{ runner.temp }}/cleanroom100*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain native-tested distribution files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win9-delivery
          path: |
            ${{ runner.temp }}/windows-offline/Facility_Studio_V5_6_0_Windows_Offline.exe
            ${{ runner.temp }}/windows-offline/Facility_Studio_V5_6_0_Windows_Offline_OneClick.zip
            ${{ runner.temp }}/windows-offline/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: win9-delivery
          path: ${{ runner.temp }}/windows-offline
      - name: Execute identical delivered files on a second native Windows environment
        run: python -m winrelease.verify --assets "$env:RUNNER_TEMP/windows-offline" --output "$env:RUNNER_TEMP/win9-clean-evidence"
        working-directory: Source/windows
      - name: Retain second native Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: win9-second-windows-evidence
          path: ${{ runner.temp }}/win9-clean-evidence
          if-no-files-found: warn
          retention-days: 14
