name: Engineering dashboard source checks

on:
  push:
    paths:
      - .github/workflows/engineering-dashboard-checks.yml
      - windows/facility_studio/**
      - windows/tests/**
      - windows/installer/**
      - windows/nsis_integrity.py
      - windows/Facility_Studio_V5_5_4_Setup.exe
      - macos/facility_studio/**
      - macos/tests/**
      - tools/verify_engineering_dashboard.py
      - tools/verify_dashboard_reports.py
      - tools/verify_dashboard_gui.py
      - tools/verify_gemini_review.py
      - tools/verify_100x_all_fields_and_reports.py
      - tools/cleanroom100_stress.py
      - docs/development.md
  pull_request:
    paths:
      - .github/workflows/engineering-dashboard-checks.yml
      - windows/facility_studio/**
      - windows/tests/**
      - windows/installer/**
      - windows/nsis_integrity.py
      - windows/Facility_Studio_V5_5_4_Setup.exe
      - macos/facility_studio/**
      - macos/tests/**
      - tools/verify_engineering_dashboard.py
      - tools/verify_dashboard_reports.py
      - tools/verify_dashboard_gui.py
      - tools/verify_gemini_review.py
      - tools/verify_100x_all_fields_and_reports.py
      - tools/cleanroom100_stress.py
      - docs/development.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: ${{ matrix.source }} source on Linux / Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source: [windows, macos]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Isolate source-check preferences
        shell: bash
        run: printf 'FACILITY_STUDIO_PREFERENCES=%s\n' "$RUNNER_TEMP/facility-source-preferences.json" >> "$GITHUB_ENV"
      - name: Install Tk, virtual display and CJK fonts for source checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-tk xvfb xauth fonts-noto-cjk
          python -c "import tkinter; print('Tk import version:', tkinter.TkVersion)"
      - name: Independent engineering boundaries and executive reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engineering-dashboard/legacy"
          python tools/verify_engineering_dashboard.py --platform "${{ matrix.source }}" --output "$RUNNER_TEMP/engineering-dashboard/boundaries.json"
          python tools/verify_gemini_review.py --platform "${{ matrix.source }}" --output "$RUNNER_TEMP/engineering-dashboard/independent-review.json"
          python tools/verify_100x_all_fields_and_reports.py --platform "${{ matrix.source }}" --iterations 100 --output "$RUNNER_TEMP/engineering-dashboard/all-fields-100.json"
          python tools/verify_dashboard_reports.py --platform "${{ matrix.source }}" --output "$RUNNER_TEMP/engineering-dashboard/reports.json" --artifacts-dir "$RUNNER_TEMP/engineering-dashboard/html"
          python docs/tutorial/verify_tutorial.py --platform "${{ matrix.source }}" --output "$RUNNER_TEMP/engineering-dashboard/tutorial.json"
      - name: Existing source regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.source }}/evidence" "$RUNNER_TEMP/engineering-dashboard/legacy"
          for suite in simple_features regression v560_features v557_inactive v558_review v559_resilience bilingual security_checks; do
            python "${{ matrix.source }}/tests/$suite.py" 2>&1 | tee "$RUNNER_TEMP/engineering-dashboard/legacy/$suite.log"
          done
      - name: Historical Windows installer integrity fixtures
        if: matrix.source == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          python windows/tests/packaging_checks.py
          python windows/tests/installer_integrity_checks.py 2>&1 | tee "$RUNNER_TEMP/engineering-dashboard/legacy/installer_integrity_checks.log"
      - name: Linux Tk source smoke under a virtual display
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python "${{ matrix.source }}/tests/electrical_units.py" --gui
          xvfb-run -a -s "-screen 0 1920x1440x24" python tools/verify_dashboard_gui.py --platform "${{ matrix.source }}" --output "$RUNNER_TEMP/engineering-dashboard/gui-source-smoke.json" 2>&1 | tee "$RUNNER_TEMP/engineering-dashboard/gui-source-smoke.log"
      - name: Windows report semantic and export regressions
        if: matrix.source == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python windows/tests/report_regressions.py --gui --output "$RUNNER_TEMP/engineering-dashboard/report-regressions.json"
      - name: Retain source-check evidence and generated HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engineering-dashboard-${{ matrix.source }}-source
          path: ${{ runner.temp }}/engineering-dashboard
          if-no-files-found: warn
          retention-days: 14
