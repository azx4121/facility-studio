name: Investigate Tcl fd versus sys capture
on:
  push:
    branches: ['validation/facs-v22-windows-20261108']
    paths: ['.validation/facs-v22-capture/**', '.github/workflows/probe-tcl-capture.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify and reconstruct the sealed v22 source
        shell: pwsh
        run: python .validation/facs-v22-reviewed/run_reviewed_validation.py prepare
      - name: Install the documented Python 3.12.16 and locked dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.13.6
          if ($LASTEXITCODE -ne 0) { throw 'uv setup failed' }
          $env:UV_PYTHON_INSTALL_DIR = "$env:RUNNER_TEMP/facility-managed-python"
          uv venv --python 3.12.16 "$env:RUNNER_TEMP/facility-env"
          if ($LASTEXITCODE -ne 0) { throw 'Python setup failed' }
          $py = "$env:RUNNER_TEMP/facility-env/Scripts/python.exe"
          uv pip install --python $py -r "$env:RUNNER_TEMP/facs-v22-exact-source/integration/requirements.lock.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency install failed' }
          uv pip check --python $py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency verification failed' }
          "FACILITY_PY=$py" >> $env:GITHUB_ENV
      - name: Compare identical Tk and Tcl cases under both capture modes
        shell: pwsh
        run: |
          & $env:FACILITY_PY .validation/facs-v22-capture/run_tcl_capture_ab.py --source "$env:RUNNER_TEMP/facs-v22-exact-source" --output "$env:RUNNER_TEMP/facs-v22-evidence/capture-ab" --rounds 3 --count 50 --source-groups isolated module-context --budget-seconds 840
          if ($LASTEXITCODE -ne 0) { throw 'One or both capture arms failed; retain every outcome' }
      - name: Retain failures and source identity without publishing a binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-tcl-capture-ab-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/facs-v22-evidence/**
            !${{ runner.temp }}/facs-v22-evidence/source-v22.zip
          retention-days: 14
          if-no-files-found: error
