# Retirement for the temporary publication or completed private-transfer writer.
# Apply only to this task's branch, using an exact expected-head lease. Not main.
name: Completed Windows validation and publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  completed:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - run: echo 'This one-time task has retired its publication and draft-write capability.'
# No push trigger, token-bearing action, write job, checkout, or publication code.
