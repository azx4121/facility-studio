# Historical pipeline retired before formal 5.7.3 integration.
# No push/tag/PR trigger, checkout, native verifier, artifact or publisher.
name: Retired macOS 5.6 native release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse the historical pipeline
        run: |
          echo "This 5.6 pipeline is retired. Use the current 5.7.3 release gate documented in docs/development.md."
          echo "No software was built, tested or published."
          exit 1
