name: Build and verify macOS revision

on:
  push:
    branches: [main, feature/bilingual-ui, maintenance/macos-launch-repair, codex/v5.5.7-usability-sync]
    paths:
      - .github/workflows/macos-native-release.yml
      - macos/macos/**
      - macos/facility_studio/**
      - macos/README_macOS.txt
      - macos/MAC_RUNTIME_PATCHES.md
      - macos/tests/**
      - docs/tutorial/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select a pinned Python with Tk for source storage regressions
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Language and engineering checks
        run: |
          python3 -c "import tkinter; print('Source Tcl/Tk:', tkinter.Tcl().eval('info patchlevel'))"
          python3 macos/tests/bilingual.py
          python3 macos/tests/v556_features.py
          python3 macos/tests/v557_inactive.py
          python3 macos/tests/v558_review.py
          python3 macos/tests/regression.py
          python3 macos/tests/security_checks.py
          python3 docs/tutorial/verify_tutorial.py --platform macos --output "$RUNNER_TEMP/tutorial-macos.json"
          python3 tools/verify_use_cases.py --platform macos --output "$RUNNER_TEMP/mac-use-cases.json"
      - name: Build, sign and execute Universal App on Apple Silicon
        run: python3 macos/macos/build_native_release.py --output "$RUNNER_TEMP/mac558-build"
      - name: Retain Apple Silicon evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac558-arm64-evidence
          path: |
            ${{ runner.temp }}/mac558-build/evidence
            macos/evidence/*.json
            ${{ runner.temp }}/tutorial-macos.json
            ${{ runner.temp }}/mac-use-cases.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain tested delivery files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac558-delivery
          path: |
            ${{ runner.temp }}/mac558-build/Facility_Studio_V5_5_8_macOS_mac1_OneClick.zip
            ${{ runner.temp }}/mac558-build/Facility_Studio_V5_5_8_macOS_mac1.dmg
            ${{ runner.temp }}/mac558-build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  verify-intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mac558-delivery
          path: ${{ runner.temp }}/mac558-delivery
      - name: Execute the same delivered ZIP and DMG on Intel
        run: >-
          python3 macos/macos/verify_native_release.py
          --package "$RUNNER_TEMP/mac558-delivery/Facility_Studio_V5_5_8_macOS_mac1_OneClick.zip"
          --checksums "$RUNNER_TEMP/mac558-delivery/SHA256SUMS.txt"
          --dmg "$RUNNER_TEMP/mac558-delivery/Facility_Studio_V5_5_8_macOS_mac1.dmg"
          --output "$RUNNER_TEMP/mac558-intel"
      - name: Retain Intel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mac558-intel-evidence
          path: |
            ${{ runner.temp }}/mac558-intel/*.txt
            ${{ runner.temp }}/mac558-intel/*.json
            ${{ runner.temp }}/mac558-intel/*.png
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: [build, verify-intel]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mac558-delivery
          path: ${{ runner.temp }}/mac558-delivery
      - name: Publish a new revision after both native checks pass
        env:
          FACILITY_GITHUB_TOKEN: ${{ github.token }}
          FACILITY_RELEASE_COMMIT: ${{ github.sha }}
        run: python3 macos/macos/publish_mac_release.py --assets "$RUNNER_TEMP/mac558-delivery"
