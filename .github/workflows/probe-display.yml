name: Measure native Windows client geometry
on:
  push:
    branches: ['validation/facs-v22-windows-20261108']
    paths: ['.validation/facs-v22-display/**', '.github/workflows/probe-display.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Measure real screen and identical clients at different origins
        shell: pwsh
        run: |
          python -m pip install uv==0.13.6
          if ($LASTEXITCODE -ne 0) { throw 'uv setup failed' }
          uv run --no-project --python 3.12.16 python .validation/facs-v22-display/probe_display.py "$env:RUNNER_TEMP/display-measurements.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native geometry probe failed' }
      - name: Preserve physical measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-display-measurements-${{ matrix.os }}
          path: ${{ runner.temp }}/display-measurements.json
          retention-days: 14
          if-no-files-found: error
