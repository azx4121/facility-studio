name: v22 extended single EXE checks without publication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-only:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Reconstruct verified original source and packaging-only overlay
        shell: pwsh
        run: python .validation/facs-v22-reviewed/run_reviewed_validation.py prepare
      - name: Install supported runtime and locked dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.13.6
          if ($LASTEXITCODE -ne 0) { throw 'uv setup failed' }
          $env:UV_PYTHON_INSTALL_DIR = "$env:RUNNER_TEMP/facility-managed-python"
          uv venv --python 3.12.16 "$env:RUNNER_TEMP/facility-env"
          if ($LASTEXITCODE -ne 0) { throw 'Python setup failed' }
          $py = "$env:RUNNER_TEMP/facility-env/Scripts/python.exe"
          uv pip install --python $py -r "$env:RUNNER_TEMP/facs-v22-exact-source/integration/requirements.lock.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency install failed' }
          uv pip check --python $py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency verification failed' }
          "FACILITY_PY=$py" >> $env:GITHUB_ENV
      - name: Build single EXE and run frozen suites, external CLI, visible startup capture
        shell: pwsh
        run: |
          & $env:FACILITY_PY .validation/facs-v22-reviewed/native_diagnostics/windows_display.py --width 1920 --height 1080 --client 800x600 --evidence "$env:RUNNER_TEMP/facs-v22-evidence/extended-display.json" -- $env:FACILITY_PY .validation/facs-v22-extended/build_reviewed_candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build or frozen acceptance failed; do not publish' }
      - name: Retain diagnostics only, never the executable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-extended-frozen-diagnostics-windows-2022
          path: |
            ${{ runner.temp }}/facs-v22-evidence/**
            !${{ runner.temp }}/facs-v22-evidence/source-v22.zip
            ${{ runner.temp }}/facs-v22-extended-build/evidence/**
            !${{ runner.temp }}/**/*.exe
          retention-days: 14
          if-no-files-found: error
