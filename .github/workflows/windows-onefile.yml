name: Windows single-file EXE candidate
on:
  push:
    branches: ['codex/windows-single-file-20261104']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-onefile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows-2022:
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install supported standalone Python and locked build dependencies
        shell: bash
        run: |
          python -m pip install uv==0.13.6
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/onefile-managed-python"
          uv venv --python 3.12.16 "$RUNNER_TEMP/onefile-env"
          ONEFILE_PY="$RUNNER_TEMP/onefile-env/Scripts/python.exe"
          uv pip install --python "$ONEFILE_PY" -r integration/requirements.lock.txt
          uv pip check --python "$ONEFILE_PY"
          echo "ONEFILE_PY=$ONEFILE_PY" >> "$GITHUB_ENV"
      - name: Packaging, provenance and isolated entry regression checks
        shell: bash
        run: '"$ONEFILE_PY" -m pytest integration/test_source_provenance.py integration/test_acceptance_validation.py integration/test_release_identity.py integration/test_windows_onefile.py -q'
      - name: Build true single EXE and validate embedded resources and frozen acceptance
        shell: bash
        run: '"$ONEFILE_PY" integration/build.py --windows-onefile --output "$RUNNER_TEMP/onefile-build"'
      - name: Test downloaded-style single EXE with no external Python in Unicode directory
        shell: pwsh
        run: ./integration/verify_windows_onefile.ps1 -Delivery "$env:RUNNER_TEMP/onefile-build" -Evidence "$env:RUNNER_TEMP/onefile-verify" -ExpectedCommit '${{ github.sha }}'
      - name: Independently bind runtime evidence to checkout source hashes
        shell: bash
        run: '"$ONEFILE_PY" integration/validate_onefile_evidence.py --evidence "$RUNNER_TEMP/onefile-verify" --commit "${{ github.sha }}"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-onefile-2022-evidence
          path: |
            ${{ runner.temp }}/onefile-build/evidence
            ${{ runner.temp }}/onefile-verify
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Facility-Studio-5.7.3-Windows-x64-Single-EXE
          path: |
            ${{ runner.temp }}/onefile-build/Facility Studio 5.7.3.exe
            ${{ runner.temp }}/onefile-build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  same-exe-windows-2025:
    needs: build-windows-2022
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Facility-Studio-5.7.3-Windows-x64-Single-EXE
          path: ${{ runner.temp }}/onefile-delivery
      - name: Verify identical single EXE without development runtime in PATH
        shell: pwsh
        run: ./integration/verify_windows_onefile.ps1 -Delivery "$env:RUNNER_TEMP/onefile-delivery" -Evidence "$env:RUNNER_TEMP/onefile-verify" -ExpectedCommit '${{ github.sha }}'
      - name: Independently validate exact-checkout provenance without third-party dependencies
        shell: pwsh
        run: python integration/validate_onefile_evidence.py --evidence "$env:RUNNER_TEMP/onefile-verify" --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-onefile-2025-evidence
          path: ${{ runner.temp }}/onefile-verify
          retention-days: 30
