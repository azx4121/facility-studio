name: FEED Windows sandbox
on:
  pull_request:
    paths:
      - '.github/workflows/feed-windows-sandbox.yml'
      - 'windows/**'
      - 'macos/facility_studio/**'
      - 'docs/feed-windows-sandbox.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feed-windows-sandbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      FACILITY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Install official hash-locked native build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --require-hashes --only-binary=:all: -r windows/winrelease/requirements.lock.txt
          if ($LASTEXITCODE) { throw 'Base dependency verification failed' }
          python -m pip install --require-hashes --no-build-isolation -r windows/winrelease/requirements_sandbox.lock.txt
          if ($LASTEXITCODE) { throw 'Sandbox dependency verification failed' }
          python -m pip install pytest==9.2.0 hypothesis==6.170.14
          if ($LASTEXITCODE) { throw 'Test dependency installation failed' }
          python -m pip check
          if ($LASTEXITCODE) { throw 'Dependency consistency failed' }
      - name: Analytical cases, boundary properties and real Windows Tk
        shell: pwsh
        run: |
          "FACILITY_STUDIO_PREFERENCES=$env:RUNNER_TEMP/windows-sandbox-source/preferences.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:FACILITY_STUDIO_PREFERENCES = "$env:RUNNER_TEMP/windows-sandbox-source/preferences.json"
          python -m pytest windows/tests/test_feed_sandbox.py -q --hypothesis-show-statistics --junitxml="$env:RUNNER_TEMP/windows-sandbox-source/pytest.xml"
          if ($LASTEXITCODE) { throw 'Sandbox source tests failed' }
          python windows/winrelease/source_sandbox_checks.py --output "$env:RUNNER_TEMP/windows-sandbox-source"
          if ($LASTEXITCODE) { throw 'Existing Windows regression failed' }
      - name: Build offline EXE, Traditional Chinese installer and portable ZIP
        working-directory: windows
        run: |
          python -m winrelease.build_sandbox --output "$env:RUNNER_TEMP/windows-feed-delivery"
          if ($LASTEXITCODE) { throw 'Native sandbox build failed' }
      - name: Execute installer and frozen runtime with external Python hidden
        working-directory: windows
        run: |
          python -m winrelease.verify_sandbox --assets "$env:RUNNER_TEMP/windows-feed-delivery" --output "$env:RUNNER_TEMP/windows-feed-native-2022"
          if ($LASTEXITCODE) { throw 'Native installer verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feed-windows-2022-evidence
          path: |
            ${{ runner.temp }}/windows-sandbox-source
            ${{ runner.temp }}/windows-feed-delivery/evidence
            ${{ runner.temp }}/windows-feed-native-2022
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed-windows-delivery
          path: |
            ${{ runner.temp }}/windows-feed-delivery/Facility_Studio_FEED_Sandbox_5_6_1.exe
            ${{ runner.temp }}/windows-feed-delivery/Facility_Studio_FEED_Sandbox_5_6_1_Setup.exe
            ${{ runner.temp }}/windows-feed-delivery/Facility_Studio_FEED_Sandbox_5_6_1_Portable.zip
            ${{ runner.temp }}/windows-feed-delivery/SHA256SUMS.txt
            ${{ runner.temp }}/windows-feed-delivery/README_Windows_繁體中文.txt
          if-no-files-found: error
          retention-days: 14
  verify-second-windows:
    needs: build-and-test
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: feed-windows-delivery
          path: ${{ runner.temp }}/windows-feed-delivery
      - name: Install and execute exactly the same hash-verified payload
        working-directory: windows
        run: |
          python -m winrelease.verify_sandbox --assets "$env:RUNNER_TEMP/windows-feed-delivery" --output "$env:RUNNER_TEMP/windows-feed-native-2025"
          if ($LASTEXITCODE) { throw 'Second native Windows verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feed-windows-2025-evidence
          path: ${{ runner.temp }}/windows-feed-native-2025
          retention-days: 14
