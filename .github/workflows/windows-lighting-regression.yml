name: Windows lighting and engineering audit regressions

on:
  push:
    branches: [main, fix/windows-lighting-f07, fix/windows-audit-six, codex/win8-report-audit, dot/guardrail-integration-20261103]
    paths:
      - .github/workflows/windows-lighting-regression.yml
      - windows/facility_studio/**
      - integration/requirements.lock.txt
      - integration/requirements-runtime.in
      - integration/test_cli_encoding.py
      - integration/test_capacity_*.py
      - integration/test_tutorial_launch.py
      - docs/tutorial/**
      - windows/tests/lighting_presets.py
      - windows/tests/lighting_reports.py
      - windows/tests/photometry_formats.py
      - windows/tests/lighting_direct_checks.py
      - windows/tests/audit_regressions.py
      - windows/tests/report_regressions.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighting:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install supported native runtime and locked dependencies
        shell: bash
        run: |
          python -m pip install uv==0.13.6
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/facility-managed-python"
          uv venv --python 3.12.16 "$RUNNER_TEMP/facility-env"
          FACILITY_PY="$(python -c "import os,pathlib; print((pathlib.Path(os.environ['RUNNER_TEMP']) / 'facility-env/Scripts/python.exe').as_posix())")"
          uv pip install --python "$FACILITY_PY" -r integration/requirements.lock.txt
          uv pip check --python "$FACILITY_PY"
          echo "FACILITY_PY=$FACILITY_PY" >> "$GITHUB_ENV"
      - name: Verify independent formulas and real lighting widgets
        run: |
          & $env:FACILITY_PY windows/tests/lighting_presets.py --gui
          if ($LASTEXITCODE -ne 0) { throw "Lighting regression failed" }
          & $env:FACILITY_PY -X utf8=0 windows/tests/lighting_reports.py
          if ($LASTEXITCODE -ne 0) { throw "Lighting report regression failed" }
          & $env:FACILITY_PY -X utf8=0 windows/tests/photometry_formats.py
          if ($LASTEXITCODE -ne 0) { throw "Photometry import regression failed" }
          $env:FACILITY_DIRECT_GUI = "1"
          & $env:FACILITY_PY -X utf8=0 windows/tests/lighting_direct_checks.py
          if ($LASTEXITCODE -ne 0) { throw "Direct lighting regression failed" }
          Remove-Item Env:FACILITY_DIRECT_GUI
      - name: Verify Unicode CLI, capacity planning and tutorial launch contracts
        env:
          FACILITY_TEST_PLATFORM: windows
          FACILITY_REQUIRE_DISPLAY: '1'
        run: |
          & $env:FACILITY_PY -X utf8=0 -m pytest integration/test_cli_encoding.py integration/test_capacity_planning.py integration/test_capacity_controller.py integration/test_capacity_gui.py integration/test_tutorial_launch.py -q --junitxml="$env:RUNNER_TEMP/native-candidate.xml"
          if ($LASTEXITCODE -ne 0) { throw "CLI and candidate regression failed" }
      - name: Verify F01–F06 physical boundaries and real workspaces
        run: |
          & $env:FACILITY_PY windows/tests/audit_regressions.py --gui --output "$env:RUNNER_TEMP/audit-regressions.json"
          if ($LASTEXITCODE -ne 0) { throw "Engineering audit regression failed" }
      - name: Verify report intent, units, revision and actual export buttons
        run: |
          & $env:FACILITY_PY docs/tutorial/verify_tutorial.py --platform windows --output "$env:RUNNER_TEMP/tutorial.json"
          if ($LASTEXITCODE -ne 0) { throw "Tutorial regression failed" }
          & $env:FACILITY_PY -X utf8=0 windows/tests/report_regressions.py --gui --output "$env:RUNNER_TEMP/report-regressions.json"
          if ($LASTEXITCODE -ne 0) { throw "Report regression failed" }
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-regressions-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-candidate.xml
            ${{ runner.temp }}/audit-regressions.json
            ${{ runner.temp }}/report-regressions.json
            ${{ runner.temp }}/report-samples
            ${{ runner.temp }}/tutorial.json
          if-no-files-found: warn
