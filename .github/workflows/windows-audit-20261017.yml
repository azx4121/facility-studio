name: Windows focused audit 2026-10-17

on:
  push:
    branches: [audit/windows-20261017]
    paths:
      - audit/windows_deep_audit.py
      - .github/workflows/windows-audit-20261017.yml

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.runner }} audit; findings retained
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Install locked dependencies for the source audit only
        run: python -m pip install --require-hashes --only-binary=:all: -r windows/winrelease/requirements.lock.txt
      - name: Download the already published EXE and verify its exact identity
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'Facility_Studio_V5_6_0_Windows_Offline.exe'
          url='https://github.com/azx4121/facility-studio/releases/download/v5.6.0-win.4/Facility_Studio_V5_6_0_Windows_Offline.exe'
          with urllib.request.urlopen(url,timeout=60) as r:p.write_bytes(r.read())
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha=='49a04498b8353f4ef1f0d202de48576af925502dff202c232d2356b02a48a802',sha
          print('Published EXE identity verified:',sha,p.stat().st_size)
      - name: Record independent formulas, actual Tk paths and exact delivered EXE behavior
        run: python audit/windows_deep_audit.py --gui --exe "$env:RUNNER_TEMP/Facility_Studio_V5_6_0_Windows_Offline.exe" --output "$env:RUNNER_TEMP/windows-audit"
      - name: Retain all check results, defect reproductions and offline native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-audit-20261017-${{ matrix.runner }}
          path: ${{ runner.temp }}/windows-audit
          if-no-files-found: error
          retention-days: 30

# Audit completion is separate from product checks passing. audit-results.json
# explicitly lists product_all_checks_passed=false and every reproduced defect.
# No build, release, tag, main-branch write, or Mac operation is performed.
