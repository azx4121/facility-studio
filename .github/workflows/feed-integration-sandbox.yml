name: FEED integration sandbox
on:
  pull_request:
    paths:
      - '.github/workflows/feed-integration-sandbox.yml'
      - 'macos/facility_studio/**'
      - 'macos/tests/test_feed_sandbox.py'
      - 'macos/tests/python_hvac_reference.py'
      - 'macos/macos/**'
      - 'docs/feed-sandbox.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feed-sandbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical-and-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: macos
      MPLBACKEND: Agg
      FACILITY_STUDIO_PREFERENCES: /tmp/facility-feed-sandbox-preferences.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install pinned verification tools and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-tk xvfb xauth fonts-noto-cjk
          python -m pip install -r macos/macos/requirements_feed_sandbox.txt pytest==9.2.0 hypothesis==6.170.14 ruff==0.17.3 matplotlib==3.10.8 numpy==2.5.3 pillow==12.3.0
          python -m pip check
      - name: Analytical fixtures, properties, stale-state and GUI regressions
        run: |
          mkdir -p sandbox-evidence
          xvfb-run -a python -m pytest macos/tests/test_feed_sandbox.py -q --hypothesis-show-statistics --junitxml=sandbox-evidence/pytest.xml > sandbox-evidence/pytest.log 2>&1
          cat sandbox-evidence/pytest.log
          ruff check --select F,E9 macos/facility_studio/{engineering_verification,feed_review_preview,sandbox_ui,sandbox_selftest}.py macos/tests/test_feed_sandbox.py macos/macos/{build_feed_sandbox,prepare_feed_runtime,bootstrap_feed_sandbox}.py
      - name: Existing numerical, input and report regressions
        run: |
          python macos/tests/regression.py
          python macos/tests/security_checks.py
          python macos/tests/reference_psychrometrics.py
          python macos/tests/bilingual.py
          python macos/tests/v560_features.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feed-sandbox-numerical-and-gui
          path: sandbox-evidence
          retention-days: 14
  python-hvac-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Isolated python-hvac reference, no model/API calls
        run: |
          python -m pip install 'pint==0.24.4' 'CoolProp==8.0.0' 'git+https://github.com/TomLXXVI/python-hvac.git@94247560a667905bfbf67e45a58965a58254fce8'
          python -m pip check
          python macos/tests/python_hvac_reference.py
  native-universal-build:
    needs: numerical-and-gui
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build, sign and test isolated Universal App
        run: python3 macos/macos/build_feed_sandbox.py --output "$RUNNER_TEMP/feed-sandbox-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feed-sandbox-native-evidence
          path: ${{ runner.temp }}/feed-sandbox-build/evidence
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed-sandbox-delivery
          path: |
            ${{ runner.temp }}/feed-sandbox-build/Facility-Studio-FEED-Sandbox-5.6.1-1.zip
            ${{ runner.temp }}/feed-sandbox-build/Facility-Studio-FEED-Sandbox-5.6.1-1.dmg
            ${{ runner.temp }}/feed-sandbox-build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  native-intel-delivery:
    needs: native-universal-build
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: feed-sandbox-delivery
          path: ${{ runner.temp }}/delivery
      - name: Verify and execute the same Universal delivery on Intel
        env:
          FACILITY_STUDIO_SANDBOX_DATA: ${{ runner.temp }}/intel-data
        run: |
          cd "$RUNNER_TEMP/delivery"
          shasum -a 256 -c SHA256SUMS.txt
          hdiutil verify Facility-Studio-FEED-Sandbox-5.6.1-1.dmg
          ditto -x -k Facility-Studio-FEED-Sandbox-5.6.1-1.zip "$RUNNER_TEMP/intel-app"
          APP="$RUNNER_TEMP/intel-app/Facility Studio 工程驗證沙盒.app"
          mkdir -p "$RUNNER_TEMP/intel-evidence"
          codesign --verify --deep --strict "$APP"
          "$APP/Contents/MacOS/FacilityStudio" --sandbox-self-test "$RUNNER_TEMP/intel-evidence/Sandbox_Acceptance.json" > "$RUNNER_TEMP/intel-evidence/sandbox-native.log" 2>&1
          "$APP/Contents/MacOS/FacilityStudio" --self-test > "$RUNNER_TEMP/intel-evidence/full-native.log" 2>&1
          cp "$RUNNER_TEMP/intel-data/Mac_Acceptance.json" "$RUNNER_TEMP/intel-evidence/"
          codesign --verify --deep --strict "$APP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: feed-sandbox-intel-evidence
          path: ${{ runner.temp }}/intel-evidence
          retention-days: 14
