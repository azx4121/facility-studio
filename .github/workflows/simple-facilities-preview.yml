name: Simple facilities preview validation
on:
  push:
    branches: ['sandbox/simple-facilities-20261102', 'sandbox/feed-readiness-20261103', 'dot/guardrail-integration-20261103']
    paths:
      - '.github/workflows/simple-facilities-preview.yml'
      - 'macos/facility_studio/**'
      - 'windows/facility_studio/**'
      - 'integration/**'
      - 'docs/tutorial/**'
      - 'tools/verify_tutorial_navigation.cjs'
      - 'windows/tests/photometry_formats.py'
      - 'windows/tests/lighting_direct_checks.py'
      - 'macos/tests/photometry_formats.py'
      - 'macos/tests/lighting_direct_checks.py'
      - 'tools/verify_full_air_chart.py'
      - 'tools/verify_wetbulb_boundaries.py'
      - 'tools/verify_capacity_planning.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simple-facilities-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical-and-native-tk-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install locked runtime and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth fonts-noto-cjk
          python -m pip install -r integration/requirements.lock.txt
          python -m pip check
      - name: Numerical boundaries, conservation and generated cases
        run: |
          mkdir -p simple-evidence
          xvfb-run -a -s '-screen 0 1920x1440x24' python -m pytest integration/test_guardrails.py integration/test_release_identity.py integration/test_acceptance_validation.py integration/test_candidate_acceptance.py integration/test_language_lifecycle.py integration/test_tutorial_content.py integration/test_design_basis.py integration/test_design_basis_gui.py integration/test_pump_suction.py integration/test_liquid_phase_guardrails.py integration/test_simple_facilities.py integration/test_fusion.py integration/test_product_wording.py macos/tests/test_feed_sandbox.py -q --hypothesis-show-statistics --junitxml=simple-evidence/pytest.xml > simple-evidence/pytest.log 2>&1
          cat simple-evidence/pytest.log
          python tools/verify_platform_sync.py
          FACILITY_TEST_PLATFORM=macos FACILITY_REQUIRE_DISPLAY=1 xvfb-run -a -s '-screen 0 1920x1440x24' python -m pytest integration/test_capacity_planning.py integration/test_capacity_controller.py integration/test_capacity_gui.py -q --junitxml=simple-evidence/capacity-macos.xml
          FACILITY_TEST_PLATFORM=windows FACILITY_REQUIRE_DISPLAY=1 xvfb-run -a -s '-screen 0 1920x1440x24' python -m pytest integration/test_capacity_planning.py integration/test_capacity_controller.py integration/test_capacity_gui.py -q --junitxml=simple-evidence/capacity-windows.xml
          python tools/verify_capacity_planning.py --platform windows --output simple-evidence/capacity-examples
          python tools/verify_wetbulb_boundaries.py --platform macos --output simple-evidence/wetbulb-boundaries-macos.json
          python tools/verify_wetbulb_boundaries.py --platform windows --output simple-evidence/wetbulb-boundaries-windows.json
          python macos/tests/lighting_reports.py
          python windows/tests/lighting_reports.py
          python macos/tests/photometry_formats.py
          python windows/tests/photometry_formats.py
          FACILITY_DIRECT_GUI=1 xvfb-run -a -s '-screen 0 1920x1440x24' python macos/tests/lighting_direct_checks.py
          FACILITY_DIRECT_GUI=1 xvfb-run -a -s '-screen 0 1920x1440x24' python windows/tests/lighting_direct_checks.py
          xvfb-run -a -s '-screen 0 1920x1440x24' python tools/verify_full_air_chart.py --platform macos --gui --output simple-evidence/full-air-chart-macos.json
          xvfb-run -a -s '-screen 0 1920x1440x24' python tools/verify_full_air_chart.py --platform windows --gui --output simple-evidence/full-air-chart-windows.json
      - name: Complete existing engineering and interface regression
        env:
          FACILITY_STUDIO_PREFERENCES: /tmp/simple-full-preferences.json
          FACILITY_STUDIO_FUSION_DATA: /tmp/simple-full-data
          MPLBACKEND: Agg
        run: xvfb-run -a -s '-screen 0 1920x1440x24' python windows/winrelease/source_sandbox_checks.py --output simple-evidence/full
      - name: Actual simplified user journeys and synthetic UI
        env:
          PYTHONPATH: macos
          FACILITY_STUDIO_FUSION_DATA: /tmp/simple-facilities-data
          FACILITY_TEST_BLOCK_NETWORK: '1'
          FACILITY_CAPTURE_SYNTHETIC_UI: '1'
        run: xvfb-run -a -s '-screen 0 1440x1200x24' python integration/entry.py --facilities-self-test simple-evidence/Native_GUI.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: simple-facilities-preview-evidence
          path: simple-evidence
          retention-days: 14

  native-windows:
    needs: numerical-and-native-tk-source
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install supported native runtime and locked dependencies
        shell: bash
        run: |
          python -m pip install uv==0.13.6
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/facility-managed-python"
          uv venv --python 3.12.16 "$RUNNER_TEMP/facility-env"
          FACILITY_PY="$(python -c "import os,pathlib; print((pathlib.Path(os.environ['RUNNER_TEMP']) / 'facility-env/Scripts/python.exe').as_posix())")"
          uv pip install --python "$FACILITY_PY" -r integration/requirements.lock.txt
          uv pip check --python "$FACILITY_PY"
          echo "FACILITY_PY=$FACILITY_PY" >> "$GITHUB_ENV"
      - name: Existing engineering and actual Windows interface regression
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          export FACILITY_STUDIO_PREFERENCES="$RUNNER_TEMP/facility-native-preferences.json"
          export FACILITY_STUDIO_FUSION_DATA="$RUNNER_TEMP/facility-native-data"
          "$FACILITY_PY" windows/winrelease/source_sandbox_checks.py --output "$RUNNER_TEMP/facility-native-source"
          "$FACILITY_PY" windows/tests/lighting_reports.py
          FACILITY_TEST_PLATFORM=windows FACILITY_REQUIRE_DISPLAY=1 "$FACILITY_PY" -m pytest integration/test_capacity_planning.py integration/test_capacity_controller.py integration/test_capacity_gui.py -q --junitxml="$RUNNER_TEMP/facility-native-source/capacity.xml"
          "$FACILITY_PY" windows/tests/photometry_formats.py
          FACILITY_DIRECT_GUI=1 "$FACILITY_PY" windows/tests/lighting_direct_checks.py
          "$FACILITY_PY" tools/verify_wetbulb_boundaries.py --platform windows --output "$RUNNER_TEMP/facility-native-source/wetbulb-boundaries-windows.json"
          "$FACILITY_PY" tools/verify_full_air_chart.py --platform windows --gui --output "$RUNNER_TEMP/facility-native-source/full-air-chart-windows.json"
          "$FACILITY_PY" -m pytest integration/test_guardrails.py integration/test_liquid_phase_guardrails.py windows/tests/test_feed_sandbox.py -q --junitxml="$RUNNER_TEMP/facility-native-source/pytest.xml"
      - name: Build and test standalone executable and installer
        shell: bash
        run: '"$FACILITY_PY" integration/build.py --output "$RUNNER_TEMP/facility-build"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: facility-studio-Windows-evidence
          path: |
            ${{ runner.temp }}/facility-native-source
            ${{ runner.temp }}/facility-build/evidence
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: facility-studio-Windows-delivery
          path: |
            ${{ runner.temp }}/facility-build/*.zip
            ${{ runner.temp }}/facility-build/*Setup.exe
            ${{ runner.temp }}/facility-build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  second-windows-host:
    needs: native-windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: facility-studio-Windows-delivery
          path: ${{ runner.temp }}/facility-delivery
      - name: Verify the identical package without external Python on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verifierPython = (Get-Command python.exe).Source
          $delivery = "$env:RUNNER_TEMP/facility-delivery"
          $sums = Get-Content "$delivery/SHA256SUMS.txt"
          foreach ($file in Get-ChildItem $delivery -File | Where-Object { $_.Name -match '(\.zip|Setup\.exe)$' }) {
            $records = @($sums | Where-Object { $_.EndsWith('  ' + $file.Name) })
            if ($records.Count -ne 1) { throw 'Expected a unique SHA256 record' }
            if ((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $records[0].Substring(0,64)) { throw 'Delivery SHA256 mismatch' }
          }
          $zips = @(Get-ChildItem "$delivery/*.zip")
          if ($zips.Count -ne 1) { throw 'Expected one portable package' }
          Expand-Archive $zips[0].FullName "$env:RUNNER_TEMP/facility-extracted"
          $executables = @(Get-ChildItem "$env:RUNNER_TEMP/facility-extracted" -Filter 'Facility Studio 5.7.3 測試版.exe' -Recurse)
          if ($executables.Count -ne 1) { throw 'Expected one product executable' }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/facility-second-evidence" | Out-Null
          $env:FACILITY_STUDIO_FUSION_DATA = "$env:RUNNER_TEMP/facility-second-data"
          $env:FACILITY_TEST_BLOCK_NETWORK = '1'
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          foreach ($kind in @('fusion','facilities')) {
            $result = "$env:RUNNER_TEMP/facility-second-evidence/$kind.json"
            $process = Start-Process -FilePath $executables[0].FullName -ArgumentList @("--$kind-self-test", "`"$result`"") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Standalone acceptance exit $($process.ExitCode)" }
            $acceptance = Get-Content $result -Raw -Encoding UTF8 | ConvertFrom-Json
            if (-not $acceptance.passed -or -not $acceptance.frozen -or $acceptance.version -ne '5.7.3-preview.1' -or $acceptance.build_commit -ne $env:GITHUB_SHA) { throw 'Standalone acceptance failed' }
          }
          & $verifierPython -c "import os, pathlib, sys; sys.path.insert(0, 'integration'); from acceptance_validation import validate_acceptance, validate_embedded_manifest; base=pathlib.Path(os.environ['RUNNER_TEMP']); expected=os.environ['GITHUB_SHA']; executables=list((base/'facility-extracted').rglob('Facility Studio 5.7.3 測試版.exe')); assert len(executables)==1; validate_embedded_manifest(executables[0].parent,expected); [validate_acceptance(base/'facility-second-evidence'/(kind+'.json'),expected_commit=expected) for kind in ('fusion','facilities')]"
          if ($LASTEXITCODE) { throw 'Second-host portable identity or acceptance failed' }
          & $verifierPython -c "import os, pathlib, subprocess, sys; sys.path.insert(0, 'integration'); import windows_installer; base=pathlib.Path(os.environ['RUNNER_TEMP']); out=base/'facility-second-installer'; (out/'evidence').mkdir(parents=True); run=lambda args, log, env=None, timeout=180: subprocess.run([str(a) for a in args], env=env, timeout=timeout, stdout=log.open('w'), stderr=subprocess.STDOUT, check=True); setups=list((base/'facility-delivery').glob('*Setup.exe')); assert len(setups)==1; windows_installer.verify(setups[0],out,'Facility Studio 5.7.3 測試版',run,dict(os.environ),expected_commit=os.environ['GITHUB_SHA'])"
          if ($LASTEXITCODE) { throw 'Second-host installer verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: facility-studio-Windows-second-host-evidence
          path: |
            ${{ runner.temp }}/facility-second-evidence
            ${{ runner.temp }}/facility-second-installer/evidence
          retention-days: 14
