name: Windows lighting follow-up 2026-10-18
on:
  push:
    branches: [audit/windows-20261017]
    paths:
      - audit/lighting_followup.py
      - .github/workflows/windows-lighting-audit-20261018.yml
permissions:
  contents: read
jobs:
  lighting:
    name: ${{ matrix.runner }} lighting audit
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Install locked audit dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r windows/winrelease/requirements.lock.txt
      - name: Check lumen equations and invoke the actual lighting preset button
        run: python audit/lighting_followup.py --gui --output "$env:RUNNER_TEMP/lighting-audit"
      - name: Retain formula assertions and exact before and after UI inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-lighting-20261018-${{ matrix.runner }}
          path: ${{ runner.temp }}/lighting-audit/lighting-audit.json
          if-no-files-found: error
          retention-days: 30
