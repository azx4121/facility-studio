name: Reviewed v22 native Windows validation
on:
  push:
    branches: ['validation/facs-v22-windows-20261108']
    paths: ['.validation/facs-v22-reviewed/**', '.github/workflows/validate-v22-reviewed.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      FACILITY_REQUIRE_DISPLAY: '1'
      FACILITY_TEST_PLATFORM: windows
      PYTEST_ADDOPTS: '--capture=sys'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify exact v22 bytes and reviewed overlays with indexed modes
        shell: pwsh
        run: python .validation/facs-v22-reviewed/run_reviewed_validation.py prepare
      - name: Install supported runtime and locked dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.13.6
          if ($LASTEXITCODE -ne 0) { throw 'uv setup failed' }
          $env:UV_PYTHON_INSTALL_DIR = "$env:RUNNER_TEMP/facility-managed-python"
          uv venv --python 3.12.16 "$env:RUNNER_TEMP/facility-env"
          if ($LASTEXITCODE -ne 0) { throw 'Python setup failed' }
          $py = "$env:RUNNER_TEMP/facility-env/Scripts/python.exe"
          uv pip install --python $py -r "$env:RUNNER_TEMP/facs-v22-exact-source/integration/requirements.lock.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency install failed' }
          uv pip check --python $py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency verification failed' }
          "FACILITY_PY=$py" >> $env:GITHUB_ENV
          "NATIVE_DIAGNOSTICS_SOURCE=$env:RUNNER_TEMP/facs-v22-exact-source" >> $env:GITHUB_ENV
      - name: Native same-image and foreign-image process audit controls
        shell: pwsh
        run: |
          & $env:FACILITY_PY -B .validation/facs-v22-private-transfer/inspect_python_launch.py --output "$env:RUNNER_TEMP/facs-v22-evidence/python-launch-preflight.json"
          if ($LASTEXITCODE -ne 0) { throw 'Malformed standalone launch environment' }
          Push-Location "$env:RUNNER_TEMP/facs-v22-exact-source"
          try {
            & $env:FACILITY_PY -B -m pytest "$env:RUNNER_TEMP/facs-v22-exact-source/integration/test_standalone_process_images.py" -k native_child_identity --capture=sys -x -q --tb=long --junitxml="$env:RUNNER_TEMP/facs-v22-evidence/process-image-preflight.xml"
            $imageExit = $LASTEXITCODE
          } finally { Pop-Location }
          if ($imageExit -ne 0) { throw 'Native process-image controls failed' }
          & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/verify_process_image_preflight.py "$env:RUNNER_TEMP/facs-v22-evidence/process-image-preflight.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete native process-image preflight receipt' }
      - name: Untouched native-menu startup at frozen and small desktop sizes
        shell: pwsh
        run: |
          foreach ($size in @('1920x1080', '1024x768')) {
            $width, $height = $size.Split('x')
            $label = "$width-$height"
            & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/windows_display.py --width $width --height $height --exact --client 800x600 --evidence "$env:RUNNER_TEMP/facs-v22-evidence/startup-display-$label.json" -- $env:FACILITY_PY -B -m pytest "$env:RUNNER_TEMP/facs-v22-exact-source/integration/test_windows_startup_placement.py" -k native_untouched --capture=sys -q --tb=long --junitxml="$env:RUNNER_TEMP/facs-v22-evidence/startup-placement-$label.xml"
            if ($LASTEXITCODE -ne 0) { throw "Untouched native-menu startup failed at $label" }
            & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/verify_startup_receipt.py "$env:RUNNER_TEMP/facs-v22-evidence/startup-placement-$label.xml"
            if ($LASTEXITCODE -ne 0) { throw "Incomplete native startup receipt at $label" }
          }
      - name: Cold real-entry native startup at frozen and small desktop sizes
        shell: pwsh
        run: |
          foreach ($size in @('1920x1080', '1024x768')) {
            $width, $height = $size.Split('x')
            $label = "$width-$height"
            & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/windows_display.py --width $width --height $height --exact --client 800x600 --evidence "$env:RUNNER_TEMP/facs-v22-evidence/cold-startup-display-$label.json" -- $env:FACILITY_PY -B -m pytest "$env:RUNNER_TEMP/facs-v22-exact-source/integration/test_windows_cold_startup.py" -k cold_real_entry --capture=sys -x -q --tb=long --basetemp="$env:RUNNER_TEMP/facs-cold-startup-processes-$label" --junitxml="$env:RUNNER_TEMP/facs-v22-evidence/cold-startup-placement-$label.xml"
            $coldExit = $LASTEXITCODE
            & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/preserve_cold_startup_traces.py --source "$env:RUNNER_TEMP/facs-cold-startup-processes-$label" --output "$env:RUNNER_TEMP/facs-v22-evidence/cold-startup-processes-$label"
            if ($LASTEXITCODE -ne 0) { throw "Cold startup trace preservation failed at $label" }
            if ($coldExit -ne 0) { throw "Cold real-entry startup failed at $label" }
            & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/verify_cold_startup_receipt.py "$env:RUNNER_TEMP/facs-v22-evidence/cold-startup-placement-$label.xml" --source "$env:RUNNER_TEMP/facs-v22-exact-source"
            if ($LASTEXITCODE -ne 0) { throw "Incomplete cold startup receipt at $label" }
          }
      - name: Native bilingual menus and selector fit at both desktop sizes
        shell: pwsh
        run: |
          foreach ($size in @('1920x1080', '1024x768')) {
            $width, $height = $size.Split('x')
            $label = "$width-$height"
            $env:FACILITY_NATIVE_DISPLAY_PROFILE = if ($width -eq '1920') { 'frozen1920' } else { 'small1024' }
            & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/windows_display.py --width $width --height $height --exact --client 800x600 --evidence "$env:RUNNER_TEMP/facs-v22-evidence/native-language-fit-display-$label.json" -- $env:FACILITY_PY -B -m pytest "$env:RUNNER_TEMP/facs-v22-exact-source/integration/test_windows_english_startup_native.py" --capture=sys -x -q --tb=long --junitxml="$env:RUNNER_TEMP/facs-v22-evidence/native-language-fit-$label.xml"
            if ($LASTEXITCODE -ne 0) { throw "Native bilingual menu/selector fit failed at $label" }
            & $env:FACILITY_PY -B .validation/facs-v22-reviewed/native_diagnostics/verify_native_language_fit.py "$env:RUNNER_TEMP/facs-v22-evidence/native-language-fit-$label.xml" --profile $env:FACILITY_NATIVE_DISPLAY_PROFILE
            if ($LASTEXITCODE -ne 0) { throw "Incomplete native language/fit receipt at $label" }
          }
          Remove-Item Env:FACILITY_NATIVE_DISPLAY_PROFILE
      - name: Full native suites with verified large desktop and sys capture
        shell: pwsh
        env:
          FACILITY_NATIVE_DISPLAY_PROFILE: suite1600
        run: |
          & $env:FACILITY_PY .validation/facs-v22-reviewed/native_diagnostics/windows_display.py --width 1600 --height 1200 --client 1480x1000 --evidence "$env:RUNNER_TEMP/facs-v22-evidence/display-large.json" -- $env:FACILITY_PY .validation/facs-v22-reviewed/run_reviewed_validation.py tests
          if ($LASTEXITCODE -ne 0) { throw 'Full native suite or real desktop constraint failed' }
      - name: Preserve primary results before lifecycle stress
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-reviewed-primary-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/facs-v22-evidence/**
            !${{ runner.temp }}/facs-v22-evidence/source-v22.zip
          retention-days: 14
          if-no-files-found: error
      - name: Corrected fresh Tcl and Tk bootstrap contract
        if: ${{ !cancelled() && env.FACILITY_PY != '' }}
        shell: pwsh
        run: |
          $env:TCL_CAPTURE_PROBE_EVENTS = "$env:RUNNER_TEMP/facs-v22-evidence/corrected-tcl-bootstrap.jsonl"
          $env:TCL_CAPTURE_PROBE_COUNT = '50'
          & $env:FACILITY_PY -m pytest .validation/facs-v22-reviewed/native_diagnostics/test_tcl_capture_probe.py --capture=sys -q --tb=long --junitxml="$env:RUNNER_TEMP/facs-v22-evidence/corrected-tcl-bootstrap.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Tcl or Tk bootstrap contract failed' }
      - name: Repeated isolated, module-context and predecessor Tk lifecycle checks
        if: ${{ !cancelled() && env.FACILITY_PY != '' }}
        shell: pwsh
        run: |
          & $env:FACILITY_PY .validation/facs-v22-reviewed/native_diagnostics/run_lifecycle_diagnostics.py --source "$env:NATIVE_DIAGNOSTICS_SOURCE" --output "$env:RUNNER_TEMP/facs-v22-evidence/tk-lifecycle" --rounds 3
          if ($LASTEXITCODE -ne 0) { throw 'At least one Tk lifecycle attempt failed' }
      - name: Real 1024 by 768 header, wheel and dialog reachability checks
        if: ${{ !cancelled() && env.FACILITY_PY != '' }}
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .validation/facs-v22-reviewed/native_diagnostics).Path
          $env:NATIVE_TK_TRACE = "$env:RUNNER_TEMP/facs-v22-evidence/small-screen-tk-events.jsonl"
          & $env:FACILITY_PY .validation/facs-v22-reviewed/native_diagnostics/windows_display.py --width 1024 --height 768 --exact --client 980x600 --evidence "$env:RUNNER_TEMP/facs-v22-evidence/display-small.json" -- $env:FACILITY_PY -m pytest -p native_tk_trace .validation/facs-v22-reviewed/native_diagnostics/test_native_smallscreen.py -q --tb=long --junitxml="$env:RUNNER_TEMP/facs-v22-evidence/small-screen.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Actual small-screen controls or native display checks failed' }
      - name: Preserve every outcome without publishing binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v22-reviewed-native-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/facs-v22-evidence/**
            !${{ runner.temp }}/facs-v22-evidence/source-v22.zip
            !${{ runner.temp }}/**/*.exe
          retention-days: 14
          if-no-files-found: error
