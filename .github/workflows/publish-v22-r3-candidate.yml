# Publication is complete. This workflow now has read-only permissions.
name: Verify published complete v22 r3 Mac ZIP

"on":
  push:
    branches: ["delivery/facs-v22-r3-macos-arm64-20261108"]
    paths:
      - ".delivery/facs-v22-r3/**"
      - ".github/workflows/publish-v22-r3-candidate.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'azx4121/facility-studio' && github.ref == 'refs/heads/delivery/facs-v22-r3-macos-arm64-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_REPO: azx4121/facility-studio
    steps:
      - name: Check out the verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the exact published candidate without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/438174333" > release.json
          python3 -c 'import json; r=json.load(open("release.json")); assert r["id"] == 438174333 and r["target_commitish"] == "478f08b236a05409a63a01e646f0e83363c7963e" and r["draft"] is False'
      - name: Download anonymously and verify complete bytes
        env:
          VERIFY_PUBLIC: "1"
        run: python3 .delivery/facs-v22-r3/verify_release.py
