# One-time owner-requested distribution of an unchanged, unvalidated candidate.
# This does not invoke or relax any formal product release/build/acceptance gate.
name: Publish complete v22 r3 Mac candidate

"on":
  push:
    branches: ["delivery/facs-v22-r3-macos-arm64-20261108"]
    paths:
      - ".delivery/facs-v22-r3/**"
      - ".github/workflows/publish-v22-r3-candidate.yml"

permissions:
  contents: read

concurrency:
  group: publish-facs-v22-r3-candidate
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'azx4121/facility-studio' && github.ref == 'refs/heads/delivery/facs-v22-r3-macos-arm64-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_REPO: azx4121/facility-studio
      TAG: facs-v22-r3-macos-arm64-unvalidated
      ZIP: FACS-v22-r3-UNVALIDATED-COMPILE-ONLY-macOS-arm64.zip
      EXPECTED_MAIN: b4ba2c0982636142ce878d75d2845f86b38eb9db
    steps:
      - name: Check out the exact distribution commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify unchanged candidate bytes without executing it
        run: python3 .delivery/facs-v22-r3/assemble.py
      - name: Verify the exact draft created by this distribution task
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api "repos/$GH_REPO/releases/438174333" > release.json
          python3 -c 'import json; r=json.load(open("release.json")); assert r["id"] == 438174333 and r["target_commitish"] == "478f08b236a05409a63a01e646f0e83363c7963e" and r["draft"] is True'
          python3 .delivery/facs-v22-r3/verify_release.py
      - name: Publish only that verified draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')" = "$EXPECTED_MAIN"
          gh api --method PATCH "repos/$GH_REPO/releases/438174333" -F draft=false -F prerelease=true -f make_latest=false > release.json
      - name: Verify the unauthenticated complete public download
        env:
          VERIFY_PUBLIC: "1"
        run: python3 .delivery/facs-v22-r3/verify_release.py
